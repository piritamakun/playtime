<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>デジタルプラットフォーム - P2P Gaming</title>
    <!-- PeerJS (P2P通信用ライブラリ) -->
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
    <style>
        :root {
            --bg-color: #0b0c10;
            --panel-bg: rgba(31, 40, 51, 0.7);
            --neon-cyan: #66fcf1;
            --neon-blue: #45a29e;
            --neon-green: #00ff66;
            --neon-red: #ff3366;
            --text-main: #c5c6c7;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow-x: hidden;
        }

        /* ヘッダー */
        header {
            background: rgba(11, 12, 16, 0.9);
            padding: 20px;
            text-align: center;
            border-bottom: 2px solid var(--neon-cyan);
            box-shadow: 0 0 15px var(--neon-cyan);
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(10px);
        }
        header h1 {
            margin: 0;
            color: var(--neon-cyan);
            text-shadow: 0 0 10px var(--neon-cyan);
            letter-spacing: 2px;
        }

        /* P2P 接続ステータス表示 */
        #p2p-status-bar {
            margin-top: 8px;
            font-size: 0.9em;
            font-family: monospace;
            color: #888;
        }
        .status-online {
            color: var(--neon-green) !important;
            text-shadow: 0 0 8px var(--neon-green);
        }

        /* メインのゲーム一覧 */
        #game-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
            padding: 40px;
        }

        .game-card {
            position: relative;
            background: var(--panel-bg);
            border: 1px solid var(--neon-blue);
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(5px);
            box-shadow: 0 0 10px rgba(69, 162, 158, 0.2);
            animation: fadeIn 0.5s ease-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .game-card:hover {
            transform: translateY(-5px) scale(1.02);
            box-shadow: 0 0 20px var(--neon-cyan);
            border-color: var(--neon-cyan);
        }
        .game-card h3 {
            color: white;
            margin-bottom: 5px;
        }
        .game-card .tag {
            font-size: 0.8em;
            color: var(--neon-cyan);
            border: 1px solid var(--neon-cyan);
            padding: 2px 8px;
            border-radius: 10px;
            display: inline-block;
        }

        /* 削除ボタン（923を入力した管理者のみ表示） */
        .delete-btn {
            display: none;
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.5);
            color: var(--neon-red);
            border: 1px solid var(--neon-red);
            border-radius: 5px;
            padding: 5px 10px;
            cursor: pointer;
            font-size: 0.8em;
            font-weight: bold;
            transition: 0.2s;
            z-index: 10;
        }
        .delete-btn:hover {
            background: var(--neon-red);
            color: white;
            box-shadow: 0 0 10px var(--neon-red);
        }

        body.dev-mode .delete-btn {
            display: block;
        }

        /* ゲーム公開モーダル */
        #publish-modal {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80%;
            max-width: 600px;
            background: rgba(11, 12, 16, 0.95);
            border: 2px solid var(--neon-cyan);
            box-shadow: 0 0 30px var(--neon-cyan);
            border-radius: 20px;
            padding: 30px;
            z-index: 200;
            backdrop-filter: blur(15px);
        }
        
        #publish-modal h2 {
            color: var(--neon-cyan);
            text-align: center;
            margin-top: 0;
        }

        #drop-zone {
            border: 2px dashed var(--neon-blue);
            border-radius: 10px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: var(--neon-blue);
            font-size: 1.1em;
            margin-bottom: 20px;
            transition: 0.3s;
            min-height: 120px;
        }
        #drop-zone.dragover {
            background: rgba(102, 252, 241, 0.2);
            border-color: var(--neon-cyan);
            color: var(--neon-cyan);
            box-shadow: inset 0 0 15px var(--neon-cyan);
        }

        #game-details {
            display: none;
            text-align: center;
        }
        #game-details input {
            width: 80%;
            padding: 10px;
            margin-bottom: 20px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid var(--neon-blue);
            color: white;
            border-radius: 5px;
            font-size: 1.1em;
            outline: none;
        }
        #game-details input:focus {
            border-color: var(--neon-cyan);
            box-shadow: 0 0 10px var(--neon-cyan);
        }

        button.cyber-btn {
            background: transparent;
            color: var(--neon-cyan);
            border: 2px solid var(--neon-cyan);
            padding: 10px 25px;
            font-size: 1em;
            cursor: pointer;
            border-radius: 5px;
            transition: 0.3s;
            text-transform: uppercase;
            font-weight: bold;
        }
        button.cyber-btn:hover {
            background: var(--neon-cyan);
            color: var(--bg-color);
            box-shadow: 0 0 15px var(--neon-cyan);
        }

        /* ゲームプレイ画面 */
        #play-screen {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg-color);
            z-index: 300;
        }
        #play-screen iframe {
            width: 100%;
            height: calc(100% - 60px);
            border: none;
        }
        .close-btn {
            height: 60px;
            background: rgba(11, 12, 16, 0.9);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            border-bottom: 1px solid var(--neon-blue);
        }
    </style>
</head>
<body>

    <header>
        <h1>デジタルプラットフォーム</h1>
        <div id="p2p-status-bar">ネットワーク状態: <span id="p2p-status">接続中...</span></div>
    </header>

    <!-- メインのゲーム一覧 -->
    <div id="game-grid"></div>

    <!-- ゲーム公開モーダル -->
    <div id="publish-modal">
        <h2>開発者スタジオ</h2>
        
        <div id="drop-zone">
            <span id="drop-text">ここに HTMLファイル をドロップ</span>
            <span style="margin: 8px 0; font-size: 0.8em; opacity: 0.7;">または</span>
            <button class="cyber-btn" id="select-file-btn" type="button" style="font-size: 0.9em; padding: 6px 15px;">ファイルを選択</button>
            <input type="file" id="file-input" accept=".html,.htm" style="display: none;">
        </div>
        
        <div id="game-details">
            <input type="text" id="game-name" placeholder="ゲームの名前を入力してください">
            <br>
            <button class="cyber-btn" id="publish-btn">P2Pネットワークへ公開</button>
        </div>
    </div>

    <!-- ゲームプレイ画面 -->
    <div id="play-screen">
        <div class="close-btn">
            <h2 id="playing-title" style="color: var(--neon-cyan); margin: 0;"></h2>
            <button class="cyber-btn" onclick="closeGame()" style="padding: 5px 15px;">終了 / EXIT</button>
        </div>
        <iframe id="game-frame"></iframe>
    </div>

    <script>
        // -----------------------------
        // LocalStorage (ローカル自動保存機能)
        // -----------------------------
        const STORAGE_KEY = "digital_platform_saved_games_v3";

        function loadGamesFromStorage() {
            try {
                const saved = localStorage.getItem(STORAGE_KEY);
                return saved ? JSON.parse(saved) : [];
            } catch (e) {
                console.error("ローカルデータの読み込み失敗:", e);
                return [];
            }
        }

        function saveGamesToStorage() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(globalGames));
            } catch (e) {
                console.error("ローカルデータの保存失敗:", e);
            }
        }


        // -----------------------------
        // 1. P2P 通信機能 (WebRTC / PeerJS)
        // -----------------------------
        const GLOBAL_ROOM_ID = "digital-platform-v3-persistent-room-923";
        let myPeer = null;
        let hubConn = null;
        let activeConnections = [];
        let isHub = false;
        
        // 起動時に保存されたゲームをロード
        let globalGames = loadGamesFromStorage();

        const statusEl = document.getElementById('p2p-status');

        function initApp() {
            // ローカル保存されているゲームを画面に表示
            renderAllGames();

            // P2P通信初期化
            myPeer = new Peer();

            myPeer.on('open', (id) => {
                connectToHub();
            });

            myPeer.on('error', (err) => {
                if (err.type === 'peer-unavailable' && !isHub) {
                    becomeHub();
                }
            });
        }

        function becomeHub() {
            isHub = true;
            if (myPeer) myPeer.destroy();

            myPeer = new Peer(GLOBAL_ROOM_ID);

            myPeer.on('open', () => {
                statusEl.innerText = "ホストとして稼働中 (HUB ACTIVE)";
                statusEl.classList.add('status-online');
            });

            myPeer.on('connection', (conn) => {
                activeConnections.push(conn);

                conn.on('open', () => {
                    // 新規参加者に持っているゲームデータを共有
                    conn.send({ type: 'SYNC_GAMES', games: globalGames });
                });

                conn.on('data', (data) => {
                    if (data.type === 'NEW_GAME') {
                        mergeGame(data.game);
                        broadcast(data);
                    } else if (data.type === 'DELETE_GAME') {
                        removeGameLocally(data.id);
                        broadcast(data);
                    }
                });

                conn.on('close', () => {
                    activeConnections = activeConnections.filter(c => c !== conn);
                });
            });
        }

        function connectToHub() {
            hubConn = myPeer.connect(GLOBAL_ROOM_ID);

            hubConn.on('open', () => {
                statusEl.innerText = "ネットワークに接続済み (CONNECTED)";
                statusEl.classList.add('status-online');

                hubConn.on('data', (data) => {
                    handleP2PMessage(data);
                });
            });

            setTimeout(() => {
                if (!hubConn || !hubConn.open) {
                    becomeHub();
                }
            }, 3000);
        }

        function broadcast(data) {
            activeConnections.forEach(conn => {
                if (conn.open) conn.send(data);
            });
        }

        function handleP2PMessage(data) {
            if (data.type === 'SYNC_GAMES') {
                if (Array.isArray(data.games)) {
                    data.games.forEach(g => mergeGame(g));
                }
            } else if (data.type === 'NEW_GAME') {
                mergeGame(data.game);
            } else if (data.type === 'DELETE_GAME') {
                removeGameLocally(data.id);
            }
        }

        // ゲームデータをリストに追加して保存
        function mergeGame(gameData) {
            const index = globalGames.findIndex(g => g.id === gameData.id);
            if (index === -1) {
                globalGames.push(gameData);
                saveGamesToStorage();
                addGameCardToDOM(gameData);
            }
        }

        function broadcastNewGame(name, htmlContent) {
            const gameData = {
                id: 'game-' + Date.now() + '-' + Math.floor(Math.random() * 1000),
                name: name,
                htmlContent: htmlContent
            };

            mergeGame(gameData);

            if (isHub) {
                broadcast({ type: 'NEW_GAME', game: gameData });
            } else if (hubConn && hubConn.open) {
                hubConn.send({ type: 'NEW_GAME', game: gameData });
            }
        }

        function triggerDeleteGame(id) {
            removeGameLocally(id);

            if (isHub) {
                broadcast({ type: 'DELETE_GAME', id: id });
            } else if (hubConn && hubConn.open) {
                hubConn.send({ type: 'DELETE_GAME', id: id });
            }
        }

        function removeGameLocally(id) {
            globalGames = globalGames.filter(g => g.id !== id);
            saveGamesToStorage(); // 保存領域からも消去

            const cardElement = document.getElementById(id);
            if (cardElement) {
                cardElement.style.transform = "scale(0)";
                setTimeout(() => cardElement.remove(), 300);
            }
        }

        window.addEventListener('load', initApp);


        // -----------------------------
        // 2. 隠しコマンド (923 + c) と管理者機能
        // -----------------------------
        let keyBuffer = "";
        let isDevUnlocked = false;
        const modal = document.getElementById('publish-modal');

        window.addEventListener('keydown', (e) => {
            keyBuffer += e.key;
            if (keyBuffer.length > 10) keyBuffer = keyBuffer.slice(-10);

            // 923を入力すると管理者モード解除（削除ボタン出現）
            if (keyBuffer.includes("923") && !isDevUnlocked) {
                isDevUnlocked = true;
                document.body.classList.add('dev-mode');
                console.log("管理者モード: 解除完了");
            }

            // cキーで公開モーダル開閉
            if (isDevUnlocked && e.key.toLowerCase() === 'c') {
                if (modal.style.display === 'block') {
                    modal.style.display = 'none';
                } else {
                    modal.style.display = 'block';
                    resetModal();
                }
            }
        });


        // -----------------------------
        // 3. ゲームカードのレンダリング
        // -----------------------------
        function renderAllGames() {
            document.getElementById('game-grid').innerHTML = "";
            globalGames.forEach(g => addGameCardToDOM(g));
        }

        function addGameCardToDOM(gameData) {
            const grid = document.getElementById('game-grid');
            if(document.getElementById(gameData.id)) return;

            const card = document.createElement('div');
            card.className = 'game-card';
            card.id = gameData.id;
            
            // 削除ボタン (923入力の管理者のみ表示)
            const delBtn = document.createElement('button');
            delBtn.className = 'delete-btn';
            delBtn.innerText = '削除';
            delBtn.onclick = (e) => {
                e.stopPropagation();
                if(confirm(`「${gameData.name}」を全員の画面から完全に削除しますか？`)) {
                    triggerDeleteGame(gameData.id);
                }
            };

            const content = document.createElement('div');
            content.innerHTML = `
                <h3>${gameData.name}</h3>
                <span class="tag">P2P LIVE</span>
            `;

            card.appendChild(delBtn);
            card.appendChild(content);

            card.addEventListener('click', () => {
                playGame(gameData.name, gameData.htmlContent);
            });

            grid.insertBefore(card, grid.firstChild);
        }


        // -----------------------------
        // 4. ファイルアップロード処理
        // -----------------------------
        const dropZone = document.getElementById('drop-zone');
        const dropText = document.getElementById('drop-text');
        const gameDetails = document.getElementById('game-details');
        const gameNameInput = document.getElementById('game-name');
        const selectFileBtn = document.getElementById('select-file-btn');
        const fileInput = document.getElementById('file-input');
        let uploadedHtmlContent = "";

        function processFile(file) {
            if (file && (file.name.endsWith('.html') || file.name.endsWith('.htm'))) {
                const reader = new FileReader();
                reader.onload = function(evt) {
                    uploadedHtmlContent = evt.target.result;
                    dropText.innerHTML = `選択済み: <b style="color:var(--neon-cyan);">${file.name}</b>`;
                    dropZone.style.borderColor = "var(--neon-cyan)";
                    gameDetails.style.display = "block";
                    gameNameInput.focus();
                };
                reader.readAsText(file);
            } else {
                alert("HTMLファイル（.html / .htm）のみアップロード可能です！");
            }
        }

        selectFileBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            fileInput.click();
        });

        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                processFile(e.target.files[0]);
            }
        });

        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(evt => {
            dropZone.addEventListener(evt, e => { e.preventDefault(); e.stopPropagation(); }, false);
        });

        ['dragenter', 'dragover'].forEach(evt => {
            dropZone.addEventListener(evt, () => dropZone.classList.add('dragover'), false);
        });
        ['dragleave', 'drop'].forEach(evt => {
            dropZone.addEventListener(evt, () => dropZone.classList.remove('dragover'), false);
        });

        dropZone.addEventListener('drop', (e) => {
            const files = e.dataTransfer.files;
            if (files.length > 0) {
                processFile(files[0]);
            }
        });

        document.getElementById('publish-btn').addEventListener('click', () => {
            const gameName = gameNameInput.value.trim();
            if (!gameName) {
                alert("ゲームの名前を入力してください！");
                return;
            }
            broadcastNewGame(gameName, uploadedHtmlContent);
            modal.style.display = 'none';
            resetModal();
        });

        function resetModal() {
            dropText.innerHTML = "ここに HTMLファイル をドロップ";
            dropZone.style.borderColor = "var(--neon-blue)";
            gameDetails.style.display = "none";
            gameNameInput.value = "";
            fileInput.value = "";
            uploadedHtmlContent = "";
        }


        // -----------------------------
        // 5. ゲームのプレイ (iframe)
        // -----------------------------
        const playScreen = document.getElementById('play-screen');
        const gameFrame = document.getElementById('game-frame');
        const playingTitle = document.getElementById('playing-title');

        function playGame(name, htmlCode) {
            playingTitle.innerText = name;
            gameFrame.srcdoc = htmlCode;
            playScreen.style.display = 'block';
        }

        function closeGame() {
            playScreen.style.display = 'none';
            gameFrame.srcdoc = "";
        }
    </script>

</body>
</html>
