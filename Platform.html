<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>デジタルプラットフォーム - P2P Network</title>
    <!-- PeerJS (P2P通信用ライブラリ) -->
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
    <style>
        :root {
            --bg-color: #0b0c10;
            --panel-bg: rgba(31, 40, 51, 0.7);
            --neon-cyan: #66fcf1;
            --neon-blue: #45a29e;
            --neon-green: #00ff66;
            --neon-red: #ff3366;
            --text-main: #c5c6c7;
            --sidebar-width: 250px;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow-x: hidden;
            display: flex; /* サイドバーとメインコンテンツを横並びに */
            height: 100vh;
        }

        /* -------------------------------------------
           左側のサイドバー
        ------------------------------------------- */
        #sidebar {
            width: var(--sidebar-width);
            background: rgba(11, 12, 16, 0.95);
            border-right: 2px solid var(--neon-cyan);
            box-shadow: 2px 0 15px rgba(102, 252, 241, 0.3);
            display: flex;
            flex-direction: column;
            padding: 20px 0;
            z-index: 100;
        }

        #sidebar h2 {
            text-align: center;
            color: var(--neon-cyan);
            letter-spacing: 2px;
            margin-bottom: 40px;
            text-shadow: 0 0 10px var(--neon-cyan);
        }

        .nav-btn {
            background: transparent;
            color: var(--text-main);
            border: none;
            border-left: 5px solid transparent;
            padding: 20px;
            font-size: 1.2em;
            text-align: left;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: bold;
            letter-spacing: 2px;
        }

        .nav-btn:hover {
            background: rgba(102, 252, 241, 0.1);
            color: white;
        }

        .nav-btn.active {
            background: rgba(102, 252, 241, 0.2);
            color: var(--neon-cyan);
            border-left: 5px solid var(--neon-cyan);
            box-shadow: inset 10px 0 15px -10px var(--neon-cyan);
            text-shadow: 0 0 5px var(--neon-cyan);
        }

        /* メインコンテンツエリア */
        #main-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        /* ヘッダー */
        header {
            background: rgba(11, 12, 16, 0.9);
            padding: 15px;
            text-align: center;
            border-bottom: 2px solid var(--neon-blue);
            position: sticky;
            top: 0;
            z-index: 90;
            backdrop-filter: blur(10px);
        }
        header h1 {
            margin: 0;
            font-size: 1.5em;
            color: var(--text-main);
        }

        #p2p-status-bar {
            margin-top: 5px;
            font-size: 0.9em;
            font-family: monospace;
            color: #888;
        }
        .status-online {
            color: var(--neon-green) !important;
            text-shadow: 0 0 8px var(--neon-green);
        }

        /* メインのアイテム一覧 */
        #content-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
            padding: 40px;
        }

        /* カードデザイン */
        .item-card {
            position: relative;
            background: var(--panel-bg);
            border: 1px solid var(--neon-blue);
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(5px);
            box-shadow: 0 0 10px rgba(69, 162, 158, 0.2);
            animation: fadeIn 0.5s ease-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .item-card:hover {
            transform: translateY(-5px) scale(1.02);
            box-shadow: 0 0 20px var(--neon-cyan);
            border-color: var(--neon-cyan);
        }
        .item-card h3 {
            color: white;
            margin-bottom: 5px;
            word-wrap: break-word;
        }
        .item-card .tag {
            font-size: 0.8em;
            color: var(--neon-cyan);
            border: 1px solid var(--neon-cyan);
            padding: 2px 8px;
            border-radius: 10px;
            display: inline-block;
            margin-top: 5px;
        }
        .item-card .type-icon {
            font-size: 2em;
            margin-bottom: 10px;
        }

        /* 削除ボタン（923入力の管理者モード時のみ） */
        .delete-btn {
            display: none;
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.5);
            color: var(--neon-red);
            border: 1px solid var(--neon-red);
            border-radius: 5px;
            padding: 5px 10px;
            cursor: pointer;
            font-size: 0.8em;
            font-weight: bold;
            transition: 0.2s;
            z-index: 10;
        }
        .delete-btn:hover {
            background: var(--neon-red);
            color: white;
            box-shadow: 0 0 10px var(--neon-red);
        }
        body.dev-mode .delete-btn {
            display: block;
        }

        /* 開発者モーダル */
        #publish-modal {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80%;
            max-width: 600px;
            background: rgba(11, 12, 16, 0.95);
            border: 2px solid var(--neon-cyan);
            box-shadow: 0 0 30px var(--neon-cyan);
            border-radius: 20px;
            padding: 30px;
            z-index: 200;
            backdrop-filter: blur(15px);
        }
        #publish-modal h2 {
            color: var(--neon-cyan);
            text-align: center;
            margin-top: 0;
        }

        #drop-zone {
            border: 2px dashed var(--neon-blue);
            border-radius: 10px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: var(--neon-blue);
            font-size: 1.1em;
            margin-bottom: 20px;
            transition: 0.3s;
            min-height: 120px;
            text-align: center;
        }
        #drop-zone.dragover {
            background: rgba(102, 252, 241, 0.2);
            border-color: var(--neon-cyan);
            color: var(--neon-cyan);
            box-shadow: inset 0 0 15px var(--neon-cyan);
        }

        #item-details {
            display: none;
            text-align: center;
        }
        #item-details input {
            width: 80%;
            padding: 10px;
            margin-bottom: 20px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid var(--neon-blue);
            color: white;
            border-radius: 5px;
            font-size: 1.1em;
            outline: none;
        }
        #item-details input:focus {
            border-color: var(--neon-cyan);
            box-shadow: 0 0 10px var(--neon-cyan);
        }

        button.cyber-btn {
            background: transparent;
            color: var(--neon-cyan);
            border: 2px solid var(--neon-cyan);
            padding: 10px 25px;
            font-size: 1em;
            cursor: pointer;
            border-radius: 5px;
            transition: 0.3s;
            text-transform: uppercase;
            font-weight: bold;
        }
        button.cyber-btn:hover {
            background: var(--neon-cyan);
            color: var(--bg-color);
            box-shadow: 0 0 15px var(--neon-cyan);
        }

        /* プレイ/閲覧 画面 */
        #play-screen {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg-color);
            z-index: 300;
            display: flex;
            flex-direction: column;
        }
        .close-btn {
            height: 60px;
            background: rgba(11, 12, 16, 0.9);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            border-bottom: 1px solid var(--neon-blue);
        }
        
        /* 表示用コンテナ */
        #viewer-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden; /* 画像拡大時はみ出し防止用 */
        }
        #game-frame {
            width: 100%;
            height: 100%;
            border: none;
            display: none;
        }
        #music-player {
            display: none;
            outline: none;
            width: 80%;
            max-width: 500px;
        }
        #image-viewer {
            display: none;
            max-width: 90%;
            max-height: 90%;
            border: 2px solid var(--neon-cyan);
            box-shadow: 0 0 20px var(--neon-cyan);
            border-radius: 10px;
            transition: transform 0.1s ease-out; /* 拡大縮小アニメーション */
            cursor: grab; /* ドラッグ可能であることを示す */
            user-select: none;
        }

        /* CSSハック（初期状態は画面非表示） */
        #play-screen { display: none; }
    </style>
</head>
<body>

    <!-- サイドバー -->
    <aside id="sidebar">
        <h2>DIGITAL<br>PLATFORM</h2>
        <button class="nav-btn active" onclick="switchTab('game')">🎮 ゲーム</button>
        <button class="nav-btn" onclick="switchTab('music')">🎵 音楽</button>
        <button class="nav-btn" onclick="switchTab('illustration')">🎨 イラスト</button>
    </aside>

    <!-- メインコンテンツ -->
    <main id="main-area">
        <header>
            <h1 id="current-tab-title">ゲーム一覧</h1>
            <div id="p2p-status-bar">ネットワーク状態: <span id="p2p-status">接続中...</span></div>
        </header>

        <!-- メインのアイテム一覧 -->
        <div id="content-grid"></div>
    </main>

    <!-- 開発者スタジオ (モーダル) -->
    <div id="publish-modal">
        <h2>開発者スタジオ</h2>
        
        <div id="drop-zone">
            <span id="drop-text">HTML / 音楽(mp3等) / 画像 をドロップ</span>
            <span style="margin: 8px 0; font-size: 0.8em; opacity: 0.7;">または</span>
            <button class="cyber-btn" id="select-file-btn" type="button" style="font-size: 0.9em; padding: 6px 15px;">ファイルを選択</button>
            <input type="file" id="file-input" accept=".html,.htm,audio/*,image/*" style="display: none;">
        </div>
        
        <div id="item-details">
            <div style="color: var(--neon-cyan); margin-bottom: 10px; font-weight: bold;" id="detected-type-label"></div>
            <input type="text" id="item-name" placeholder="作品の名前を入力してください">
            <br>
            <button class="cyber-btn" id="publish-btn">P2Pネットワークへ公開</button>
        </div>
    </div>

    <!-- プレイ/閲覧画面 -->
    <div id="play-screen">
        <div class="close-btn">
            <h2 id="playing-title" style="color: var(--neon-cyan); margin: 0;"></h2>
            <button class="cyber-btn" onclick="closeViewer()" style="padding: 5px 15px;">終了 / EXIT</button>
        </div>
        <div id="viewer-container">
            <iframe id="game-frame"></iframe>
            <!-- loop属性を追加し、自動ループ再生化 -->
            <audio id="music-player" controls loop></audio>
            <img id="image-viewer" src="" alt="Illustration" draggable="false">
        </div>
    </div>

    <script>
        // -----------------------------
        // タブ切り替え機能
        // -----------------------------
        let currentTab = 'game'; // 'game', 'music', 'illustration'

        function switchTab(tabName) {
            currentTab = tabName;
            
            // UIの切り替え
            document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
            if(tabName === 'game') {
                document.querySelectorAll('.nav-btn')[0].classList.add('active');
                document.getElementById('current-tab-title').innerText = "ゲーム一覧";
            } else if (tabName === 'music') {
                document.querySelectorAll('.nav-btn')[1].classList.add('active');
                document.getElementById('current-tab-title').innerText = "音楽一覧";
            } else if (tabName === 'illustration') {
                document.querySelectorAll('.nav-btn')[2].classList.add('active');
                document.getElementById('current-tab-title').innerText = "イラスト一覧";
            }

            // 画面の再描画
            renderAllItems();
        }

        // -----------------------------
        // LocalStorage (ローカル自動保存機能)
        // -----------------------------
        const STORAGE_KEY = "digital_platform_saved_items_v4";

        function loadItemsFromStorage() {
            try {
                const saved = localStorage.getItem(STORAGE_KEY);
                return saved ? JSON.parse(saved) : [];
            } catch (e) {
                console.error("ローカルデータの読み込み失敗:", e);
                return [];
            }
        }

        function saveItemsToStorage() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(globalItems));
            } catch (e) {
                console.error("データのサイズが大きすぎるためローカル保存に失敗しました:", e);
            }
        }

        // -----------------------------
        // 1. P2P 通信機能 (WebRTC / PeerJS)
        // -----------------------------
        const GLOBAL_ROOM_ID = "digital-platform-v4-multimedia-923";
        let myPeer = null;
        let hubConn = null;
        let activeConnections = [];
        let isHub = false;
        
        let globalItems = loadItemsFromStorage();
        const statusEl = document.getElementById('p2p-status');

        function initApp() {
            renderAllItems();

            myPeer = new Peer();

            myPeer.on('open', (id) => {
                connectToHub();
            });

            myPeer.on('error', (err) => {
                if (err.type === 'peer-unavailable' && !isHub) {
                    becomeHub();
                }
            });
        }

        function becomeHub() {
            isHub = true;
            if (myPeer) myPeer.destroy();
            myPeer = new Peer(GLOBAL_ROOM_ID);

            myPeer.on('open', () => {
                statusEl.innerText = "ホストとして稼働中 (HUB ACTIVE)";
                statusEl.classList.add('status-online');
            });

            myPeer.on('connection', (conn) => {
                activeConnections.push(conn);
                conn.on('open', () => {
                    conn.send({ type: 'SYNC_ITEMS', items: globalItems });
                });
                conn.on('data', (data) => {
                    if (data.type === 'NEW_ITEM') {
                        mergeItem(data.item);
                        broadcast(data);
                    } else if (data.type === 'DELETE_ITEM') {
                        removeItemLocally(data.id);
                        broadcast(data);
                    }
                });
                conn.on('close', () => {
                    activeConnections = activeConnections.filter(c => c !== conn);
                });
            });
        }

        function connectToHub() {
            hubConn = myPeer.connect(GLOBAL_ROOM_ID);
            hubConn.on('open', () => {
                statusEl.innerText = "ネットワークに接続済み (CONNECTED)";
                statusEl.classList.add('status-online');
                hubConn.on('data', (data) => {
                    handleP2PMessage(data);
                });
            });
            setTimeout(() => {
                if (!hubConn || !hubConn.open) becomeHub();
            }, 3000);
        }

        function broadcast(data) {
            activeConnections.forEach(conn => {
                if (conn.open) conn.send(data);
            });
        }

        function handleP2PMessage(data) {
            if (data.type === 'SYNC_ITEMS') {
                if (Array.isArray(data.items)) {
                    data.items.forEach(i => mergeItem(i));
                }
            } else if (data.type === 'NEW_ITEM') {
                mergeItem(data.item);
            } else if (data.type === 'DELETE_ITEM') {
                removeItemLocally(data.id);
            }
        }

        function mergeItem(itemData) {
            const index = globalItems.findIndex(i => i.id === itemData.id);
            if (index === -1) {
                globalItems.push(itemData);
                saveItemsToStorage();
                // 現在のタブと一致していれば画面に追加
                const type = itemData.fileType || 'game';
                if (type === currentTab) {
                    addItemCardToDOM(itemData);
                }
            }
        }

        function broadcastNewItem(name, content, type) {
            const itemData = {
                id: 'item-' + Date.now() + '-' + Math.floor(Math.random() * 1000),
                name: name,
                content: content,
                fileType: type // 'game', 'music', 'illustration'
            };

            mergeItem(itemData);

            if (isHub) {
                broadcast({ type: 'NEW_ITEM', item: itemData });
            } else if (hubConn && hubConn.open) {
                hubConn.send({ type: 'NEW_ITEM', item: itemData });
            }
        }

        function triggerDeleteItem(id) {
            removeItemLocally(id);
            if (isHub) {
                broadcast({ type: 'DELETE_ITEM', id: id });
            } else if (hubConn && hubConn.open) {
                hubConn.send({ type: 'DELETE_ITEM', id: id });
            }
        }

        function removeItemLocally(id) {
            globalItems = globalItems.filter(i => i.id !== id);
            saveItemsToStorage();
            const cardElement = document.getElementById(id);
            if (cardElement) {
                cardElement.style.transform = "scale(0)";
                setTimeout(() => cardElement.remove(), 300);
            }
        }

        window.addEventListener('load', initApp);

        // -----------------------------
        // 2. 隠しコマンド (923 + c) と管理者機能
        // -----------------------------
        let keyBuffer = "";
        let isDevUnlocked = false;
        const modal = document.getElementById('publish-modal');

        window.addEventListener('keydown', (e) => {
            keyBuffer += e.key;
            if (keyBuffer.length > 10) keyBuffer = keyBuffer.slice(-10);

            if (keyBuffer.includes("923") && !isDevUnlocked) {
                isDevUnlocked = true;
                document.body.classList.add('dev-mode');
                console.log("管理者モード: 解除完了");
            }

            if (isDevUnlocked && e.key.toLowerCase() === 'c') {
                if (modal.style.display === 'block') {
                    modal.style.display = 'none';
                } else {
                    modal.style.display = 'block';
                    resetModal();
                }
            }
        });

        // -----------------------------
        // 3. アイテムカードのレンダリング
        // -----------------------------
        function renderAllItems() {
            document.getElementById('content-grid').innerHTML = "";
            globalItems.forEach(item => {
                const type = item.fileType || 'game'; // 過去の互換性のため
                if (type === currentTab) {
                    addItemCardToDOM(item);
                }
            });
        }

        function addItemCardToDOM(itemData) {
            const grid = document.getElementById('content-grid');
            if(document.getElementById(itemData.id)) return;

            const type = itemData.fileType || 'game';
            
            const card = document.createElement('div');
            card.className = 'item-card';
            card.id = itemData.id;
            
            const delBtn = document.createElement('button');
            delBtn.className = 'delete-btn';
            delBtn.innerText = '削除';
            delBtn.onclick = (e) => {
                e.stopPropagation();
                if(confirm(`「${itemData.name}」を全員の画面から完全に削除しますか？`)) {
                    triggerDeleteItem(itemData.id);
                }
            };

            // アイコンの設定
            let icon = "🎮";
            let typeName = "GAME";
            if(type === 'music') { icon = "🎵"; typeName = "MUSIC"; }
            else if(type === 'illustration') { icon = "🎨"; typeName = "ART"; }

            const content = document.createElement('div');
            content.innerHTML = `
                <div class="type-icon">${icon}</div>
                <h3>${itemData.name}</h3>
                <span class="tag">${typeName}</span>
            `;

            card.appendChild(delBtn);
            card.appendChild(content);

            card.addEventListener('click', () => {
                openViewer(itemData.name, itemData.content, type);
            });

            grid.insertBefore(card, grid.firstChild);
        }

        // -----------------------------
        // 4. マルチファイルアップロード処理
        // -----------------------------
        const dropZone = document.getElementById('drop-zone');
        const dropText = document.getElementById('drop-text');
        const itemDetails = document.getElementById('item-details');
        const itemNameInput = document.getElementById('item-name');
        const selectFileBtn = document.getElementById('select-file-btn');
        const fileInput = document.getElementById('file-input');
        const typeLabel = document.getElementById('detected-type-label');
        
        let uploadedContent = "";
        let uploadedType = "game";

        function processFile(file) {
            if (!file) return;

            const reader = new FileReader();

            // ファイル形式の判定
            if (file.name.match(/\.(html|htm)$/i)) {
                uploadedType = "game";
                typeLabel.innerText = "種類: ゲーム (HTML)";
                reader.readAsText(file);
            } else if (file.type.startsWith("audio/")) {
                uploadedType = "music";
                typeLabel.innerText = "種類: 音楽 (Audio)";
                reader.readAsDataURL(file); // Base64エンコード
            } else if (file.type.startsWith("image/")) {
                uploadedType = "illustration";
                typeLabel.innerText = "種類: イラスト (Image)";
                reader.readAsDataURL(file); // Base64エンコード
            } else {
                alert("対応していないファイル形式です！(HTML, MP3, JPG, PNGなどに対応)");
                return;
            }

            reader.onload = function(evt) {
                uploadedContent = evt.target.result;
                dropText.innerHTML = `選択済み: <b style="color:var(--neon-cyan);">${file.name}</b>`;
                dropZone.style.borderColor = "var(--neon-cyan)";
                itemDetails.style.display = "block";
                itemNameInput.focus();
            };
        }

        selectFileBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            fileInput.click();
        });

        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) processFile(e.target.files[0]);
        });

        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(evt => {
            dropZone.addEventListener(evt, e => { e.preventDefault(); e.stopPropagation(); }, false);
        });

        ['dragenter', 'dragover'].forEach(evt => {
            dropZone.addEventListener(evt, () => dropZone.classList.add('dragover'), false);
        });
        ['dragleave', 'drop'].forEach(evt => {
            dropZone.addEventListener(evt, () => dropZone.classList.remove('dragover'), false);
        });

        dropZone.addEventListener('drop', (e) => {
            const files = e.dataTransfer.files;
            if (files.length > 0) processFile(files[0]);
        });

        document.getElementById('publish-btn').addEventListener('click', () => {
            const itemName = itemNameInput.value.trim();
            if (!itemName) {
                alert("作品の名前を入力してください！");
                return;
            }
            broadcastNewItem(itemName, uploadedContent, uploadedType);
            modal.style.display = 'none';
            resetModal();
            
            // アップロードした種類と同じタブに自動遷移
            switchTab(uploadedType);
        });

        function resetModal() {
            dropText.innerHTML = "HTML / 音楽(mp3等) / 画像 をドロップ";
            dropZone.style.borderColor = "var(--neon-blue)";
            itemDetails.style.display = "none";
            itemNameInput.value = "";
            fileInput.value = "";
            uploadedContent = "";
            typeLabel.innerText = "";
        }

        // -----------------------------
        // 5. プレイ / 閲覧画面の制御
        // -----------------------------
        const playScreen = document.getElementById('play-screen');
        const gameFrame = document.getElementById('game-frame');
        const musicPlayer = document.getElementById('music-player');
        const imageViewer = document.getElementById('image-viewer');
        const playingTitle = document.getElementById('playing-title');

        // 画像の拡縮・移動用変数
        let imgScale = 1;
        let imgTranslateX = 0;
        let imgTranslateY = 0;
        let isDragging = false;
        let startX, startY;

        function openViewer(name, content, type) {
            playingTitle.innerText = name;
            
            // 一旦すべて非表示
            gameFrame.style.display = "none";
            musicPlayer.style.display = "none";
            imageViewer.style.display = "none";
            
            // 種類に応じて表示
            if (type === 'game') {
                gameFrame.srcdoc = content;
                gameFrame.style.display = "block";
            } else if (type === 'music') {
                musicPlayer.src = content;
                musicPlayer.style.display = "block";
                musicPlayer.play();
            } else if (type === 'illustration') {
                imageViewer.src = content;
                imageViewer.style.display = "block";
                
                // 画像の状態をリセット
                imgScale = 1;
                imgTranslateX = 0;
                imgTranslateY = 0;
                updateImageTransform();
            }

            playScreen.style.display = 'flex';
        }

        function closeViewer() {
            playScreen.style.display = 'none';
            
            // リセット
            gameFrame.srcdoc = "";
            musicPlayer.pause();
            musicPlayer.src = "";
            imageViewer.src = "";
        }

        // -----------------------------
        // 6. 画像の拡大縮小・ドラッグ操作
        // -----------------------------
        function updateImageTransform() {
            imageViewer.style.transform = `translate(${imgTranslateX}px, ${imgTranslateY}px) scale(${imgScale})`;
        }

        // マウスホイールでの拡大・縮小
        imageViewer.addEventListener('wheel', (e) => {
            e.preventDefault();
            const zoomSpeed = 0.1;
            if (e.deltaY < 0) {
                imgScale += zoomSpeed; // 上スクロールで拡大
            } else {
                imgScale -= zoomSpeed; // 下スクロールで縮小
            }
            if (imgScale < 0.1) imgScale = 0.1; // 最小サイズの制限
            updateImageTransform();
        });

        // ドラッグ（マウスボタンを押したまま移動）での移動
        imageViewer.addEventListener('mousedown', (e) => {
            e.preventDefault();
            isDragging = true;
            startX = e.clientX - imgTranslateX;
            startY = e.clientY - imgTranslateY;
            imageViewer.style.cursor = 'grabbing';
        });

        window.addEventListener('mouseup', () => {
            isDragging = false;
            imageViewer.style.cursor = 'grab';
        });

        window.addEventListener('mousemove', (e) => {
            if (!isDragging || imageViewer.style.display === "none") return;
            imgTranslateX = e.clientX - startX;
            imgTranslateY = e.clientY - startY;
            updateImageTransform();
        });
    </script>
</body>
</html>
