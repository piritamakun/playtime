<!DOCTYPE html>
<html lang="ja"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>テトリス 完全版</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&display=swap');
        :root { --bg-base: #050508; --bg-grad: linear-gradient(135deg, #0f111a 0%, #050508 100%); --glass-bg: rgba(20, 22, 35, 0.6); --glass-border: rgba(255, 255, 255, 0.08); --accent-main: #00e5ff; --accent-sub: #ff00ea; --text-main: #ffffff; --text-muted: #8c92a6; }
        body { background: var(--bg-grad); background-attachment: fixed; color: var(--text-main); text-align: center; font-family: 'Noto Sans JP', sans-serif; margin: 0; padding: 0; overflow: hidden; position: fixed; width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; }
        .glass-panel { background: var(--glass-bg); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid var(--glass-border); border-radius: 20px; box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5); }
        h1 { font-family: 'Noto Sans JP', sans-serif; font-weight: 900; letter-spacing: 2px; margin: 0; background: linear-gradient(to right, var(--accent-main), var(--accent-sub)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        #game-layout { display: flex; gap: 20px; margin-top: calc(5px + env(safe-area-inset-top)); padding: 10px; align-items: stretch; justify-content: center; width: 100%; max-width: 500px; box-sizing: border-box; flex: 1; min-height: 0; }
        .canvas-container { position: relative; border-radius: 12px; padding: 4px; background: linear-gradient(180deg, rgba(255,255,255,0.1), transparent); box-shadow: 0 0 40px rgba(0,0,0,0.8); }
        #tetris { background: #000; border-radius: 8px; height: 100%; width: auto; max-height: 65vh; image-rendering: pixelated; display: block; }
        #side-panel { display: flex; flex-direction: column; gap: 15px; min-width: 90px; }
        .status-box { padding: 15px 10px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .status-label { font-size: 11px; color: var(--text-muted); font-weight: 700; letter-spacing: 1px; margin-bottom: 5px; }
        .status-val { font-size: 22px; font-weight: 900; color: var(--accent-main); text-shadow: 0 0 15px rgba(0, 229, 255, 0.4); }
        #next-canvas { background: transparent; width: 60px; height: 60px; image-rendering: pixelated; }
        .btn-icon { background: rgba(255,255,255,0.05); border: 1px solid var(--glass-border); color: var(--text-main); border-radius: 12px; padding: 12px 0; font-size: 14px; cursor: pointer; transition: all 0.2s; font-weight: bold; margin-top: auto; }
        .controls { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; padding: 15px 20px; width: 100%; max-width: 420px; margin-top: auto; padding-bottom: calc(15px + env(safe-area-inset-bottom)); box-sizing: border-box; }
        .ctrl-btn { height: 65px; font-size: 20px; background: var(--glass-bg); color: white; border: 1px solid var(--glass-border); border-radius: 20px; touch-action: manipulation; -webkit-tap-highlight-color: transparent; display: flex; align-items: center; justify-content: center; font-weight: bold; box-shadow: 0 4px 0 rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.1); }
        .ctrl-btn:active { transform: translateY(4px); box-shadow: 0 0px 0 rgba(0,0,0,0.5); }
        .rotate-btn { grid-column: span 3; height: 55px; background: linear-gradient(180deg, rgba(0, 229, 255, 0.15), rgba(0, 229, 255, 0.05)); border-color: rgba(0, 229, 255, 0.3); color: var(--accent-main); font-weight: bold; font-size: 18px; }
        .screen-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(5, 5, 8, 0.85); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); z-index: 100; display: flex; flex-direction: column; justify-content: center; align-items: center; opacity: 0; pointer-events: none; transition: opacity 0.3s ease; }
        .screen-overlay.active { opacity: 1; pointer-events: auto; }
        .menu-card { padding: 30px 40px; width: 85%; max-width: 340px; display: flex; flex-direction: column; gap: 15px; }
        .menu-title { font-size: 48px; margin-bottom: 5px; }
        .menu-subtitle { color: var(--text-muted); font-size: 14px; margin-bottom: 5px; font-weight: bold; }
        .mode-toggle { display: flex; background: rgba(0,0,0,0.5); border-radius: 12px; padding: 5px; border: 1px solid var(--glass-border); }
        .mode-btn { flex: 1; padding: 12px; border-radius: 8px; color: var(--text-muted); font-size: 13px; font-weight: bold; cursor: pointer; }
        .mode-btn.active { background: var(--accent-main); color: #000; box-shadow: 0 0 15px rgba(0, 229, 255, 0.4); }
        .btn-primary { padding: 16px; font-size: 18px; border-radius: 14px; border: none; font-weight: bold; cursor: pointer; background: var(--accent-main); color: #000; box-shadow: 0 4px 15px rgba(0, 229, 255, 0.3); }
        .btn-secondary { padding: 14px; font-size: 15px; border-radius: 14px; border: 1px solid var(--glass-border); font-weight: bold; cursor: pointer; background: rgba(255,255,255,0.05); color: var(--text-main); }
        .btn-danger { color: #ff4b4b !important; border-color: rgba(255, 75, 75, 0.4) !important; background: rgba(255, 75, 75, 0.05) !important; }
        #admin-sidebar { position: fixed; top: 0; right: -360px; width: 330px; max-width: 92vw; height: 100%; background: rgba(10, 15, 25, 0.97); backdrop-filter: blur(25px); border-left: 2px solid var(--accent-sub); box-shadow: -10px 0 30px rgba(0,0,0,0.8); z-index: 10000; transition: right 0.4s ease; display: flex; flex-direction: column; }
        #admin-sidebar.open { right: 0; }
        .admin-header { padding: 20px; font-size: 22px; font-weight: 900; color: var(--accent-sub); border-bottom: 1px solid rgba(255,255,255,0.1); display: flex; justify-content: space-between; align-items: center; }
        .admin-close { background: none; border: none; color: white; font-size: 24px; cursor: pointer; }
        .admin-content { padding: 20px; flex: 1; overflow-y: auto; text-align: left; }
        .admin-label { display: block; margin-bottom: 6px; color: var(--accent-main); font-weight: bold; font-size: 13px; margin-top: 10px; }
        .admin-input { width: 100%; padding: 10px; background: rgba(0,0,0,0.5); border: 1px solid var(--glass-border); color: white; border-radius: 8px; box-sizing: border-box; font-size: 15px; margin-bottom: 15px; }
        .admin-input::-webkit-calendar-picker-indicator { filter: invert(1); }
        .time-row { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
        .time-row input { margin-bottom: 0; flex: 1; }
        .time-row button { background: #ff4b4b; border: none; color: white; border-radius: 6px; padding: 10px; cursor: pointer; font-weight: bold; }
        .btn-add { background: rgba(0, 229, 255, 0.1); border: 1px dashed var(--accent-main); color: var(--accent-main); width: 100%; padding: 10px; border-radius: 8px; cursor: pointer; font-weight: bold; margin-bottom: 15px; }
        .btn-save { width: 100%; padding: 14px; background: linear-gradient(to right, var(--accent-main), var(--accent-sub)); color: black; border: none; border-radius: 8px; font-weight: 900; font-size: 15px; cursor: pointer; margin-top: 10px; }
        .global-banner { display: none; width: 100%; max-width: 480px; background: rgba(255, 0, 234, 0.12); border: 1px solid rgba(255, 0, 234, 0.4); border-radius: 12px; padding: 10px 15px; margin: 10px auto 0 auto; font-size: 13px; font-weight: bold; color: #fff; text-align: left; white-space: pre-wrap; box-sizing: border-box; box-shadow: 0 0 15px rgba(255,0,234,0.15); transition: all 0.3s ease; }
    </style>
</head>
<body>

    <div id="screen-title" class="screen-overlay active">
        <div class="glass-panel menu-card">
            <div>
                <h1 class="menu-title">テトリス</h1>
                <div id="jst-clock" style="font-size: 18px; color: rgb(255, 75, 75); font-weight: bold; margin: 10px 0px; background: rgba(0, 0, 0, 0.4); padding: 10px; border-radius: 12px; border: 1px solid rgba(255, 75, 75, 0.3); letter-spacing: 1px;">日本時間: 17:33:03 (オフライン)</div>
                <div class="menu-subtitle">最高得点: <span id="hi-display" style="color:var(--accent-main); font-size:20px;">0</span></div>
                <div id="title-global-message" class="global-banner" style="margin-top: 5px; margin-bottom: 5px; display: none;"></div>
            </div>
            <div class="mode-toggle">
                <div id="mode-normal" class="mode-btn" onclick="setMode('normal')">ノーマル</div>
                <div id="mode-extra" class="mode-btn" onclick="setMode('extra')">エクストラ</div>
            </div>
            <button class="btn-primary" onclick="startNewGame()">はじめから</button>
            <button id="btn-continue" class="btn-primary" style="background:var(--accent-sub); color:#fff;" onclick="loadGame()" disabled="">つづきから</button>
            <button id="btn-admin-shortcut" class="btn-secondary" style="display: block; border-color: var(--accent-sub); color: var(--accent-sub);" onclick="openAdminPanel()">🛠️ 管理者設定を開く (または X キー)</button>
        </div>
    </div>

    <div id="screen-pause" class="screen-overlay">
        <div class="glass-panel menu-card">
            <h1 style="font-size: 32px; background: none; color: white;">一時停止中</h1>
            <button class="btn-primary" onclick="resumeGame()">ゲームに戻る</button>
            <button class="btn-secondary" onclick="saveAndQuit()">タイトルへ戻る</button>
        </div>
    </div>

    <div id="screen-gameover" class="screen-overlay">
        <div class="glass-panel menu-card">
            <h1 style="font-size: 40px; background: none; color: #ff4b4b;">ゲームオーバー</h1>
            <div style="font-size: 18px; margin: 10px 0;">得点: <span id="final-score" style="color:var(--accent-main); font-size:28px;">0</span></div>
            <button class="btn-secondary" onclick="document.getElementById('screen-gameover').classList.remove('active'); document.getElementById('screen-title').classList.add('active');">タイトルへ</button>
        </div>
    </div>

    <div id="restriction-screen" class="screen-overlay" style="z-index: 9999; background: rgba(5,5,8,0.98); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);">
        <div class="glass-panel menu-card" style="border-color: #ff4b4b;">
            <h1 style="font-size: 30px; background: none; color: #ff4b4b;">プレイ制限中</h1>
            <p id="restriction-message" style="margin: 20px 0; font-size: 16px; line-height: 1.8; white-space: pre-wrap; font-weight: bold; color: #fff;"></p>
        </div>
    </div>

    <div id="admin-sidebar" class="">
        <div class="admin-header">管理者設定 <button class="admin-close" onclick="closeAdminPanel()">×</button></div>
        <div class="admin-content">
            <label class="admin-label">全員に表示する管理者メッセージ:</label>
            <textarea id="admin-global-msg" class="admin-input" rows="2" style="font-family:inherit; resize:none; margin-bottom:8px;" placeholder="画面上部に常時掲示される連絡事項を入力"></textarea>
            <button onclick="sendGlobalMessage()" style="width: 100%; padding: 10px; background: rgba(255, 0, 234, 0.15); border: 1px solid var(--accent-sub); color: white; border-radius: 8px; cursor: pointer; font-weight: bold; margin-bottom: 15px; font-size:13px;">📢 メッセージをリアルタイム送信</button>

            <label class="admin-label">現在のスコアを強制変更:</label>
            <div class="time-row">
                <input type="number" id="admin-set-score" class="admin-input" style="margin-bottom:0;" min="0" placeholder="数値を入力">
                <button onclick="changeCurrentScore()" style="background:var(--accent-main); color:black; font-weight:bold; width:70px;">適用</button>
            </div>

            <label class="admin-label">1日のプレイ上限時間 (分):</label>
            <input type="number" id="admin-playtime" class="admin-input" min="0" placeholder="0で無制限">
            
            <label class="admin-label">プレイ禁止時間帯:</label>
            <div id="time-restrictions-container"><div class="time-row">
            <input type="time" class="admin-input" value="08:20" onchange="tempBanTimes[0].start=this.value">
            <span style="color:#888;">〜</span>
            <input type="time" class="admin-input" value="10:15" onchange="tempBanTimes[0].end=this.value">
            <button onclick="tempBanTimes.splice(0,1);renderTR();">削除</button>
        </div><div class="time-row">
            <input type="time" class="admin-input" value="10:40" onchange="tempBanTimes[1].start=this.value">
            <span style="color:#888;">〜</span>
            <input type="time" class="admin-input" value="13:05" onchange="tempBanTimes[1].end=this.value">
            <button onclick="tempBanTimes.splice(1,1);renderTR();">削除</button>
        </div><div class="time-row">
            <input type="time" class="admin-input" value="13:15" onchange="tempBanTimes[2].start=this.value">
            <span style="color:#888;">〜</span>
            <input type="time" class="admin-input" value="15:30" onchange="tempBanTimes[2].end=this.value">
            <button onclick="tempBanTimes.splice(2,1);renderTR();">削除</button>
        </div></div>
            <button class="btn-add" onclick="addTimeRestriction()">＋時間帯を追加</button>
            
            <button class="btn-save" onclick="saveAdminSettings()">設定を保存して閉じる</button>

            <div style="margin-top: 25px; padding-top: 20px; border-top: 1px solid rgba(255,255,255,0.1);">
                <label class="admin-label" style="color: #4CD964;">他の端末でも禁止を発動させるには:</label>
                <p style="font-size: 11px; color: #aaa; margin-top:0; line-height:1.4;">設定は今使っているPCにしか保存されません。<br>別の端末でもロックをかけるには、以下のボタンを押して設定済みのファイルをダウンロードし、それを送ってください。</p>
                <button onclick="downloadHtmlWithSettings()" style="width: 100%; padding: 12px; background: rgba(76, 217, 100, 0.2); border: 1px solid #4CD964; color: #4CD964; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 13px;">💾 この設定でゲームファイルを出力</button>
            </div>

            <button class="btn-secondary btn-danger" style="width:100%; margin-top:15px; padding:10px; font-size:13px;" onclick="logoutAdmin()">管理者モードを解除(ログアウト)</button>
        </div>
    </div>

    <div id="game-global-message" class="global-banner" style="display: none;"></div>

    <div id="game-layout">
        <div class="canvas-container"><canvas id="tetris" width="240" height="400"></canvas></div>
        <div id="side-panel">
            <div class="glass-panel status-box"><div class="status-label">次</div><canvas id="next-canvas" width="60" height="60"></canvas></div>
            <div class="glass-panel status-box"><div class="status-label">得点</div><div id="score" class="status-val">0</div></div>
            <div class="glass-panel status-box"><div class="status-label">レベル</div><div id="level" class="status-val">1</div></div>
            <button class="btn-icon glass-panel" onclick="pauseGame()">⏸ 一時停止</button>
        </div>
    </div>

    <div class="controls">
        <button class="ctrl-btn rotate-btn" onclick="playerRotate(1)">回転 ↻</button>
        <button class="ctrl-btn" onclick="playerMove(-1)">◀</button>
        <button class="ctrl-btn" onclick="playerDrop()">▼</button>
        <button class="ctrl-btn" onclick="playerMove(1)">▶</button>
    </div>

<script>
/* --- CONFIG START --- */
const DEFAULT_SETTINGS = {"maxPlayTime":60,"banTimes":[{"start":"08:20","end":"10:15"},{"start":"10:40","end":"13:05"},{"start":"13:15","end":"15:30"}],"globalMessage":"","gameId":"kl653pfbi1"};
/* --- CONFIG END --- */

const canvas = document.getElementById('tetris'); const ctx = canvas.getContext('2d'); ctx.scale(20, 20);
const nCanvas = document.getElementById('next-canvas'); const nCtx = nCanvas.getContext('2d'); nCtx.scale(15, 15);
const colors = [null, '#FF2D55', '#007AFF', '#4CD964', '#AF52DE', '#FF9500', '#FFCC00', '#5856D6', '#00E5FF', '#FF3B30', '#FF00EA', '#5AC8FA', '#F0E68C'];
let isRunning = false; let gameMode = 'normal'; let arena = Array.from({length: 20}, () => Array(12).fill(0));
const player = { pos: {x: 0, y: 0}, matrix: null, next: null, score: 0, level: 1 };
let dropCounter = 0, lastTime = 0; let highScore = localStorage.getItem('t-hi') || 0;
document.getElementById('hi-display').innerText = highScore; checkSaveData();

function setMode(mode) { gameMode = mode; document.getElementById('mode-normal').classList.toggle('active', mode === 'normal'); document.getElementById('mode-extra').classList.toggle('active', mode === 'extra'); }
function createPiece(t) {
    const p = {
        'I': [[0,1,0,0],[0,1,0,0],[0,1,0,0],[0,1,0,0]], 'L': [[0,2,0],[0,2,0],[0,2,2]], 'J': [[0,3,0],[0,3,0],[3,3,0]], 'O': [[4,4],[4,4]],
        'Z': [[5,5,0],[0,5,5],[0,0,0]], 'S': [[0,6,6],[6,6,0],[0,0,0]], 'T': [[0,7,0],[7,7,7],[0,0,0]], 'P': [[0,8,0],[8,8,8],[0,8,0]],
        '5': [[0,9,0,0,0],[0,9,0,0,0],[0,9,0,0,0],[0,9,0,0,0],[0,9,0,0,0]], 'D': [[10]], 'B': [[11,0,0,0],[11,0,0,0],[11,0,0,0],[11,11,11,0]], 'X': [[0,12,12],[12,12,0],[12,0,0]]
    }; return p[t];
}
function playerReset() {
    let pieces = (gameMode === 'extra') ? 'ILJOTSZP5DBX' : 'ILJOTSZ';
    if (!player.next) player.next = createPiece(pieces[pieces.length * Math.random() | 0]);
    player.matrix = player.next; player.next = createPiece(pieces[pieces.length * Math.random() | 0]);
    player.pos.y = 0; player.pos.x = Math.floor(arena[0].length / 2) - Math.floor(player.matrix[0].length / 2);
    if (collide(arena, player)) gameOver();
    drawNext();
}
function collide(a, p) {
    const m = p.matrix; const o = p.pos;
    for (let y = 0; y < m.length; ++y) {
        for (let x = 0; x < m[y].length; ++x) {
            if (m[y][x] !== 0) { if (!a[y + o.y] || a[y + o.y][x + o.x] === undefined || a[y + o.y][x + o.x] !== 0) return true; }
        }
    } return false;
}
function merge(a, p) { p.matrix.forEach((row, y) => { row.forEach((value, x) => { if (value !== 0) { if (a[y + p.pos.y]) a[y + p.pos.y][x + p.pos.x] = value; } }); }); }
function arenaSweep() {
    let rowCount = 1;
    for (let y = arena.length - 1; y >= 0; --y) {
        if (arena[y].every(v => v !== 0)) { arena.splice(y, 1); arena.unshift(new Array(12).fill(0)); ++y; player.score += rowCount * 10; rowCount *= 2; }
    } player.level = Math.floor(player.score / 100) + 1; updateUI();
}
function updateUI() { document.getElementById('score').innerText = player.score; document.getElementById('level').innerText = player.level; }
function gameOver() { isRunning = false; localStorage.removeItem('t-save'); checkSaveData(); if(player.score > highScore) { highScore = player.score; localStorage.setItem('t-hi', highScore); document.getElementById('hi-display').innerText = highScore; } document.getElementById('final-score').innerText = player.score; document.getElementById('screen-gameover').classList.add('active'); }
function playerDrop() { if (!isRunning) return; player.pos.y++; if (collide(arena, player)) { player.pos.y--; merge(arena, player); playerReset(); arenaSweep(); } dropCounter = 0; }
function playerMove(d) { if (!isRunning) return; player.pos.x += d; if (collide(arena, player)) player.pos.x -= d; }
function playerRotate(d) {
    if (!isRunning) return; const m = player.matrix; for (let y = 0; y < m.length; ++y) for (let x = 0; x < y; ++x) [m[x][y], m[y][x]] = [m[y][x], m[x][y]];
    if (d > 0) m.forEach(r => r.reverse()); else m.reverse(); let o = 1; const pos = player.pos.x;
    while (collide(arena, player)) { player.pos.x += o; o = -(o + (o > 0 ? 1 : -1)); if (o > m[0].length) { playerRotate(-d); player.pos.x = pos; return; } }
}
function drawBlock(c, x, y, v, isGhost = false) { if (isGhost) { c.fillStyle = colors[v] + '20'; c.fillRect(x+0.05, y+0.05, 0.9, 0.9); c.strokeStyle = colors[v] + '80'; c.lineWidth = 0.05; c.strokeRect(x+0.05, y+0.05, 0.9, 0.9); } else { c.fillStyle = colors[v]; c.fillRect(x+0.05, y+0.05, 0.9, 0.9); c.fillStyle = 'rgba(255,255,255,0.3)'; c.fillRect(x+0.05, y+0.05, 0.9, 0.15); } }
function drawMatrix(m, o, c, isGhost = false) { m.forEach((r, y) => r.forEach((v, x) => { if (v !== 0) drawBlock(c, x + o.x, y + o.y, v, isGhost); })); }
function drawNext() { nCtx.clearRect(0, 0, nCanvas.width, nCanvas.height); if (player.next) { drawMatrix(player.next, {x: player.next[0].length === 2 ? 1 : 0.5, y: 1}, nCtx); } }
function update(time = 0) {
    if (!isRunning) return; const dt = time - lastTime; lastTime = time; dropCounter += dt;
    if (dropCounter > Math.max(80, 1000 - (player.level - 1) * 100)) playerDrop();
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    arena.forEach((r, y) => r.forEach((v, x) => { if(v !== 0) drawBlock(ctx, x, y, v); }));
    if (player.matrix) {
        let gY = player.pos.y; while (!collide(arena, {matrix: player.matrix, pos: {x: player.pos.x, y: gY}})) gY++; gY--;
        drawMatrix(player.matrix, {x: player.pos.x, y: gY}, ctx, true); drawMatrix(player.matrix, player.pos, ctx);
    } requestAnimationFrame(update);
}
function checkSaveData() { document.getElementById('btn-continue').disabled = !localStorage.getItem('t-save'); }
function pauseGame() { if (!isRunning) return; isRunning = false; document.getElementById('screen-pause').classList.add('active'); }
function resumeGame() { if (document.getElementById('restriction-screen').classList.contains('active')) return; document.getElementById('screen-pause').classList.remove('active'); isRunning = true; lastTime = performance.now(); update(); }
function saveAndQuit() { localStorage.setItem('t-save', JSON.stringify({ arena, player, gameMode })); checkSaveData(); document.getElementById('screen-pause').classList.remove('active'); document.getElementById('screen-title').classList.add('active'); }
function startNewGame() { if (document.getElementById('restriction-screen').classList.contains('active')) return; arena.forEach(r => r.fill(0)); player.score = 0; player.level = 1; player.next = null; updateUI(); document.getElementById('screen-title').classList.remove('active'); isRunning = true; playerReset(); lastTime = performance.now(); update(); }
function loadGame() { if (document.getElementById('restriction-screen').classList.contains('active')) return; const saved = JSON.parse(localStorage.getItem('t-save')); if (saved) { arena = saved.arena; Object.assign(player, saved.player); gameMode = saved.gameMode; setMode(gameMode); updateUI(); drawNext(); document.getElementById('screen-title').classList.remove('active'); isRunning = true; lastTime = performance.now(); update(); } }

let adminCodeBuffer = ""; 
let isAdminMode = localStorage.getItem('t-is-admin') === 'true'; 
let tempBanTimes = []; let timeOffset = 0; let isTimeSynced = false;

// 📡 P2P通信用の変数
let myPeer = null;
let p2pConnections = [];

// 全端末で共通の「ゲームID」を発行・保持する
function getSettings() { 
    const s = localStorage.getItem('t-settings'); 
    let parsed = DEFAULT_SETTINGS;
    if (s) { try { parsed = JSON.parse(s); } catch(e) {} }
    // gameIdがなければ新規生成して保存（これでエクスポート後も全端末が同じIDを共有）
    if (!parsed.gameId) {
        parsed.gameId = Math.random().toString(36).substring(2, 12);
        localStorage.setItem('t-settings', JSON.stringify(parsed));
    }
    return parsed;
}

// 📡 P2Pネットワークの初期化処理
function initP2P() {
    if (myPeer) { myPeer.destroy(); p2pConnections = []; }
    const p2pHostId = "tetris-host-" + getSettings().gameId;
    
    if (isAdminMode) {
        // 【管理者モード】 ホストとして接続を待ち受ける
        myPeer = new Peer(p2pHostId);
        myPeer.on('connection', conn => {
            p2pConnections.push(conn);
            conn.on('open', () => {
                // 新しく接続してきたプレイヤーに現在の最新メッセージを送信
                conn.send({ type: 'msg', text: getSettings().globalMessage });
            });
            conn.on('close', () => {
                p2pConnections = p2pConnections.filter(c => c !== conn);
            });
        });
    } else {
        // 【プレイヤーモード】 管理者（ホスト）に接続しにいく
        myPeer = new Peer();
        myPeer.on('open', () => {
            const conn = myPeer.connect(p2pHostId);
            conn.on('data', data => {
                if (data && data.type === 'msg') {
                    // 管理者からメッセージを受信したら即座に画面を更新
                    const s = getSettings();
                    s.globalMessage = data.text;
                    localStorage.setItem('t-settings', JSON.stringify(s));
                    updateGlobalMessage();
                }
            });
        });
    }
}
// 起動時に少し待ってからP2P接続を開始
setTimeout(initP2P, 1000);

function closeAdminPanel() { document.getElementById('admin-sidebar').classList.remove('open'); }

function openAdminPanel() {
    document.getElementById('admin-sidebar').classList.add('open'); const s = getSettings();
    document.getElementById('admin-playtime').value = s.maxPlayTime || ""; 
    document.getElementById('admin-global-msg').value = s.globalMessage || "";
    document.getElementById('admin-set-score').value = player.score;
    tempBanTimes = s.banTimes || []; renderTR();
}

function renderTR() {
    const c = document.getElementById('time-restrictions-container'); c.innerHTML = '';
    tempBanTimes.forEach((tr, i) => {
        c.innerHTML += `<div class="time-row">
            <input type="time" class="admin-input" value="${tr.start}" onchange="tempBanTimes[${i}].start=this.value">
            <span style="color:#888;">〜</span>
            <input type="time" class="admin-input" value="${tr.end}" onchange="tempBanTimes[${i}].end=this.value">
            <button onclick="tempBanTimes.splice(${i},1);renderTR();">削除</button>
        </div>`;
    });
}
function addTimeRestriction() { tempBanTimes.push({start: "", end: ""}); renderTR(); }

function changeCurrentScore() {
    const val = parseInt(document.getElementById('admin-set-score').value, 10);
    if (!isNaN(val) && val >= 0) {
        player.score = val; player.level = Math.floor(player.score / 100) + 1; updateUI();
        alert(`現在のスコアを ${val} に書き換えました！`);
    } else { alert("0以上の正しい数値を入力してください。"); }
}

function sendGlobalMessage() {
    const s = getSettings();
    s.globalMessage = document.getElementById('admin-global-msg').value;
    localStorage.setItem('t-settings', JSON.stringify(s)); 
    updateGlobalMessage();
    
    // 📡 P2P通信：繋がっている全端末に即座にメッセージを送信！
    let sentCount = 0;
    p2pConnections.forEach(conn => {
        if (conn.open) {
            conn.send({ type: 'msg', text: s.globalMessage });
            sentCount++;
        }
    });
    
    alert(`📢 メッセージを更新しました！\n現在プレイ中の ${sentCount} 台の端末にリアルタイム配信されました。`);
}

function saveAdminSettings() {
    const s = getSettings();
    s.maxPlayTime = parseInt(document.getElementById('admin-playtime').value, 10) || 0;
    s.banTimes = tempBanTimes.filter(t => t.start && t.end);
    s.globalMessage = document.getElementById('admin-global-msg').value;

    localStorage.setItem('t-settings', JSON.stringify(s)); 
    updateGlobalMessage();
    closeAdminPanel(); 
    alert("設定を保存しました。");
}

function downloadHtmlWithSettings() {
    const clone = document.documentElement.cloneNode(true);
    clone.querySelectorAll('.active').forEach(el => el.classList.remove('active'));
    clone.querySelectorAll('.open').forEach(el => el.classList.remove('open'));
    const titleScreen = clone.querySelector('#screen-title');
    if (titleScreen) titleScreen.classList.add('active');

    let htmlContent = "<!DOCTYPE html>\n" + clone.outerHTML;
    const s = getSettings();
    const settingsJson = JSON.stringify(s);
    const regex = /\/\* --- CONFIG START --- \*\/[\s\S]*?\/\* --- CONFIG END --- \*\//;
    const replacement = `/* --- CONFIG START --- */\nconst DEFAULT_SETTINGS = ${settingsJson};\n/* --- CONFIG END --- */`;
    
    htmlContent = htmlContent.replace(regex, replacement);

    const blob = new Blob([htmlContent], {type: 'text/html'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'Tetris_Locked.html';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    
    alert("📥 「Tetris_Locked.html」を保存しました！\n\nこのファイルを送ることで、全員が同じ通信ID（P2Pネットワーク）に所属するようになり、リアルタイムメッセージの受信が可能になります。");
}

function logoutAdmin() {
    if(confirm("管理者モードを解除します。再度設定を開くには X キーまたはパスワード(140923)の入力が必要になります。よろしいですか？")) {
        localStorage.removeItem('t-is-admin'); 
        isAdminMode = false; 
        initP2P(); // ホストからプレイヤーモードへ切り替え
        closeAdminPanel();
        document.getElementById('btn-admin-shortcut').style.display = "none";
        alert("ログアウトしました。");
    }
}

function updateGlobalMessage() {
    const s = getSettings(); const msg = s.globalMessage ? s.globalMessage.trim() : "";
    const tEl = document.getElementById('title-global-message'); const gEl = document.getElementById('game-global-message');
    if (msg !== "") {
        if(tEl) { tEl.innerText = "📢 管理者連絡:\n" + msg; tEl.style.display = "block"; }
        if(gEl) { gEl.innerText = "📢 管理者連絡:\n" + msg; gEl.style.display = "block"; }
    } else {
        if(tEl) tEl.style.display = "none"; if(gEl) gEl.style.display = "none";
    }
}

async function syncWithJST() {
    try {
        const res = await fetch('https://worldtimeapi.org/api/timezone/Asia/Tokyo', { cache: 'no-store' });
        const data = await res.json();
        if (data && data.utc_datetime) {
            const serverTime = new Date(data.utc_datetime).getTime();
            timeOffset = serverTime - Date.now(); 
            isTimeSynced = true;
        }
    } catch (e) { console.error("JST同期失敗:", e); }
}
syncWithJST(); setInterval(syncWithJST, 30000);

function getAccurateJST() {
    const trueUTC = Date.now() + timeOffset; 
    const jstMS = trueUTC + (9 * 60 * 60 * 1000); 
    const d = new Date(jstMS);
    
    const year = d.getUTCFullYear();
    const month = String(d.getUTCMonth() + 1).padStart(2, '0');
    const day = String(d.getUTCDate()).padStart(2, '0');
    const h = d.getUTCHours();
    const m = d.getUTCMinutes();
    const s = d.getUTCSeconds();

    return {
        dateStr: `${year}-${month}-${day}`,
        hours: h, minutes: m, totalMinutes: h * 60 + m, 
        fullStr: `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`
    };
}

setInterval(() => {
    const jst = getAccurateJST(); 
    const clockEl = document.getElementById('jst-clock');
    if (clockEl) {
        if (isTimeSynced) {
            clockEl.innerHTML = `日本時間: ${jst.fullStr}`; clockEl.style.borderColor = "rgba(0, 229, 255, 0.2)"; clockEl.style.color = "var(--accent-main)";
        } else {
            clockEl.innerHTML = `日本時間: ${jst.fullStr} (オフライン)`; clockEl.style.borderColor = "rgba(255, 75, 75, 0.3)"; clockEl.style.color = "#ff4b4b";
        }
    }

    const shortcutBtn = document.getElementById('btn-admin-shortcut');
    if (shortcutBtn) { shortcutBtn.style.display = isAdminMode ? "block" : "none"; }

    const s = getSettings(); 
    let isRestricted = false; 
    let msg = "";

    for (let tr of s.banTimes) {
        if (!tr.start || !tr.end) continue;
        const [sH, sM] = tr.start.split(':').map(Number); const startVal = sH * 60 + sM;
        const [eH, eM] = tr.end.split(':').map(Number); const endVal = eH * 60 + eM;
        let match = false;
        
        if (startVal < endVal) match = (jst.totalMinutes >= startVal && jst.totalMinutes < endVal);
        else if (startVal > endVal) match = (jst.totalMinutes >= startVal || jst.totalMinutes < endVal);
        
        if (match) { 
            isRestricted = true; 
            msg = `【現在はプレイ禁止時間帯です】\n[設定: ${tr.start} 〜 ${tr.end}]\n\n画面の時計が禁止時間になりました。`; 
            break; 
        }
    }

    let usage = JSON.parse(localStorage.getItem('t-usage')) || { date: jst.dateStr, min: 0 };
    if (usage.date > jst.dateStr) { isRestricted = true; msg = "【時間不正検知】\nPCの時計が過去に戻されています。正しい日時に戻るまでロックされます。"; }
    if (usage.date !== jst.dateStr && usage.date <= jst.dateStr) { usage = { date: jst.dateStr, min: 0 }; }

    if (isRunning && !document.getElementById('screen-pause').classList.contains('active') && !isRestricted) {
        usage.min += (1 / 60); localStorage.setItem('t-usage', JSON.stringify(usage));
    }

    if (s.maxPlayTime > 0 && usage.min >= s.maxPlayTime) {
        isRestricted = true; msg = `【本日のプレイ上限に達しました】\n制限時間: ${s.maxPlayTime}分\n\nまた明日遊んでください。`;
    }

    const resScreen = document.getElementById('restriction-screen');
    if (isRestricted) {
        document.getElementById('restriction-message').innerText = msg;
        if (!resScreen.classList.contains('active')) {
            resScreen.classList.add('active'); 
            isRunning = false; 
            document.getElementById('screen-pause').classList.remove('active');
            
            const sidebar = document.getElementById('admin-sidebar');
            if (sidebar && sidebar.classList.contains('open')) {
                sidebar.classList.remove('open');
            }
        }
    } else {
        if (resScreen.classList.contains('active')) { resScreen.classList.remove('active'); window.location.reload(); }
    }
}, 1000);

updateGlobalMessage();

document.addEventListener('keydown', e => {
    const isLocked = document.getElementById('restriction-screen').classList.contains('active');
    const isEditingInput = document.activeElement && (
        document.activeElement.classList.contains('admin-input') || 
        document.activeElement.tagName === 'TEXTAREA' || 
        document.activeElement.tagName === 'INPUT'
    );

    if (e.key.toLowerCase() === 'x' && !isEditingInput) {
        e.preventDefault();
        if (isAdminMode) {
            const sidebar = document.getElementById('admin-sidebar');
            if (sidebar.classList.contains('open')) {
                closeAdminPanel();
            } else {
                openAdminPanel();
            }
        }
        return;
    }

    if (e.key >= '0' && e.key <= '9') {
        adminCodeBuffer += e.key;
        if (adminCodeBuffer.endsWith("140923")) {
            isAdminMode = true; localStorage.setItem('t-is-admin', 'true');
            initP2P(); // プレイヤーからホストモードへ切り替え
            alert("管理者モードが解放されました！"); openAdminPanel(); return;
        }
    } else { adminCodeBuffer = ""; }

    if (isEditingInput) return;
    if (isLocked) { e.preventDefault(); return; }

    if (e.keyCode === 32) {
        e.preventDefault(); if (!isRunning) return;
        while (!collide(arena, player)) { player.pos.y++; }
        player.pos.y--; merge(arena, player); arenaSweep(); playerReset(); dropCounter = 0; return;
    }

    if (e.keyCode === 27) {
        if (document.getElementById('screen-title').classList.contains('active') || document.getElementById('screen-gameover').classList.contains('active')) return;
        if (isRunning) pauseGame(); else if (document.getElementById('screen-pause').classList.contains('active')) resumeGame();
        return;
    }
    
    if (!isRunning) return;
    if (e.keyCode === 37) playerMove(-1);
    if (e.keyCode === 39) playerMove(1);
    if (e.keyCode === 40) playerDrop();
    if (e.keyCode === 38) playerRotate(1);
});
</script>
