<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXUS - Ultimate V9</title>
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
    <style>
        :root {
            --bg-deep: #05070a; --bg-card: rgba(20, 25, 35, 0.8);
            --accent-primary: #00d2ff; --accent-danger: #ff0055;
            --accent-party: #ff00ff; --accent-bug: #00ff41;
            --text-white: #ffffff; --glass-border: rgba(255, 255, 255, 0.15);
        }
        
        body, html { 
            margin: 0; padding: 0; font-family: 'Inter', sans-serif; 
            background-color: var(--bg-deep); color: var(--text-white); 
            height: 100vh; width: 100vw; overflow: hidden; display: flex;
        }

        #status-bar {
            padding: 20px; font-size: 1.1rem; font-weight: 900; text-align: center;
            background: rgba(0, 210, 255, 0.05); color: var(--accent-primary);
            border-top: 1px solid var(--accent-primary);
            text-shadow: 0 0 10px var(--accent-primary);
            letter-spacing: 1px; transition: 0.3s;
        }

        #admin-toast {
            position: fixed; top: -200px; left: 50%; transform: translateX(-50%);
            width: 85%; max-width: 650px; padding: 25px;
            background: linear-gradient(135deg, rgba(0, 210, 255, 0.2), rgba(0, 50, 100, 0.4));
            backdrop-filter: blur(30px); border: 2px solid var(--accent-primary); border-radius: 25px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 20000; transition: all 0.7s cubic-bezier(0.19, 1, 0.22, 1);
            box-shadow: 0 25px 60px rgba(0,0,0,0.8); text-align: center;
        }
        #toast-msg { font-size: 1.4rem; font-weight: 900; letter-spacing: 1px; }

        aside { 
            width: 280px; background: #000; border-right: 1px solid var(--glass-border); 
            display: flex; flex-direction: column; z-index: 100;
        }
        .brand { 
            padding: 40px 20px 10px; font-size: 2.2rem; font-weight: 900; letter-spacing: 6px;
            background: linear-gradient(to right, #00d2ff, #fff); -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            text-align: center;
        }
        .lang-selector-container { padding: 0 25px 25px; }
        select { 
            width: 100%; background: #111; color: #fff; border: 1px solid #333;
            padding: 12px; border-radius: 12px; cursor: pointer; font-size: 0.9rem;
        }

        .nav-menu { list-style: none; padding: 0; margin: 0; flex-grow: 1; }
        .nav-item { 
            padding: 20px 30px; cursor: pointer; color: #555; transition: 0.3s;
            font-weight: 800; font-size: 0.9rem; border-left: 0 solid var(--accent-primary);
        }
        .nav-item:hover { color: #fff; background: rgba(255,255,255,0.05); }
        .nav-item.active { 
            color: var(--accent-primary); background: rgba(0, 210, 255, 0.1); 
            border-left: 6px solid var(--accent-primary);
        }

        main { flex: 1; position: relative; padding: 40px; overflow-y: auto; background: #05070a; }
        .content-section { display: none; animation: fadeIn 0.4s ease-out; }
        .content-section.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.98); } to { opacity: 1; transform: scale(1); } }

        .item-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 30px; }
        .item-card { 
            background: var(--bg-card); border: 1px solid var(--glass-border); border-radius: 20px;
            padding: 40px 20px; text-align: center; transition: 0.4s; cursor: pointer;
        }
        .item-card:hover { transform: translateY(-10px); border-color: var(--accent-primary); box-shadow: 0 10px 30px rgba(0, 210, 255, 0.3); }

        #drop-zone {
            border: 3px dashed #333; border-radius: 30px; padding: 100px 20px;
            text-align: center; cursor: pointer; transition: 0.3s; background: rgba(255,255,255,0.01);
        }
        #drop-zone.drag-over { border-color: var(--accent-primary); background: rgba(0, 210, 255, 0.05); }
        #drop-zone > * { pointer-events: none; }

        .admin-panel { background: rgba(255,255,255,0.02); padding: 25px; border-radius: 20px; margin-bottom: 25px; border: 1px solid #222; }
        button { border: none; padding: 14px 25px; border-radius: 12px; font-weight: 800; cursor: pointer; transition: 0.2s; }
        input, textarea { width: 100%; background: #000; color: #fff; border: 1px solid #333; padding: 15px; border-radius: 12px; box-sizing: border-box; margin: 10px 0; outline: none; }

        #game-overlay { position: fixed; inset: 0; background: #000; z-index: 5000; display: none; flex-direction: column; }
        #party-layer, #bug-layer, #bug-noise { position: fixed; inset: 0; pointer-events: none; z-index: 9000; display: none; }
        .confetti { position: absolute; width: 10px; height: 10px; animation: fall 3s linear infinite; }
        @keyframes fall { to { transform: translateY(110vh) rotate(720deg); } }
    </style>
</head>
<body>

    <div id="admin-toast">
        <div style="font-size: 0.8rem; color: var(--accent-primary); margin-bottom: 8px; letter-spacing: 3px; font-weight: 900;">ADMIN MESSAGE</div>
        <div id="toast-msg">...</div>
    </div>

    <div id="party-layer"></div>
    <div id="bug-layer" style="background: repeating-linear-gradient(rgba(0,255,65,0.1) 0px, transparent 1px, transparent 2px); background-size: 100% 3px;"></div>
    <div id="bug-noise" style="opacity: 0.05; background: url('https://media.giphy.com/media/oEI9uWUic8Nba/giphy.gif');"></div>

    <aside>
        <div class="brand">NEXUS</div>
        <div class="lang-selector-container">
            <select id="lang-select" onchange="changeLanguage(this.value)">
                <option value="ja">日本語 (JP)</option>
                <option value="en">English (EN)</option>
                <option value="zh">简体中文 (CN)</option>
                <option value="ko">한국어 (KR)</option>
                <option value="es">Español (ES)</option>
                <option value="fr">Français (FR)</option>
            </select>
        </div>
        <ul class="nav-menu">
            <li class="nav-item active" id="m-lib" onclick="showSection('library')">LIBRARY</li>
            <li class="nav-item" id="m-up" onclick="showSection('upload')">UPLOAD</li>
            <li class="nav-item" id="m-code" onclick="showSection('code')">SECRET CODE</li>
            <li class="nav-item" id="m-admin" onclick="authAdmin()">ADMIN</li>
        </ul>
        <div id="status-bar">CONNECTED</div>
    </aside>

    <main>
        <section id="library" class="content-section active">
            <h2 id="t-lib">SYSTEM LIBRARY</h2>
            <div class="item-grid" id="game-grid"></div>
        </section>

        <section id="upload" class="content-section">
            <h2 id="t-up">UPLOAD CONTENT</h2>
            <div id="drop-zone">
                <div style="font-size: 4rem; margin-bottom: 20px;">📁</div>
                <p id="t-drop">Drop HTML file here</p>
                <input type="file" id="file-input" accept=".html" style="display:none">
            </div>
        </section>

        <section id="code" class="content-section">
            <h2 id="t-code">INPUT CODE</h2>
            <div class="admin-panel" style="border-color: var(--accent-primary);">
                <input type="text" id="code-in" placeholder="...">
                <button onclick="applyCode()" id="b-code-auth" style="background:var(--accent-primary); width:100%; color:#000;">AUTHENTICATE</button>
            </div>
        </section>

        <section id="admin" class="content-section">
            <h2 id="t-admin" style="color:var(--accent-danger);">ADMIN CONTROL</h2>
            
            <div class="admin-panel" style="border-color: var(--accent-primary);">
                <h3 id="a-status">System Info</h3>
                <div id="admin-user-count" style="font-weight:900; font-size:1.2rem; color:var(--accent-primary);">Connected Users: 0</div>
            </div>

            <div style="display:grid; grid-template-columns: 1fr 1fr; gap:20px;">
                <div class="admin-panel" style="border-color:var(--accent-party);">
                    <h3 id="a-party">Party</h3>
                    <button onclick="sendEv('party',true)" style="background:var(--accent-party); width:100%;">START</button>
                    <button onclick="sendEv('party',false)" style="background:#222; color:#fff; width:100%; margin-top:10px;">STOP</button>
                </div>
                <div class="admin-panel" style="border-color:var(--accent-bug);">
                    <h3 id="a-bug">Bug</h3>
                    <button onclick="sendEv('bug',true)" style="background:var(--accent-bug); width:100%;">INJECT</button>
                    <button onclick="sendEv('bug',false)" style="background:#222; color:#fff; width:100%; margin-top:10px;">REPAIR</button>
                </div>
            </div>
            <div class="admin-panel" style="border-color:var(--accent-primary);">
                <h3 id="a-msg">Broadcast Message</h3>
                <textarea id="adm-text" placeholder="Type here..."></textarea>
                <button onclick="broadcastMsg()" id="b-msg-send" style="background:var(--accent-primary); width:100%; color:#000;">BROADCAST TO ALL</button>
            </div>
            <div class="admin-panel">
                <h3 id="a-manage">Manage Library</h3>
                <div id="admin-list"></div>
            </div>
            <button onclick="logout()" style="background:#333; color:#fff; width:100%;">LOGOUT ADMIN</button>
        </section>
    </main>

    <div id="game-overlay">
        <div style="padding:15px 30px; background:#000; display:flex; justify-content:space-between; align-items:center;">
            <span id="playing-name">NEXUS SESSION</span>
            <button onclick="closeGame()" style="background:var(--accent-danger); color:#fff; padding:8px 20px;">QUIT</button>
        </div>
        <iframe id="game-frame" style="flex:1; border:none; background:#fff;"></iframe>
    </div>

    <script>
        const DB_NAME = "Nexus_V9_Core";
        const ADMIN_PASS = "730874";
        const HOST_ID = "NEXUS-AUTO-HOST-0923"; 
        let db, peer, conns = [];
        let hostConn = null; 
        let isHost = false;
        let currentLang = localStorage.getItem('nx_l9') || 'ja';

        const bc = new BroadcastChannel('nexus_v9_channel');
        bc.onmessage = (e) => {
            if(e.data.type === 'MSG') showToast(e.data.raw);
            if(e.data.type === 'EV') {
                if(e.data.ev === 'party') toggleParty(e.data.val);
                if(e.data.ev === 'bug') toggleBug(e.data.val);
            }
            // ローカルタブ間での自動起動同期
            if(e.data.type === 'FORCE_PLAY_LOCAL') {
                launchGameWindow(e.data.name, e.data.content);
            }
        };

        const dictionary = {
            ja: {
                m_lib: "ホーム", m_up: "ゲーム追加", m_code: "コード", m_admin: "管理者",
                t_lib: "ライブラリ", t_up: "アップロード", t_drop: "ここにファイルをドロップ",
                t_code: "認証コード", a_party: "パーティー", a_bug: "バグ注入", a_msg: "一斉送信",
                a_manage: "ゲーム管理", b_code_auth: "認証", b_msg_send: "全員に送信",
                p_name: "ゲーム名:", t_added: "追加しました (ホームで確認できます)", t_deleted: "削除しました",
                t_auth: "認証成功", msg_hello: "こんにちは！", msg_start: "イベント開始！", a_status: "システム情報"
            },
            en: {
                m_lib: "HOME", m_up: "UPLOAD", m_code: "CODE", m_admin: "ADMIN",
                t_lib: "LIBRARY", t_up: "UPLOAD", t_drop: "Drop file here",
                t_code: "AUTH CODE", a_party: "Party", a_bug: "Bug Inject", a_msg: "Broadcast",
                a_manage: "Manage", b_code_auth: "AUTH", b_msg_send: "SEND TO ALL",
                p_name: "Game Name:", t_added: "Added! (Check Home)", t_deleted: "Deleted",
                t_auth: "Success", msg_hello: "Hello!", msg_start: "Event Starts!", a_status: "System Info"
            }
        };

        function changeLanguage(lang) { currentLang = lang; localStorage.setItem('nx_l9', lang); updateUI(); }

        function updateUI() {
            const d = dictionary[currentLang] || dictionary['en'];
            document.getElementById('m-lib').innerText = d.m_lib; document.getElementById('m-up').innerText = d.m_up;
            document.getElementById('m-code').innerText = d.m_code; document.getElementById('m-admin').innerText = d.m_admin;
            document.getElementById('t-lib').innerText = d.t_lib; document.getElementById('t-up').innerText = d.t_up;
            document.getElementById('t-drop').innerText = d.t_drop; document.getElementById('t-code').innerText = d.t_code;
            document.getElementById('b-code_auth').innerText = d.b_code_auth; document.getElementById('t-admin').innerText = d.m_admin;
            document.getElementById('a-party').innerText = d.a_party; document.getElementById('a-bug').innerText = d.a_bug;
            document.getElementById('a-msg').innerText = d.a_msg; document.getElementById('b-msg-send').innerText = d.b_msg_send;
            document.getElementById('a-manage').innerText = d.a_manage;
            if(document.getElementById('a-status')) document.getElementById('a-status').innerText = d.a_status;
            
            if(isHost || !peer || !peer.connections || Object.keys(peer.connections).length === 0) {
                loadGames();
            }
            if(document.getElementById('admin').classList.contains('active')) renderAdminList();
        }

        const request = indexedDB.open(DB_NAME, 1);
        request.onupgradeneeded = e => e.target.result.createObjectStore("games", {keyPath:"id", autoIncrement:true});
        request.onsuccess = e => { db = e.target.result; updateUI(); initMesh(); };

        function loadGames() {
            const grid = document.getElementById('game-grid'); grid.innerHTML = '';
            db.transaction("games","readonly").objectStore("games").getAll().onsuccess = e => {
                e.target.result.forEach(g => {
                    const card = document.createElement('div'); card.className = 'item-card';
                    card.innerHTML = `<div style="font-size:3rem; margin-bottom:15px;">🎮</div><div style="font-weight:900;">${g.name.toUpperCase()}</div>`;
                    card.onclick = () => {
                        launchGameWindow(g.name, g.content);
                    };
                    grid.appendChild(card);
                });
            };
        }

        function renderAdminList() {
            const list = document.getElementById('admin-list'); list.innerHTML = '';
            db.transaction("games","readonly").objectStore("games").getAll().onsuccess = e => {
                e.target.result.forEach(g => {
                    const div = document.createElement('div');
                    div.style = "display:flex; justify-content:space-between; padding:15px; border-bottom:1px solid #222; align-items:center;";
                    div.innerHTML = `<span>${g.name}</span><button onclick="deleteGame(${g.id})" style="background:var(--accent-danger); color:#fff; padding:5px 15px; font-size:0.7rem;">DELETE</button>`;
                    list.appendChild(div);
                });
            };
        }

        function deleteGame(id) {
            const tx = db.transaction("games", "readwrite");
            tx.objectStore("games").delete(Number(id));
            tx.oncomplete = () => { 
                showToast(dictionary[currentLang].t_deleted);
                loadGames(); 
                renderAdminList(); 
                if(isHost) broadcastGameList(); 
            };
        }

        function updateAdminCounter() {
            const adminCount = document.getElementById('admin-user-count');
            if (isHost && adminCount) {
                adminCount.innerText = `Connected Users: ${conns.length}`;
            }
        }

        window.addEventListener('dragover', e => e.preventDefault()); window.addEventListener('drop', e => e.preventDefault());
        const dz = document.getElementById('drop-zone');
        dz.ondragover = e => { e.preventDefault(); dz.classList.add('drag-over'); }; dz.ondragleave = () => dz.classList.remove('drag-over');
        dz.ondrop = e => { e.preventDefault(); dz.classList.remove('drag-over'); const f = e.dataTransfer.files[0]; if(f && f.name.endsWith('.html')) handleFile(f); };
        dz.onclick = () => document.getElementById('file-input').click();
        document.getElementById('file-input').onchange = e => { if(e.target.files[0]) handleFile(e.target.files[0]); };

        function handleFile(f) {
            const name = prompt(dictionary[currentLang]?.p_name || "Name:", f.name.replace('.html',''));
            if(!name) return;
            const r = new FileReader();
            r.onload = e => {
                const content = e.target.result;
                if(isHost) {
                    db.transaction("games", "readwrite").objectStore("games").add({name: name, content: content}).oncomplete = () => { 
                        showToast(dictionary[currentLang].t_added); 
                        loadGames(); 
                        broadcastGameList(); 
                        // ホスト自身で即時自動起動＆全接続クライアントへ強制起動命令を送信
                        launchGameWindow(name, content);
                        broadcastForcePlay(name, content);
                    };
                } else if(hostConn && hostConn.open) {
                    // クライアントがドロップした場合、ホストサーバーへ送り全員へ一斉配信させる
                    hostConn.send({ type: 'NX_CLIENT_UPLOAD', name: name, content: content });
                    showToast("Uploading & Broadcasting...");
                }
            };
            r.readAsText(f);
        }

        // ゲーム画面を起動する共通関数
        function launchGameWindow(name, content) {
            document.getElementById('game-frame').src = URL.createObjectURL(new Blob([content], {type:'text/html'}));
            document.getElementById('playing-name').innerText = name.toUpperCase();
            document.getElementById('game-overlay').style.display = 'flex';
        }

        function initMesh() {
            if (localStorage.getItem('is_adm_9')) { becomeHost(); } 
            else { startClient(); }
        }

        function sendGameListToConn(c) {
            db.transaction("games","readonly").objectStore("games").getAll().onsuccess = e => {
                const list = e.target.result.map(g => ({ id: g.id, name: g.name }));
                if (c.open) c.send({ type: 'NX_GAME_LIST', list: list });
            };
        }

        function broadcastGameList() {
            db.transaction("games","readonly").objectStore("games").getAll().onsuccess = e => {
                const list = e.target.result.map(g => ({ id: g.id, name: g.name }));
                conns.forEach(c => { if(c.open) c.send({ type: 'NX_GAME_LIST', list: list }); });
            };
        }

        // ホストから全クライアントにゲームデータつきで強制自動起動を命令する関数
        function broadcastForcePlay(name, content) {
            conns.forEach(c => {
                if(c.open) c.send({ type: 'NX_FORCE_PLAY', name: name, content: content });
            });
            bc.postMessage({ type: 'FORCE_PLAY_LOCAL', name: name, content: content });
        }

        function becomeHost() {
            if (peer) peer.destroy();
            peer = new Peer(HOST_ID);
            peer.on('open', id => { 
                isHost = true; 
                updateAdminCounter();
            });
            peer.on('connection', c => {
                conns.push(c);
                updateAdminCounter();
                sendGameListToConn(c);

                c.on('data', data => {
                    if(data.type === 'EV') { if(data.ev === 'party') toggleParty(data.val); if(data.ev === 'bug') toggleBug(data.val); }
                    if(data.type === 'MSG') {
                        showToast(data.raw); 
                        bc.postMessage({type:'MSG', raw: data.raw});
                    }
                    
                    // クライアントからのドロップを受け取った時の処理
                    if(data.type === 'NX_CLIENT_UPLOAD') {
                        db.transaction("games", "readwrite").objectStore("games").add({name: data.name, content: data.content}).oncomplete = () => {
                            broadcastGameList(); 
                            showToast("New Game Shared: " + data.name);
                            // 自分（ホスト）の画面でも起動
                            launchGameWindow(data.name, data.content);
                            // 他の接続中メンバー全員の画面でも即座に自動起動
                            broadcastForcePlay(data.name, data.content);
                        };
                    }

                    if(data.type === 'NX_REQ_GAME') {
                        db.transaction("games","readonly").objectStore("games").get(Number(data.id)).onsuccess = e => {
                            const g = e.target.result;
                            if(g && c.open) c.send({ type: 'NX_GAME_DATA', id: g.id, name: g.name, content: g.content });
                        };
                    }
                });
                c.on('close', () => { conns = conns.filter(conn => conn !== c); updateAdminCounter(); });
                c.on('error', () => { conns = conns.filter(conn => conn !== c); updateAdminCounter(); });
            });
        }

        function startClient() {
            if (peer) peer.destroy();
            peer = new Peer(); 
            peer.on('open', () => { connectToHost(); });
        }

        function connectToHost() {
            if (isHost) return;
            const c = peer.connect(HOST_ID);
            hostConn = c; 
            c.on('open', () => {
                c.on('data', data => {
                    if(data.type === 'EV') { if(data.ev === 'party') toggleParty(data.val); if(data.ev === 'bug') toggleBug(data.val); }
                    if(data.type === 'MSG') {
                        showToast(data.raw);
                        bc.postMessage({type:'MSG', raw: data.raw});
                    } 
                    if(data.type === 'NX_GAME_LIST') renderRemoteGames(data.list, c);
                    
                    // 追加：ホストから「強制自動起動（および全員追加）」の命令が届いた時の処理
                    if(data.type === 'NX_FORCE_PLAY') {
                        launchGameWindow(data.name, data.content);
                        showToast("Live Sync: " + data.name);
                    }

                    if(data.type === 'NX_GAME_DATA') {
                        launchGameWindow(data.name, data.content);
                    }
                });
            });
        }

        function renderRemoteGames(list, c) {
            const grid = document.getElementById('game-grid'); grid.innerHTML = '';
            list.forEach(g => {
                const card = document.createElement('div'); card.className = 'item-card';
                card.innerHTML = `<div style="font-size:3rem; margin-bottom:15px;">🎮</div><div style="font-weight:900;">${g.name.toUpperCase()}</div>`;
                card.onclick = () => {
                    if (c.open) c.send({ type: 'NX_REQ_GAME', id: g.id });
                };
                grid.appendChild(card);
            });
        }

        let toastTimeout;
        function showToast(rawText) {
            let translated = rawText;
            for(let lang in dictionary) {
                for(let key in dictionary[lang]) {
                    if(dictionary[lang][key] === rawText) { translated = dictionary[currentLang][key] || rawText; break; }
                }
            }
            const t = document.getElementById('admin-toast');
            document.getElementById('toast-msg').innerText = translated;
            t.style.top = "40px";
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => { t.style.top = "-200px"; }, 6000);
        }

        function broadcastMsg() {
            const text = document.getElementById('adm-text').value;
            if(!text) return;
            showToast(text);
            bc.postMessage({type:'MSG', raw: text});
            conns.forEach(c => { if(c.open) c.send({type:'MSG', raw: text}); });
            document.getElementById('adm-text').value = '';
        }

        function sendEv(type, val) {
            if(type === 'party') toggleParty(val); if(type === 'bug') toggleBug(val);
            bc.postMessage({type:'EV', ev:type, val:val});
            conns.forEach(c => { if(c.open) c.send({type:'EV', ev:type, val:val}); });
        }

        function showSection(id) {
            document.querySelectorAll('.content-section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            const map = { library: 'm-lib', upload: 'm-up', code: 'm-code', admin: 'm-admin' };
            document.getElementById(map[id]).classList.add('active');
            if(id === 'admin') renderAdminList();
        }
        function authAdmin() { 
            if(localStorage.getItem('is_adm_9') || prompt("PASS:") === ADMIN_PASS) { 
                localStorage.setItem('is_adm_9', '1'); 
                showSection('admin'); 
                if(!isHost) becomeHost();
            } 
        }
        function logout() { 
            localStorage.removeItem('is_adm_9'); 
            showSection('library'); 
            isHost = false; startClient(); 
        }
        function toggleParty(a) {
            const l = document.getElementById('party-layer'); l.style.display = a ? 'block' : 'none';
            if(a) { l.innerHTML = ''; for(let i=0; i<60; i++) { const d = document.createElement('div'); d.className = 'confetti'; d.style.left = Math.random()*100+'vw'; d.style.background = `hsl(${Math.random()*360},100%,50%)`; d.style.animationDelay = Math.random()*2+'s'; l.appendChild(d); } }
        }
        function toggleBug(a) { document.body.style.animation = a ? "shake 0.1s infinite" : "none"; document.getElementById('bug-layer').style.display = a ? 'block' : 'none'; }
        function closeGame() { document.getElementById('game-overlay').style.display = 'none'; document.getElementById('game-frame').src = ''; }
        function applyCode() { if(document.getElementById('code-in').value === "0923") { toggleParty(true); showToast("AUTHENTICATED"); } }

    </script>
</body>
</html>
