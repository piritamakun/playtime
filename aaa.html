<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>レトロ冒険RPG - 魔王の試練</title>
    <style>
        body {
            background-color: #000;
            color: #fff;
            font-family: 'Courier New', Courier, monospace, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            user-select: none;
        }
        #game-container {
            width: 360px;
            border: 4px solid #fff;
            padding: 10px;
            background-color: #000;
        }
        .window {
            border: 2px solid #fff;
            padding: 10px;
            margin-bottom: 10px;
            background-color: #000;
        }
        #status-window {
            display: flex;
            justify-content: space-between;
            font-size: 16px;
        }
        #monster-window {
            height: 120px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-size: 20px;
            font-weight: bold;
        }
        #monster-hp {
            font-size: 14px;
            color: #ff4d4d;
            margin-top: 5px;
        }
        #message-window {
            height: 80px;
            font-size: 14px;
            line-height: 1.5;
            overflow-y: auto;
        }
        #command-window {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        button {
            background-color: #000;
            color: #fff;
            border: 2px solid #fff;
            padding: 10px;
            font-size: 16px;
            cursor: pointer;
        }
        button:hover {
            background-color: #fff;
            color: #000;
        }
        button:disabled {
            border-color: #555;
            color: #555;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

<div id="game-container">
    <div id="status-window" class="window">
        <div>勇者 (Lv 10)</div>
        <div>HP: <span id="player-hp">80</span>/80</div>
    </div>

    <div id="monster-window" class="window">
        <div id="monster-name">ぷにぷに</div>
        <div id="monster-hp">HP: <span id="m-hp">15</span></div>
    </div>

    <div id="message-window" class="window">
        <div id="msg">モンスターが あらわれた！</div>
    </div>

    <div id="command-window">
        <button id="btn-attack" onclick="playerTurn('attack')">たたかう</button>
        <button id="btn-heal" onclick="playerTurn('heal')">薬草 (回復)</button>
        <button id="btn-run" onclick="playerTurn('run')">にげる</button>
        <button id="btn-next" onclick="nextStage()" disabled>つぎへ</button>
    </div>
</div>

<script>
    // 安全なオリジナル名に変更
    const monsters = [
        { name: "みどりぷに", hp: 15, maxHp: 15, atk: 5 },
        { name: "がいこつ剣士", hp: 35, maxHp: 35, atk: 12 },
        { name: "暗黒の魔王", hp: 80, maxHp: 80, atk: 18 }
    ];

    let currentStage = 0;
    let player = { hp: 80, maxHp: 80, atk: 12 };
    let enemy = { ...monsters[currentStage] };

    const msgEl = document.getElementById("msg");
    const pHpEl = document.getElementById("player-hp");
    const mHpEl = document.getElementById("m-hp");
    const mNameEl = document.getElementById("monster-name");

    function log(text) {
        msgEl.innerHTML = text.replace(/\n/g, "<br>");
    }

    function updateUI() {
        pHpEl.innerText = player.hp;
        mHpEl.innerText = enemy.hp > 0 ? enemy.hp : 0;
        mNameEl.innerText = enemy.name;
    }

    function playerTurn(action) {
        toggleButtons(true);

        if (action === 'attack') {
            const dmg = Math.floor(Math.random() * 5) + player.atk;
            enemy.hp -= dmg;
            log(`勇者の こうげき！\n${enemy.name}に ${dmg}の ダメージ！`);
        } else if (action === 'heal') {
            const heal = 25;
            player.hp = Math.min(player.maxHp, player.hp + heal);
            log(`勇者は 薬草を つかった！\nHPが ${heal} 回復した！`);
        } else if (action === 'run') {
            if (currentStage === 2) {
                log("魔王からは にげられない！");
                setTimeout(enemyTurn, 1500);
                return;
            }
            log("勇者は にげだした！\nしかし 回り込まれてしまった！");
            setTimeout(enemyTurn, 1500);
            return;
        }

        updateUI();

        if (enemy.hp <= 0) {
            setTimeout(winBattle, 1500);
        } else {
            setTimeout(enemyTurn, 1500);
        }
    }

    function enemyTurn() {
        const dmg = Math.floor(Math.random() * 6) + enemy.atk;
        player.hp -= dmg;
        if (player.hp < 0) player.hp = 0;
        
        log(`${enemy.name}の こうげき！\n勇者は ${dmg}の ダメージをうけた！`);
        updateUI();

        if (player.hp <= 0) {
            setTimeout(gameOver, 1500);
        } else {
            toggleButtons(false);
        }
    }

    function winBattle() {
        log(`${enemy.name}を たおした！`);
        
        if (currentStage < monsters.length - 1) {
            document.getElementById("btn-next").disabled = false;
        } else {
            log("暗黒の魔王を たおした！\n世界に 平和が もどった！\n【ゲームクリア！】");
        }
    }

    function nextStage() {
        currentStage++;
        enemy = { ...monsters[currentStage] };
        document.getElementById("btn-next").disabled = true;
        toggleButtons(false);
        log(`${enemy.name}が あらわれた！`);
        updateUI();
    }

    function gameOver() {
        log("勇者は 力つきてしまった…\n【ゲームオーバー】\nページを再読み込みしてリトライ");
    }

    function toggleButtons(disabled) {
        document.getElementById("btn-attack").disabled = disabled;
        document.getElementById("btn-heal").disabled = disabled;
        document.getElementById("btn-run").disabled = disabled;
    }
</script>

</body>
</html>
