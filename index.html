<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stamp & Sync Chat (With Clear History)</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: sans-serif; background-color: #7494C0; height: 100vh; display: flex; overflow: hidden; }
        
        /* サイドバー */
        #sidebar { width: 100px; background: #2c3e50; display: flex; flex-direction: column; align-items: center; padding: 15px 5px; gap: 10px; overflow-y: auto; }
        .history-item { width: 100%; padding: 8px 5px; background: #34495e; border-radius: 10px; color: white; text-align: center; font-size: 10px; cursor: pointer; position: relative; }
        .history-item.active { background: #85E249; color: #000; font-weight: bold; }
        .status-dot { position: absolute; top: 5px; right: 5px; width: 8px; height: 8px; border-radius: 50%; background: #95a5a6; border: 1px solid #2c3e50; }
        .status-online { background: #85E249; box-shadow: 0 0 5px #85E249; }

        /* メインエリア */
        #main-chat { flex: 1; display: flex; flex-direction: column; }
        #setup-area { background: rgba(0,0,0,0.9); color: white; padding: 10px; font-size: 12px; }
        .my-id-box { font-size: 16px; font-weight: bold; color: #85E249; }
        
        /* チャットヘッダーに削除ボタンを追加 */
        header { background: #1E2A3A; color: white; padding: 8px 15px; display: flex; justify-content: space-between; align-items: center; font-size: 12px; }
        .delete-btn { cursor: pointer; color: #e74c3c; font-weight: bold; font-size: 14px; background: none; border: none; }
        
        #chat-container { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 12px; }
        
        /* メッセージ・スタンプ */
        .msg-wrapper { display: flex; flex-direction: column; max-width: 80%; }
        .sent-wrapper { align-self: flex-end; align-items: flex-end; }
        .received-wrapper { align-self: flex-start; align-items: flex-start; }
        
        .msg { padding: 10px 14px; border-radius: 15px; font-size: 14px; word-wrap: break-word; }
        .sent { background-color: #85E249; border-top-right-radius: 2px; }
        .received { background-color: white; border-top-left-radius: 2px; }
        .stamp-img { max-width: 150px; border-radius: 10px; }
        .time { font-size: 9px; color: rgba(255,255,255,0.6); margin-top: 3px; }

        /* スタンプ選択エリア */
        #stamp-panel { display: none; background: white; border-top: 1px solid #ddd; padding: 10px; grid-template-columns: repeat(4, 1fr); gap: 10px; max-height: 200px; overflow-y: auto; }
        .stamp-btn { width: 100%; cursor: pointer; border-radius: 5px; transition: 0.2s; }
        .stamp-btn:hover { background: #f0f0f0; }

        footer { background: white; padding: 10px; display: flex; gap: 8px; align-items: center; }
        #message-input { flex: 1; border: 1px solid #ddd; padding: 10px; border-radius: 20px; outline: none; }
        .icon-btn { font-size: 20px; cursor: pointer; user-select: none; }
    </style>
</head>
<body>

<div id="sidebar"></div>

<div id="main-chat">
    <div id="setup-area">
        ID: <span id="my-id-display" class="my-id-box">----</span> | 
        名: <input type="text" id="my-nickname" style="width:60px; background:none; color:white; border-bottom:1px solid white;">
        <input type="number" id="peer-num" placeholder="相手4桁" style="width:60px">
        <button id="connect-btn" style="padding:2px 8px;">接続</button>
    </div>

    <header>
        <span id="chat-title">相手を選択してください</span>
        <button id="clear-history" class="delete-btn" style="display:none;">🗑️ 履歴を消去</button>
    </header>
    
    <div id="chat-container"></div>

    <div id="stamp-panel">
        <!-- あなたが持っている柴犬画像のURLに差し替えて使えます -->
        <img src="https://via.placeholder.com/150?text=Hello" class="stamp-btn" onclick="sendStamp(this.src)">
        <img src="https://via.placeholder.com/150?text=Thanks" class="stamp-btn" onclick="sendStamp(this.src)">
        <img src="https://via.placeholder.com/150?text=OK" class="stamp-btn" onclick="sendStamp(this.src)">
        <img src="https://via.placeholder.com/150?text=Sorry" class="stamp-btn" onclick="sendStamp(this.src)">
    </div>

    <footer>
        <div class="icon-btn" onclick="toggleStamp()">☺︎</div>
        <input type="text" id="message-input" placeholder="メッセージ..." disabled>
        <button id="send-btn" style="background:#85E249; padding:8px 15px; border-radius:20px; font-weight:bold; border:none;" disabled>送信</button>
    </footer>
</div>

<script>
    const PREFIX = "p2p_final_v11_";
    let myNumber = localStorage.getItem('chat_v11_id') || Math.floor(1000 + Math.random() * 9000).toString();
    localStorage.setItem('chat_v11_id', myNumber);

    let myNickname = localStorage.getItem('chat_v11_nickname') || "名無し";
    document.getElementById('my-nickname').value = myNickname;

    const peer = new Peer(PREFIX + myNumber);
    let connections = {}; 
    let activePeer = null;

    const sideBar = document.getElementById('sidebar');
    const chatContainer = document.getElementById('chat-container');
    const messageInput = document.getElementById('message-input');
    const sendBtn = document.getElementById('send-btn');
    const stampPanel = document.getElementById('stamp-panel');
    const clearBtn = document.getElementById('clear-history');

    peer.on('open', () => {
        document.getElementById('my-id-display').textContent = myNumber;
        renderHistory();
        setInterval(autoReconnect, 5000);
    });

    document.getElementById('connect-btn').onclick = () => {
        const target = document.getElementById('peer-num').value;
        if (target && target.length === 4 && target !== myNumber) {
            addFriend(target);
            selectChat(target);
        }
    };

    // 履歴消去の処理
    clearBtn.onclick = () => {
        if (!activePeer) return;
        if (confirm(`${activePeer}との履歴をすべて削除しますか？\n(相手側の画面の履歴は消えません)`)) {
            localStorage.removeItem('chat_v11_log_' + activePeer);
            renderChat();
            alert("削除しました");
        }
    };

    function toggleStamp() {
        stampPanel.style.display = stampPanel.style.display === 'grid' ? 'none' : 'grid';
    }

    function sendStamp(url) {
        if (!activePeer) return;
        executeSend({ type: 'stamp', content: url, sender: myNickname, time: getTime() });
        toggleStamp();
    }

    function sendMessage() {
        const text = messageInput.value.trim();
        if (!text || !activePeer) return;
        executeSend({ type: 'text', content: text, sender: myNickname, time: getTime() });
        messageInput.value = "";
    }

    function executeSend(msgObj) {
        if (connections[activePeer]) {
            connections[activePeer].send(msgObj);
            saveMsg(activePeer, msgObj, 'sent');
        } else {
            saveMsg(activePeer, msgObj, 'pending');
        }
        renderChat();
    }

    function getTime() { return new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}); }

    peer.on('connection', (conn) => {
        const num = conn.peer.replace(PREFIX, "");
        setupConn(conn, num);
    });

    function setupConn(conn, num) {
        conn.on('open', () => {
            connections[num] = conn;
            renderHistory();
            syncMessages(num);
        });
        conn.on('data', (data) => {
            saveMsg(num, data, 'received');
            if (activePeer === num) renderChat();
            renderHistory();
        });
        conn.on('close', () => { delete connections[num]; renderHistory(); });
    }

    function selectChat(num) {
        activePeer = num;
        messageInput.disabled = false;
        sendBtn.disabled = false;
        clearBtn.style.display = 'block'; // 削除ボタンを表示
        if (!connections[num]) {
            const conn = peer.connect(PREFIX + num);
            setupConn(conn, num);
        }
        document.getElementById('chat-title').textContent = num;
        renderChat();
        renderHistory();
    }

    function saveMsg(num, msg, type) {
        let history = JSON.parse(localStorage.getItem('chat_v11_log_' + num) || "[]");
        history.push({ ...msg, chatType: type });
        localStorage.setItem('chat_v11_log_' + num, JSON.stringify(history));
        addFriend(num);
    }

    function renderChat() {
        chatContainer.innerHTML = "";
        if (!activePeer) return;
        let log = JSON.parse(localStorage.getItem('chat_v11_log_' + activePeer) || "[]");
        log.forEach(m => {
            const wrap = document.createElement('div');
            wrap.className = `msg-wrapper ${m.chatType === 'received' ? 'received-wrapper' : 'sent-wrapper'}`;
            const content = document.createElement('div');
            if (m.type === 'stamp') {
                content.innerHTML = `<img src="${m.content}" class="stamp-img">`;
            } else {
                content.className = `msg ${m.chatType === 'received' ? 'received' : 'sent'}`;
                content.textContent = (m.chatType === 'pending' ? '⏳' : '') + m.content;
            }
            const time = document.createElement('div');
            time.className = 'time';
            time.textContent = m.time;
            wrap.appendChild(content);
            wrap.appendChild(time);
            chatContainer.appendChild(wrap);
        });
        chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    function renderHistory() {
        sideBar.innerHTML = '<div style="color:white; font-size:9px;">履歴</div>';
        let friends = JSON.parse(localStorage.getItem('chat_v11_friends') || "{}");
        for (let num in friends) {
            const div = document.createElement('div');
            div.className = `history-item ${activePeer === num ? 'active' : ''}`;
            div.innerHTML = `<div class="status-dot ${connections[num] ? 'status-online' : ''}"></div>${num}`;
            div.onclick = () => selectChat(num);
            sideBar.appendChild(div);
        }
    }

    function addFriend(num) {
        let friends = JSON.parse(localStorage.getItem('chat_v11_friends') || "{}");
        friends[num] = true;
        localStorage.setItem('chat_v11_friends', JSON.stringify(friends));
    }

    function syncMessages(num) {
        let history = JSON.parse(localStorage.getItem('chat_v11_log_' + num) || "[]");
        history.forEach(m => {
            if (m.chatType === 'pending') {
                connections[num].send({ type: m.type, content: m.content, sender: m.sender, time: m.time });
                m.chatType = 'sent';
            }
        });
        localStorage.setItem('chat_v11_log_' + num, JSON.stringify(history));
    }

    function autoReconnect() {
        let friends = JSON.parse(localStorage.getItem('chat_v11_friends') || "{}");
        Object.keys(friends).forEach(num => {
            if (!connections[num] && num !== myNumber) {
                const conn = peer.connect(PREFIX + num);
                setupConn(conn, num);
            }
        });
    }

    sendBtn.onclick = sendMessage;
    messageInput.onkeypress = (e) => { if(e.key === 'Enter') sendMessage(); };
</script>
</body>
</html>
