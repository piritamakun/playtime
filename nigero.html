<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>エスケープブロック</title>
    <style>
        body { 
            margin: 0; 
            background: #000; 
            color: #eee; 
            overflow: hidden; 
            font-family: 'Helvetica Neue', Arial, sans-serif;
            touch-action: none; 
        }
        canvas { 
            display: block; 
        }
        
        #ui { 
            position: absolute; 
            top: 20px; 
            left: 20px; 
            pointer-events: none; 
            z-index: 5;
            text-shadow: 0 0 5px #000;
        }
        #score { 
            font-size: 32px; 
            font-weight: bold; 
            color: #fff; 
        }

        #lobby {
            position: absolute; 
            top: 0; left: 0; width: 100%; height: 100%;
            background: #000;
            display: flex; 
            flex-direction: column;
            justify-content: center; 
            align-items: center;
            z-index: 10;
        }
        
        h1 { 
            font-size: 48px;
            color: #fff; 
            margin-bottom: 40px; 
            letter-spacing: 2px; 
            font-weight: bold;
            text-shadow: 0 0 15px #fff;
        }
        
        .btn-group { 
            display: flex; 
            flex-direction: column;
            gap: 15px; 
            width: 220px;
        }
        
        button {
            padding: 15px; 
            font-size: 18px; 
            font-weight: bold;
            cursor: pointer;
            background: #222; 
            border: 2px solid #555; 
            border-radius: 5px;
            color: #fff; 
            transition: 0.2s;
        }
        button:hover {
            background: #444;
            border-color: #fff;
            box-shadow: 0 0 10px rgba(255,255,255,0.5);
        }
        button.active { 
            background: #fff; 
            color: #000; 
            border-color: #fff;
            box-shadow: 0 0 15px #fff;
        }
        
        #setupArea, #gameOverArea { 
            display: none; 
            text-align: center; 
            flex-direction: column;
            align-items: center;
        }
        
        .controls-group, .device-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            width: 250px;
        }
        .controls-group { flex-direction: column; margin-bottom: 30px; }
        .device-group button { flex: 1; }

        /* 仮想ジョイスティック */
        #joystick-zone {
            display: none; 
            position: absolute; 
            bottom: 40px; 
            right: 40px;
            width: 150px; 
            height: 150px; 
            background: rgba(255, 255, 255, 0.15); 
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 50%; 
            touch-action: none; 
            z-index: 50;
        }
        #joystick-stick {
            position: absolute; 
            top: 50px; 
            left: 50px; 
            width: 50px; 
            height: 50px;
            background: rgba(255, 255, 255, 0.8); 
            border-radius: 50%;
            pointer-events: none;
            box-shadow: 0 0 10px rgba(255,255,255,0.5);
        }
    </style>
</head>
<body>
    <div id="lobby">
        <h1 id="lobbyTitle">エスケープブロック</h1>
        
        <div id="mainMenu" class="btn-group">
            <button onclick="startGame()">プレイ</button>
            <button onclick="showSetup()">設定</button>
        </div>

        <div id="setupArea">
            <h2 style="margin-bottom: 20px; font-weight: normal;">端末設定</h2>
            <div class="device-group">
                <button id="dev-pc" class="active" onclick="setDevice('pc')">パソコン</button>
                <button id="dev-tablet" onclick="setDevice('tablet')">タブレット</button>
            </div>

            <h2 style="margin-bottom: 20px; font-weight: normal;">操作方法</h2>
            <div class="controls-group">
                <button id="ctrl-pointer" class="active" onclick="setControl(currentPointerControl, this)">マウス</button>
                <button id="ctrl-kb" onclick="setControl('kb', this)">WASD ＆ 矢印</button>
                <button id="ctrl-gp" onclick="setControl('gp', this)">コントローラー</button>
            </div>
            <button style="width: 250px;" onclick="backToMain()">戻る</button>
        </div>

        <div id="gameOverArea">
            <h2 style="font-size: 36px; font-weight: bold; margin-bottom: 10px; color:#ff3333;">ゲームオーバー</h2>
            <p id="finalScoreText" style="line-height: 1.6; margin-bottom: 30px; font-size:20px;"></p>
            <div class="btn-group" style="flex-direction: row; width: auto; gap: 20px;">
                <button onclick="restartGame()">もう一度</button>
                <button onclick="backToTitleFromGameOver()">タイトルに戻る</button>
            </div>
        </div>
    </div>
    
    <div id="ui" style="display:none;">
        <span style="font-size: 20px;">生存時間: </span>
        <span id="score">0</span> 
        <span style="font-size: 20px;"> 秒</span>
    </div>
    
    <div id="joystick-zone">
        <div id="joystick-stick"></div>
    </div>

    <canvas id="game"></canvas>

<script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    
    const uiLayer = document.getElementById('ui');
    const scoreEl = document.getElementById('score');
    
    const lobby = document.getElementById('lobby');
    const mainMenu = document.getElementById('mainMenu');
    const setupArea = document.getElementById('setupArea');
    const gameOverArea = document.getElementById('gameOverArea');
    const finalScoreText = document.getElementById('finalScoreText');
    const lobbyTitle = document.getElementById('lobbyTitle');

    let width, height, gameActive = false;
    let score = 0; 
    let startTime = 0;
    let keys = {};
    
    let savedHighScore = parseInt(localStorage.getItem('escape_block_high_sec') || '0');

    let deviceType = 'pc';
    let currentPointerControl = 'mouse';
    let joyActive = false;
    let joyDeltaX = 0;
    let joyDeltaY = 0;
    
    const BASE_SPEED = 7;
    
    let enemies = [];
    let bullets = [];
    let particles = [];
    let items = [];
    let floatingTexts = [];

    let player = {
        x: 0, y: 0, size: 10, control: 'mouse', 
        hasShield: false, isGhost: false
    };
    let mouseTarget = { x: 0, y: 0 };

    // アイテムシステム用変数
    let lastItemTime = 0;
    let ghostEndTime = 0;
    let freezeEndTime = 0;
    let flashAlpha = 0;

    window.addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
    window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);
    
    canvas.addEventListener('mousemove', e => { 
        if(player.control === 'mouse' && gameActive) { 
            const rect = canvas.getBoundingClientRect();
            mouseTarget.x = e.clientX - rect.left; 
            mouseTarget.y = e.clientY - rect.top; 
        }
    });

    function resize() {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
        if (!gameActive) {
            player.x = width / 2;
            player.y = height / 2;
            mouseTarget.x = player.x;
            mouseTarget.y = player.y;
        }
    }
    window.addEventListener('resize', resize);
    resize();

    function setDevice(type) {
        deviceType = type;
        document.getElementById('dev-pc').className = type === 'pc' ? 'active' : '';
        document.getElementById('dev-tablet').className = type === 'tablet' ? 'active' : '';
        
        const pointerBtn = document.getElementById('ctrl-pointer');
        if (type === 'pc') {
            currentPointerControl = 'mouse';
            pointerBtn.innerText = 'マウス';
        } else {
            currentPointerControl = 'vstick';
            pointerBtn.innerText = '仮想スティック';
        }
        
        if (pointerBtn.classList.contains('active')) {
            player.control = currentPointerControl;
        }
    }

    function showSetup() {
        mainMenu.style.display = 'none';
        setupArea.style.display = 'flex';
    }

    function backToMain() {
        setupArea.style.display = 'none';
        mainMenu.style.display = 'flex';
    }

    function backToTitleFromGameOver() {
        gameOverArea.style.display = 'none';
        lobbyTitle.style.display = 'block';
        mainMenu.style.display = 'flex';
    }

    function setControl(type, btn) {
        player.control = type;
        document.getElementById('ctrl-pointer').className = '';
        document.getElementById('ctrl-kb').className = '';
        document.getElementById('ctrl-gp').className = '';
        btn.className = 'active';
        
        mouseTarget.x = player.x;
        mouseTarget.y = player.y;
    }

    const joyZone = document.getElementById('joystick-zone');
    const joyStick = document.getElementById('joystick-stick');
    const maxJoyRadius = 50;

    joyZone.addEventListener('pointerdown', (e) => {
        joyActive = true;
        updateJoystick(e);
        joyZone.setPointerCapture(e.pointerId);
    });

    joyZone.addEventListener('pointermove', (e) => {
        if (joyActive) updateJoystick(e);
    });

    const stopJoystick = (e) => {
        joyActive = false;
        joyDeltaX = 0; joyDeltaY = 0;
        joyStick.style.transform = `translate(0px, 0px)`;
        if(e && e.pointerId) joyZone.releasePointerCapture(e.pointerId);
    };
    joyZone.addEventListener('pointerup', stopJoystick);
    joyZone.addEventListener('pointercancel', stopJoystick);

    function updateJoystick(e) {
        const rect = joyZone.getBoundingClientRect();
        const centerX = rect.left + rect.width / 2;
        const centerY = rect.top + rect.height / 2;
        
        let dx = e.clientX - centerX;
        let dy = e.clientY - centerY;
        const distance = Math.hypot(dx, dy);
        
        if (distance > maxJoyRadius) {
            dx = (dx / distance) * maxJoyRadius;
            dy = (dy / distance) * maxJoyRadius;
        }
        
        joyStick.style.transform = `translate(${dx}px, ${dy}px)`;
        joyDeltaX = dx / maxJoyRadius;
        joyDeltaY = dy / maxJoyRadius;
    }

    function spawnParticles(x, y, color, count=15) {
        for(let i=0; i<count; i++) {
            particles.push({
                x: x, y: y,
                vx: (Math.random() - 0.5) * 12,
                vy: (Math.random() - 0.5) * 12,
                life: 30 + Math.random() * 20,
                maxLife: 50,
                color: color
            });
        }
    }

    function spawnFloatingText(x, y, text, color) {
        floatingTexts.push({ x, y, text, color, life: 60, maxLife: 60 });
    }

    function spawnItem() {
        if (items.length >= 3) return; // 画面内に3つまで
        const types = ['shield', 'freeze', 'bomb', 'ghost'];
        const type = types[Math.floor(Math.random() * types.length)];
        const x = Math.random() * (width - 100) + 50;
        const y = Math.random() * (height - 100) + 50;
        items.push({ x, y, type, size: 16 });
    }

    function applyItemEffect(type) {
        if (type === 'shield') {
            player.hasShield = true;
            spawnFloatingText(player.x, player.y - 20, "SHIELD!", "#3388ff");
        } else if (type === 'freeze') {
            freezeEndTime = Date.now() + 5000; // 5秒間フリーズ
            spawnFloatingText(player.x, player.y - 20, "FREEZE!", "#00ffff");
        } else if (type === 'bomb') {
            flashAlpha = 1.0;
            // 敵全滅＆パーティクル発生
            enemies.forEach(e => spawnParticles(e.x, e.y, e.color, 10));
            enemies = [];
            bullets = [];
            spawnFloatingText(player.x, player.y - 20, "BOMB!", "#ff3333");
        } else if (type === 'ghost') {
            player.isGhost = true;
            ghostEndTime = Date.now() + 6000; // 6秒間無敵
            spawnFloatingText(player.x, player.y - 20, "GHOST!", "#ffffff");
        }
    }

    function spawnEnemy() {
        if (!gameActive) return;
        
        const elapsedTime = (Date.now() - startTime) / 1000;
        
        const side = Math.floor(Math.random() * 4);
        let x, y;
        const margin = 50;
        if(side === 0) { x = Math.random() * width; y = -margin; }
        else if(side === 1) { x = width + margin; y = Math.random() * height; }
        else if(side === 2) { x = Math.random() * width; y = height + margin; }
        else { x = -margin; y = Math.random() * height; }
        
        let types = ['normal', 'normal', 'normal', 'wavy'];
        
        if (elapsedTime > 10) types.push('charger', 'wavy');
        if (elapsedTime > 20) types.push('splitter', 'shooter');
        if (elapsedTime > 30) types.push('magnet', 'charger', 'shooter');
        if (elapsedTime > 40) types.push('giant');
        
        const type = types[Math.floor(Math.random() * types.length)];
        let enemy = { x, y, type, id: Math.random() };
        
        switch(type) {
            case 'normal':
                enemy.size = 12; enemy.color = '#ff3333'; enemy.speed = 3 + (elapsedTime/15);
                break;
            case 'wavy':
                enemy.size = 12; enemy.color = '#9933ff'; enemy.speed = 2.5 + (elapsedTime/15);
                enemy.angle = 0;
                break;
            case 'charger':
                enemy.size = 14; enemy.color = '#ff8800'; 
                enemy.state = 'chase'; enemy.timer = 0; enemy.dashVx = 0; enemy.dashVy = 0;
                break;
            case 'splitter':
                enemy.size = 25; enemy.color = '#33ff33'; enemy.speed = 1.5 + (elapsedTime/20);
                break;
            case 'shooter':
                enemy.size = 16; enemy.color = '#33ccff'; enemy.speed = 2.5; enemy.timer = 0;
                break;
            case 'magnet':
                enemy.size = 18; enemy.color = '#666666'; enemy.speed = 1.0;
                break;
            case 'giant':
                enemy.size = 50; enemy.color = '#8b0000'; enemy.speed = 1.0 + (elapsedTime/30);
                break;
            case 'small':
                enemy.size = 8; enemy.color = '#aaffaa'; enemy.speed = 4.5 + (elapsedTime/15);
                break;
        }
        
        enemies.push(enemy);
        
        let spawnRate = Math.max(200, 1000 - (elapsedTime * 15));
        setTimeout(spawnEnemy, spawnRate);
    }

    function spawnBullet(x, y, vx, vy) {
        bullets.push({ x, y, vx, vy, size: 5, color: '#ff5555' });
    }

    function startGame() {
        lobby.style.display = 'none';
        uiLayer.style.display = 'flex';
        joyZone.style.display = (player.control === 'vstick') ? 'block' : 'none';

        startTime = Date.now();
        score = 0;
        enemies = [];
        bullets = [];
        particles = [];
        items = [];
        floatingTexts = [];
        
        player.x = width / 2;
        player.y = height / 2;
        player.hasShield = false;
        player.isGhost = false;
        mouseTarget.x = player.x;
        mouseTarget.y = player.y;
        
        lastItemTime = startTime;
        ghostEndTime = 0;
        freezeEndTime = 0;
        flashAlpha = 0;
        
        scoreEl.innerText = score;
        
        gameActive = true;
        spawnEnemy();
        requestAnimationFrame(gameLoop);
    }

    function restartGame() {
        gameOverArea.style.display = 'none';
        startGame();
    }

    function gameLoop() {
        if (!gameActive) return;
        const now = Date.now();
        
        score = Math.floor((now - startTime) / 1000);
        scoreEl.innerText = score;

        // アイテム出現タイマー
        if (now - lastItemTime > 10000) {
            spawnItem();
            lastItemTime = now;
        }

        // バフの時間管理
        if (player.isGhost && now > ghostEndTime) player.isGhost = false;
        let speedMult = (now < freezeEndTime) ? 0.3 : 1.0; // フリーズ時は敵の速度0.3倍

        // プレイヤー移動処理
        let dx = 0, dy = 0;
        const gamepads = navigator.getGamepads ? navigator.getGamepads() : [];
        let gp = gamepads[0];

        if(player.control === 'kb') {
            if(keys['arrowup'] || keys['w']) dy -= 1; 
            if(keys['arrowdown'] || keys['s']) dy += 1;
            if(keys['arrowleft'] || keys['a']) dx -= 1; 
            if(keys['arrowright'] || keys['d']) dx += 1;
        } else if(player.control === 'gp' && gp && gp.connected) {
            if(Math.abs(gp.axes[0]) > 0.2) dx = gp.axes[0];
            if(Math.abs(gp.axes[1]) > 0.2) dy = gp.axes[1];
        } else if(player.control === 'vstick') {
            dx = joyDeltaX;
            dy = joyDeltaY;
        } else if(player.control === 'mouse') {
            let mx = mouseTarget.x - player.x;
            let my = mouseTarget.y - player.y;
            let dist = Math.hypot(mx, my);
            if (dist > BASE_SPEED) {
                dx = mx / dist;
                dy = my / dist;
            } else if (dist > 0) {
                player.x = mouseTarget.x;
                player.y = mouseTarget.y;
            }
        }
        
        if (dx !== 0 || dy !== 0) {
            let len = Math.hypot(dx, dy);
            player.x += (dx / len) * BASE_SPEED;
            player.y += (dy / len) * BASE_SPEED;
        }
        
        player.x = Math.max(player.size, Math.min(width - player.size, player.x));
        player.y = Math.max(player.size, Math.min(height - player.size, player.y));

        // マグネット敵の引力処理
        enemies.forEach(e => {
            if (e.type === 'magnet') {
                let dist = Math.hypot(player.x - e.x, player.y - e.y);
                if (dist > 0 && dist < 400) {
                    let force = 2.0 * (1 - dist/400) * speedMult;
                    player.x += ((e.x - player.x) / dist) * force;
                    player.y += ((e.y - player.y) / dist) * force;
                }
            }
        });

        // 描画ベース
        ctx.fillStyle = 'rgba(0, 0, 0, 0.4)';
        ctx.fillRect(0, 0, width, height);

        // フリーズ中の背景エフェクト
        if (speedMult < 1.0) {
            ctx.fillStyle = 'rgba(0, 200, 255, 0.1)';
            ctx.fillRect(0, 0, width, height);
        }

        // プレイヤー描画
        ctx.globalAlpha = player.isGhost ? 0.4 : 1.0;
        ctx.fillStyle = player.isGhost ? '#aaddff' : '#ffffff';
        ctx.shadowBlur = 10;
        ctx.shadowColor = '#ffffff';
        ctx.beginPath();
        ctx.arc(player.x, player.y, player.size, 0, Math.PI*2);
        ctx.fill();
        ctx.globalAlpha = 1.0;
        ctx.shadowBlur = 0;

        // シールドエフェクト描画
        if (player.hasShield) {
            ctx.strokeStyle = '#3388ff';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.arc(player.x, player.y, player.size + 8, 0, Math.PI*2);
            ctx.stroke();
        }

        // アイテム処理と描画
        for (let i = items.length - 1; i >= 0; i--) {
            let item = items[i];
            
            // 描画
            ctx.fillStyle = (item.type === 'shield') ? '#3388ff' : 
                            (item.type === 'freeze') ? '#00ffff' :
                            (item.type === 'bomb') ? '#ff3333' : '#ffffff';
            ctx.beginPath();
            ctx.arc(item.x, item.y, item.size, 0, Math.PI*2);
            ctx.fill();
            
            ctx.fillStyle = '#000';
            ctx.font = 'bold 16px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            let char = item.type === 'shield' ? 'S' : item.type === 'freeze' ? 'F' : item.type === 'bomb' ? 'B' : 'G';
            ctx.fillText(char, item.x, item.y);

            // 当たり判定
            let dist = Math.hypot(player.x - item.x, player.y - item.y);
            if (dist < player.size + item.size) {
                applyItemEffect(item.type);
                items.splice(i, 1);
            }
        }

        for (let i = enemies.length - 1; i >= 0; i--) {
            let e = enemies[i];
            let dist = Math.hypot(player.x - e.x, player.y - e.y);
            
            if (e.type === 'normal' || e.type === 'small' || e.type === 'giant' || e.type === 'magnet') {
                if (dist > 0) {
                    e.x += ((player.x - e.x) / dist) * e.speed * speedMult;
                    e.y += ((player.y - e.y) / dist) * e.speed * speedMult;
                }
            } else if (e.type === 'wavy') {
                e.angle += 0.1 * speedMult;
                let dx = player.x - e.x;
                let dy = player.y - e.y;
                let d = Math.hypot(dx, dy);
                if (d > 0) {
                    let moveX = (dx / d) * e.speed * speedMult;
                    let moveY = (dy / d) * e.speed * speedMult;
                    e.x += moveX + Math.cos(e.angle) * (-moveY) * 0.5;
                    e.y += moveY + Math.cos(e.angle) * (moveX) * 0.5;
                }
            } else if (e.type === 'charger') {
                e.timer += 1 * speedMult;
                if (e.state === 'chase') {
                    if (dist > 0) {
                        e.x += ((player.x - e.x) / dist) * 2 * speedMult;
                        e.y += ((player.y - e.y) / dist) * 2 * speedMult;
                    }
                    if (e.timer > 120 && dist < 300) {
                        e.state = 'aim'; e.timer = 0;
                    }
                } else if (e.state === 'aim') {
                    if (e.timer > 30) {
                        e.state = 'dash'; e.timer = 0;
                        if (dist > 0) {
                            e.dashVx = ((player.x - e.x) / dist) * 15;
                            e.dashVy = ((player.y - e.y) / dist) * 15;
                        }
                    }
                } else if (e.state === 'dash') {
                    e.x += e.dashVx * speedMult; 
                    e.y += e.dashVy * speedMult;
                    if (e.timer > 40) { e.state = 'chase'; e.timer = 0; }
                }
            } else if (e.type === 'splitter') {
                if (dist > 0) {
                    e.x += ((player.x - e.x) / dist) * e.speed * speedMult;
                    e.y += ((player.y - e.y) / dist) * e.speed * speedMult;
                }
                if (dist < 150) {
                    enemies.splice(i, 1);
                    for(let j=0; j<3; j++) {
                        enemies.push({
                            x: e.x + (Math.random()-0.5)*40, 
                            y: e.y + (Math.random()-0.5)*40,
                            type: 'small', size: 8, color: '#aaffaa', speed: e.speed * 2
                        });
                    }
                    spawnParticles(e.x, e.y, e.color);
                    continue;
                }
            } else if (e.type === 'shooter') {
                e.timer += 1 * speedMult;
                if (dist < 200) {
                    e.x -= ((player.x - e.x) / dist) * e.speed * speedMult;
                    e.y -= ((player.y - e.y) / dist) * e.speed * speedMult;
                } else if (dist > 250) {
                    e.x += ((player.x - e.x) / dist) * e.speed * speedMult;
                    e.y += ((player.y - e.y) / dist) * e.speed * speedMult;
                }
                if (e.timer > 100) {
                    e.timer = 0;
                    if (dist > 0) {
                        spawnBullet(e.x, e.y, ((player.x - e.x)/dist)*6, ((player.y - e.y)/dist)*6);
                    }
                }
            }

            ctx.fillStyle = e.color;
            ctx.shadowBlur = 10;
            ctx.shadowColor = e.color;
            ctx.beginPath();
            if (e.type === 'charger' && e.state === 'aim') ctx.fillStyle = '#ffffff';
            ctx.arc(e.x, e.y, e.size, 0, Math.PI*2);
            ctx.fill();
            ctx.shadowBlur = 0;

            const hitRadius = player.size + e.size - 2;
            if (dist < hitRadius) {
                if (player.isGhost) {
                    // すり抜け
                } else if (player.hasShield) {
                    player.hasShield = false;
                    spawnParticles(e.x, e.y, e.color, 15);
                    enemies.splice(i, 1);
                } else {
                    endGame();
                    return;
                }
            }
        }

        // 弾の処理
        for (let i = bullets.length - 1; i >= 0; i--) {
            let b = bullets[i];
            b.x += b.vx * speedMult; 
            b.y += b.vy * speedMult;
            
            ctx.fillStyle = b.color;
            ctx.shadowBlur = 5;
            ctx.shadowColor = b.color;
            ctx.beginPath();
            ctx.arc(b.x, b.y, b.size, 0, Math.PI*2);
            ctx.fill();
            ctx.shadowBlur = 0;

            let dist = Math.hypot(player.x - b.x, player.y - b.y);
            if (dist < player.size + b.size - 2) {
                if (player.isGhost) {
                    // すり抜け
                } else if (player.hasShield) {
                    player.hasShield = false;
                    spawnParticles(b.x, b.y, b.color, 5);
                    bullets.splice(i, 1);
                } else {
                    endGame();
                    return;
                }
            }
            
            if(b.x < -50 || b.x > width + 50 || b.y < -50 || b.y > height + 50) {
                bullets.splice(i, 1);
            }
        }

        // パーティクルの処理
        for (let i = particles.length - 1; i >= 0; i--) {
            let p = particles[i];
            p.x += p.vx; p.y += p.vy;
            p.life--;
            
            ctx.fillStyle = p.color;
            ctx.globalAlpha = Math.max(0, p.life / p.maxLife);
            ctx.fillRect(p.x - 2, p.y - 2, 4, 4);
            ctx.globalAlpha = 1.0;

            if (p.life <= 0) particles.splice(i, 1);
        }

        // フローティングテキストの処理
        for (let i = floatingTexts.length - 1; i >= 0; i--) {
            let ft = floatingTexts[i];
            ft.y -= 1;
            ft.life--;
            
            ctx.fillStyle = ft.color;
            ctx.globalAlpha = Math.max(0, ft.life / ft.maxLife);
            ctx.font = 'bold 24px Arial';
            ctx.textAlign = 'center';
            ctx.fillText(ft.text, ft.x, ft.y);
            ctx.globalAlpha = 1.0;

            if (ft.life <= 0) floatingTexts.splice(i, 1);
        }

        // ボムのフラッシュエフェクト
        if (flashAlpha > 0) {
            ctx.fillStyle = `rgba(255, 255, 255, ${flashAlpha})`;
            ctx.fillRect(0, 0, width, height);
            flashAlpha -= 0.05;
        }

        requestAnimationFrame(gameLoop);
    }

    function endGame() {
        gameActive = false;
        joyZone.style.display = 'none';
        uiLayer.style.display = 'none';
        stopJoystick();
        
        lobby.style.display = 'flex';
        mainMenu.style.display = 'none';
        setupArea.style.display = 'none';
        lobbyTitle.style.display = 'none';
        gameOverArea.style.display = 'flex';
        
        let isNewRecord = score > savedHighScore;
        if (isNewRecord) { 
            localStorage.setItem('escape_block_high_sec', score); 
            savedHighScore = score; 
        }
        
        let text = `<span style="font-size:42px; font-weight:bold;">${score} 秒 生存</span><br><br><span style="font-size:18px; color:#aaa;">最高記録: ${savedHighScore} 秒</span>`;
        if (isNewRecord) text += `<br><br><span style="color:#ffd700; font-weight:bold; font-size:28px;">新記録達成！</span>`;
        finalScoreText.innerHTML = text;
    }
</script>
