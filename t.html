<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>サービス終了のお知らせ</title>
    <style>
        :root {
            --accent-main: #00e5ff;
            --bg-color: #0f111a;
            --text-color: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* 画面オーバーレイ基本スタイル */
        .screen-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            display: none;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            z-index: 100;
        }

        .screen-overlay.active {
            display: flex;
        }

        /* ガラス風パネル */
        .glass-panel {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        .menu-card {
            width: 90%;
            max-width: 420px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* ボタン */
        .btn-primary {
            background: linear-gradient(135deg, #00e5ff, #7b2cbf);
            color: #fff;
            border: none;
            padding: 12px 36px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-top: 15px;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 229, 255, 0.4);
        }

        .btn-primary:active {
            transform: translateY(0);
        }
    </style>
</head>
<body>

    <!-- サービス終了画面 (最前面・黒背景) -->
    <div id="screen-service-end" class="screen-overlay active" style="z-index: 999999; background: #000;">
        <!-- フェーズ1：感謝メッセージ -->
        <div class="glass-panel menu-card" id="service-end-phase1" style="display: flex;">
            <h1 style="font-size: 20px; color: #ff4b4b; line-height: 1.6; margin-bottom: 20px;">
                このゲームはサービス終了しました<br>
                今までプレイしてくださった人<br>
                ありがとうございました
            </h1>
            <button class="btn-primary" onclick="showNextPhase()">次へ</button>
        </div>

        <!-- フェーズ2：カウントダウンタイマー -->
        <div class="glass-panel menu-card" id="service-end-phase2" style="display: none;">
            <h1 style="font-size: 22px; color: var(--accent-main); margin-bottom: 15px;">後継作品公開まで</h1>
            <div id="service-end-countdown" style="font-size: 22px; font-weight: 900; color: #ff00ea; letter-spacing: 1px;">計算中...</div>
        </div>
    </div>

    <!-- タイトル画面 (裏面・非表示) -->
    <div id="screen-title" class="screen-overlay">
        <div class="glass-panel menu-card">
            <h1 style="font-size: 28px; margin-bottom: 20px;">GAME TITLE</h1>
            <button class="btn-primary">START</button>
        </div>
    </div>

    <script>
        // --- サービス終了画面の処理 ---
        let serviceEndInterval = null;

        function showNextPhase() {
            // 感謝メッセージを非表示、タイマー画面を表示
            document.getElementById('service-end-phase1').style.display = 'none';
            document.getElementById('service-end-phase2').style.display = 'flex';
            
            // ターゲット日時を設定 (10月6日 0:00 JST)
            const targetDate = new Date('2026-10-06T00:00:00+09:00').getTime();
            
            function updateServiceEndCountdown() {
                const now = Date.now();
                const diff = targetDate - now;
                
                if (diff <= 0) {
                    document.getElementById('service-end-countdown').innerText = '公開されました！';
                    if (serviceEndInterval) clearInterval(serviceEndInterval);
                    return;
                }
                
                const d = Math.floor(diff / (1000 * 60 * 60 * 24));
                const h = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const m = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
                const s = Math.floor((diff % (1000 * 60)) / 1000);
                
                document.getElementById('service-end-countdown').innerText = 
                    `${d}日 ${String(h).padStart(2, '0')}時間 ${String(m).padStart(2, '0')}分 ${String(s).padStart(2, '0')}秒`;
            }
            
            // 即時実行および1秒毎の更新設定
            updateServiceEndCountdown();
            serviceEndInterval = setInterval(updateServiceEndCountdown, 1000);
        }
    </script>
</body>
</html>
