<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>BLOCK CLASSIC - Ultimate Edition</title>
    <style>
        :root { 
            --main: #00d4ff; --accent: #ff3366; --bg: #050b10; 
            --gold: #ffd700; --panel: #1a2a3a;
        }
        body { 
            background: var(--bg); color: #fff; font-family: 'Segoe UI', sans-serif; 
            display: flex; justify-content: center; align-items: center; 
            height: 100vh; margin: 0; overflow: hidden; 
        }
        .bg-grid { 
            position: absolute; width: 200%; height: 200%; 
            background-image: linear-gradient(rgba(0, 212, 255, 0.05) 1px, transparent 1px), 
                              linear-gradient(90deg, rgba(0, 212, 255, 0.05) 1px, transparent 1px); 
            background-size: 50px 50px; transform: rotateX(60deg) translateY(-50%); 
            z-index: -1; animation: grid-move 20s linear infinite; 
        }
        @keyframes grid-move { 0% { background-position: 0 0; } 100% { background-position: 0 50px; } }

        .game-layout { 
            position: relative; display: flex; gap: 20px; padding: 30px; 
            background: rgba(10, 20, 30, 0.95); backdrop-filter: blur(20px); 
            border-radius: 25px; border: 1px solid var(--panel); box-shadow: 0 0 50px rgba(0,0,0,0.8);
        }
        
        canvas#tetris { border: 3px solid #111; background: #000; border-radius: 8px; box-shadow: 0 0 30px rgba(0,212,255,0.1); }

        .lang-drawer {
            position: absolute; top: 20px; left: 20px; z-index: 300;
            display: flex; align-items: center; gap: 10px;
            background: rgba(255, 255, 255, 0.05); padding: 5px; border-radius: 30px;
            width: 40px; height: 40px; overflow: hidden;
            transition: width 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border: 1px solid rgba(255,255,255,0.1);
        }
        .lang-drawer:hover { width: 210px; background: rgba(255, 255, 255, 0.1); }
        .lang-icon { min-width: 30px; text-align: center; font-size: 18px; cursor: default; }
        .lang-btns { display: flex; gap: 5px; opacity: 0; transition: 0.3s; }
        .lang-drawer:hover .lang-btns { opacity: 1; }

        .l-btn {
            background: transparent; color: #888; border: 1px solid transparent;
            padding: 4px 8px; border-radius: 15px; cursor: pointer; font-weight: bold; font-size: 11px;
            transition: 0.2s;
        }
        .l-btn:hover { color: #fff; }
        .l-btn.active { background: var(--main); color: #000; }

        .audio-controls { position: absolute; bottom: 20px; left: 25px; display: flex; flex-direction: column; gap: 8px; opacity: 0.4; transition: 0.3s; }
        .audio-controls:hover { opacity: 1; }
        .vol-row { display: flex; align-items: center; gap: 10px; font-size: 10px; }
        .vol-row input { width: 60px; accent-color: var(--main); }

        #timer-display { position: absolute; top: -50px; left: 50%; transform: translateX(-50%); font-size: 36px; font-weight: bold; color: var(--accent); display: none; text-shadow: 0 0 20px var(--accent); }

        .side-panel { display: flex; flex-direction: column; width: 130px; gap: 15px; }
        .info-box { background: rgba(255, 255, 255, 0.03); padding: 15px; border-radius: 15px; text-align: center; border: 1px solid rgba(255,255,255,0.05); }
        .label { font-size: 11px; color: #6a8a9a; display: block; margin-bottom: 8px; font-weight: bold; letter-spacing: 1px; }
        .val { font-size: 24px; font-weight: bold; color: var(--main); }

        #overlay { position: absolute; inset: 0; background: rgba(5, 11, 16, 0.98); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 100; border-radius: 25px; }
        .btn { padding: 16px 32px; font-size: 15px; cursor: pointer; border-radius: 12px; border: none; font-weight: bold; margin: 8px; transition: 0.3s; min-width: 200px; text-transform: uppercase; }
        .btn-main { background: var(--main); color: #000; box-shadow: 0 4px 15px rgba(0, 212, 255, 0.3); }
        .btn-mode { background: transparent; color: #fff; border: 1px solid var(--main); }
        .btn-gacha { background: transparent; color: var(--gold); border: 1px solid var(--gold); }
        .btn-quit { position: absolute; top: 20px; right: 25px; background: none; border: 1px solid var(--accent); color: var(--accent); padding: 6px 12px; font-size: 11px; cursor: pointer; border-radius: 6px; z-index: 150; }

        @keyframes gacha-bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-50px); }
        }
        @keyframes gacha-flash {
            0% { filter: brightness(1) blur(0); transform: scale(1); }
            50% { filter: brightness(5) blur(5px); transform: scale(1.4); }
            100% { filter: brightness(1) blur(0); transform: scale(1.2); }
        }
        .gacha-anim-bounce { animation: gacha-bounce 0.4s infinite ease-in-out; }
        .gacha-anim-flash { animation: gacha-flash 0.6s forwards ease-out; }

        .collection-grid {
            display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px;
            max-height: 150px; overflow-y: auto; margin-top: 20px; padding: 10px;
            background: rgba(0,0,0,0.3); border-radius: 10px;
        }
        .skin-item {
            width: 45px; height: 45px; border-radius: 8px; cursor: pointer;
            border: 2px solid #333; transition: 0.2s; position: relative;
        }
        .skin-item.owned { border-color: #555; }
        .skin-item.active { border-color: var(--main); box-shadow: 0 0 10px var(--main); }
        .skin-item.active::after { content: '✔'; position: absolute; top: -5px; right: -5px; background: var(--main); color: #000; border-radius: 50%; width: 15px; height: 15px; font-size: 10px; line-height: 15px; }
        .skin-item:not(.owned) { filter: brightness(0.2) grayscale(1); cursor: not-allowed; }
    </style>
</head>
<body>
    <div class="bg-grid"></div>

    <div class="game-layout">
        <div class="lang-drawer">
            <div class="lang-icon">🌐</div>
            <div class="lang-btns">
                <button id="l-jp" class="l-btn active" onclick="setLang('jp')">JP</button>
                <button id="l-en" class="l-btn" onclick="setLang('en')">EN</button>
                <button id="l-kr" class="l-btn" onclick="setLang('kr')">KR</button>
                <button id="l-cn" class="l-btn" onclick="setLang('cn')">CN</button>
            </div>
        </div>

        <div id="timer-display">02:00</div>

        <div class="audio-controls">
            <div class="vol-row"><span>BGM</span><input type="range" id="v-bgm" min="0" max="1" step="0.05" value="0.4"></div>
            <div class="vol-row"><span>SFX</span><input type="range" id="v-sfx" min="0" max="1" step="0.05" value="0.5"></div>
        </div>

        <button id="q-btn" class="btn-quit" style="display:none;" onclick="quitGame()" data-text="exit">QUIT</button>
        
        <div id="overlay">
            <div id="m-ui">
                <h1 style="color:var(--main); letter-spacing: 6px; font-size: 36px; margin-bottom: 10px; text-align: center;" data-text="title">BLOCK CLASSIC</h1>
                <div style="margin-bottom: 40px; text-align: center;">
                    <span style="font-size: 12px; color: #555;" data-text="wallet">BALANCE</span><br>
                    <span id="c-total" style="color:var(--gold); font-size: 42px; font-weight: bold;">0</span>
                </div>
                <button class="btn btn-main" onclick="showModes()" data-text="start">START</button><br>
                <button class="btn btn-gacha" onclick="showGacha()" data-text="gacha_btn">GACHA (100)</button>
            </div>

            <div id="mode-ui" style="display:none; text-align: center;">
                <h2 style="color:var(--main); margin-bottom: 30px;" data-text="select_mode">SELECT MODE</h2>
                <button class="btn btn-mode" onclick="startGame('endless')" data-text="mode_endless">ENDLESS</button><br>
                <button class="btn btn-mode" onclick="startGame('timer')" data-text="mode_timer">TIME ATTACK</button><br>
                <button class="btn" style="background:none; color:#555; margin-top: 20px;" onclick="showMenu()" data-text="back">BACK</button>
            </div>

            <div id="g-ui" style="display:none; text-align: center; width: 320px;">
                <div style="background: #0c141c; padding: 30px; border-radius: 20px; border: 1px solid #222;">
                    <div id="cap-box" style="height: 120px; display: flex; align-items: center; justify-content: center; margin-bottom: 10px;">
                        <div id="cap" style="width:60px; height:60px; background:linear-gradient(#ff3366 50%, #fff 50%); border-radius:50%; box-shadow: 0 10px 20px rgba(0,0,0,0.5);"></div>
                    </div>
                    <div id="gacha-result-text" style="height: 20px; margin-bottom: 15px; font-weight: bold; color: var(--gold);"></div>
                    <button id="draw-btn" class="btn btn-gacha" style="min-width: 150px;" onclick="pullGacha()" data-text="draw">DRAW</button>
                    <div id="collection-list" class="collection-grid"></div>
                </div>
                <button class="btn" style="background:none; color:#555; margin-top: 10px;" onclick="showMenu()" data-text="back">BACK</button>
            </div>

            <div id="o-ui" style="display:none; text-align: center;">
                <h2 style="color: var(--accent); font-size: 48px; margin-bottom: 10px;" data-text="gameover">OVER</h2>
                <div id="f-earn" style="font-size: 28px; color:var(--gold); margin-bottom: 40px;"></div>
                <button class="btn btn-main" onclick="showMenu()" data-text="title_back">TITLE</button>
            </div>
        </div>

        <div class="side-panel">
            <div class="info-box"><span class="label" data-text="label_hold">HOLD</span><canvas id="hold" width="100" height="100"></canvas></div>
            <div class="info-box"><span class="label" data-text="label_score">SCORE</span><div id="score" class="val">0</div></div>
        </div>
        
        <canvas id="tetris" width="300" height="600"></canvas>
        
        <div class="side-panel">
            <div class="info-box"><span class="label" data-text="label_next">NEXT</span><canvas id="next" width="100" height="100"></canvas></div>
            <div class="info-box"><span class="label" data-text="label_coin">EARN</span><div id="g-coins" class="val" style="color:var(--gold);">0</div></div>
        </div>
    </div>

<script>
/** 
 * SFX Engine 
 */
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
const vSfxInput = document.getElementById('v-sfx');

function playSFX(type) {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    const vol = parseFloat(vSfxInput.value);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    const now = audioCtx.currentTime;

    switch(type) {
        case 'move':
            osc.type = 'square'; osc.frequency.setValueAtTime(150, now); osc.frequency.exponentialRampToValueAtTime(50, now + 0.05);
            gain.gain.setValueAtTime(0.05 * vol, now); gain.gain.linearRampToValueAtTime(0, now + 0.05);
            osc.start(); osc.stop(now + 0.05); break;
        case 'rotate':
            osc.type = 'sine'; osc.frequency.setValueAtTime(400, now); osc.frequency.exponentialRampToValueAtTime(600, now + 0.1);
            gain.gain.setValueAtTime(0.1 * vol, now); gain.gain.linearRampToValueAtTime(0, now + 0.1);
            osc.start(); osc.stop(now + 0.1); break;
        case 'drop':
            osc.type = 'triangle'; osc.frequency.setValueAtTime(100, now);
            gain.gain.setValueAtTime(0.2 * vol, now); gain.gain.linearRampToValueAtTime(0, now + 0.1);
            osc.start(); osc.stop(now + 0.1); break;
        case 'clear':
            [523.25, 659.25, 783.99].forEach((f, i) => {
                const o = audioCtx.createOscillator(); const g = audioCtx.createGain();
                o.frequency.setValueAtTime(f, now + i*0.05); g.gain.setValueAtTime(0.15 * vol, now + i*0.05);
                g.gain.exponentialRampToValueAtTime(0.01, now + 0.4); o.connect(g); g.connect(audioCtx.destination);
                o.start(now + i*0.05); o.stop(now + 0.4);
            }); break;
        case 'over':
            osc.type = 'sawtooth'; osc.frequency.setValueAtTime(150, now); osc.frequency.linearRampToValueAtTime(40, now + 0.6);
            gain.gain.setValueAtTime(0.2 * vol, now); gain.gain.linearRampToValueAtTime(0, now + 0.6);
            osc.start(); osc.stop(now + 0.6); break;
        case 'gacha':
            osc.type = 'sine'; osc.frequency.setValueAtTime(800, now); osc.frequency.exponentialRampToValueAtTime(1600, now + 0.3);
            gain.gain.setValueAtTime(0.2 * vol, now); gain.gain.linearRampToValueAtTime(0, now + 0.3);
            osc.start(); osc.stop(now + 0.3); break;
    }
}

// BGM設定修正
const bgm = new Audio('Apex_Alignment.mp3'); 
bgm.loop = true;
const vBgmInput = document.getElementById('v-bgm');
vBgmInput.addEventListener('input', () => { bgm.volume = vBgmInput.value; });

const I18N = {
    jp: { title: "ブロック・クラシック", wallet: "所持コイン", start: "スタート", select_mode: "モード選択", mode_endless: "無限モード", mode_timer: "2分タイムアタック", gacha_btn: "ガチャ (100)", exit: "やめる", draw: "ガチャを引く", back: "戻る", gameover: "終了", title_back: "タイトルへ", label_hold: "ホールド", label_score: "スコア", label_next: "ネクスト", label_coin: "獲得" },
    en: { title: "BLOCK CLASSIC", wallet: "BALANCE", start: "START", select_mode: "SELECT MODE", mode_endless: "ENDLESS", mode_timer: "TIME ATTACK", gacha_btn: "GACHA (100)", exit: "QUIT", draw: "DRAW", back: "BACK", gameover: "GAME OVER", title_back: "TITLE", label_hold: "HOLD", label_score: "SCORE", label_next: "NEXT", label_coin: "EARN" },
    kr: { title: "블록 클래식", wallet: "보유 코인", start: "시작", select_mode: "모드 선택", mode_endless: "무한 모드", mode_timer: "2분 타임어택", gacha_btn: "가차 (100)", exit: "나가기", draw: "뽑기", back: "뒤로", gameover: "종료", title_back: "타이틀로", label_hold: "홀드", label_score: "점수", label_next: "다음", label_coin: "획득" },
    cn: { title: "经典俄罗斯方塊", wallet: "持有金币", start: "开始游戏", select_mode: "选择模式", mode_endless: "无尽模式", mode_timer: "2分钟挑战", gacha_btn: "扭蛋 (100)", exit: "退出", draw: "抽奖", back: "返回", gameover: "游戏结束", title_back: "返回主界面", label_hold: "持有", label_score: "得分", label_next: "下一个", label_coin: "赚取" }
};

function setLang(l) {
    document.querySelectorAll('[data-text]').forEach(el => {
        const k = el.getAttribute('data-text');
        if (I18N[l][k]) el.innerText = I18N[l][k];
    });
    document.querySelectorAll('.l-btn').forEach(b => b.classList.remove('active'));
    document.getElementById(`l-${l}`).classList.add('active');
}

const SKIN_POOL = [
    { id: 0, name: "Cyan Neo", color: "#00d4ff", rarity: "N" },
    { id: 1, name: "Rose Pink", color: "#ff3366", rarity: "N" },
    { id: 2, name: "Emerald", color: "#00ff70", rarity: "N" },
    { id: 3, name: "Solar Gold", color: "#ffd700", rarity: "R" },
    { id: 4, name: "Acid Purple", color: "#cc00ff", rarity: "R" },
    { id: 5, name: "Ghost White", color: "#ffffff", rarity: "SR" },
    { id: 6, name: "Plasma Red", color: "#ff0000", rarity: "SR" }
];

let ownedSkins = JSON.parse(localStorage.getItem('bc_owned_skins') || '[0]');
let activeSkinId = parseInt(localStorage.getItem('bc_active_skin') || '0');

const canvas = document.getElementById('tetris'), ctx = canvas.getContext('2d');
const nCtx = document.getElementById('next').getContext('2d'), hCtx = document.getElementById('hold').getContext('2d');
ctx.scale(30, 30); nCtx.scale(25, 25); hCtx.scale(25, 25);

const COLORS = [null, '#00d4ff', '#ff3366', '#00ff70', '#ffd700', '#ff8000', '#cc00ff', '#ffffff'];
const PIECES = 'ILJOTSZ'.split('');
let coins = parseInt(localStorage.getItem('bc_final_c') || '500');
let arena, player, nextT, holdT, canH, running = false, lastT = 0, dropC = 0, timeLeft = 120, timerInterval = null;

function applySkinToGame() {
    const skin = SKIN_POOL.find(s => s.id === activeSkinId);
    if(skin) COLORS[1] = skin.color;
}

function createP(t) {
    if (t === 'I') return [[0,1,0,0],[0,1,0,0],[0,1,0,0],[0,1,0,0]];
    if (t === 'L') return [[0,2,0],[0,2,0],[0,2,2]];
    if (t === 'J') return [[0,3,0],[0,3,0],[3,3,0]];
    if (t === 'O') return [[4,4],[4,4]];
    if (t === 'Z') return [[5,5,0],[0,5,5],[0,0,0]];
    if (t === 'S') return [[0,6,6],[6,6,0],[0,0,0]];
    if (t === 'T') return [[0,7,0],[7,7,7],[0,0,0]];
}

function drawM(m, o, t, ghost = false) {
    m.forEach((r, y) => r.forEach((v, x) => {
        if (v !== 0) {
            t.fillStyle = ghost ? 'rgba(255, 255, 255, 0.12)' : COLORS[v];
            t.fillRect(x + o.x + 0.05, y + o.y + 0.05, 0.9, 0.9);
            if(!ghost) { t.strokeStyle = 'rgba(0,0,0,0.3)'; t.lineWidth = 0.05; t.strokeRect(x+o.x+0.05, y+o.y+0.05, 0.9, 0.9); }
        }
    }));
}

function draw() {
    ctx.fillStyle = '#000'; ctx.fillRect(0,0,10,20);
    drawM(arena, {x:0,y:0}, ctx);
    let gy = player.pos.y;
    while(!coll(arena, {pos:{x:player.pos.x, y:gy+1}, matrix:player.matrix})) gy++;
    drawM(player.matrix, {x:player.pos.x, y:gy}, ctx, true);
    drawM(player.matrix, player.pos, ctx);
}

function coll(a, p) {
    const [m, o] = [p.matrix, p.pos];
    for(let y=0; y<m.length; ++y) for(let x=0; x<m[y].length; ++x)
        if(m[y][x]!==0 && (a[y+o.y]===undefined || a[y+o.y][x+o.x]!==0)) return true;
    return false;
}

function sweep() {
    let lines = 0;
    outer: for (let y = arena.length - 1; y >= 0; --y) {
        for (let x = 0; x < arena[y].length; ++x) if (arena[y][x] === 0) continue outer;
        arena.splice(y, 1); arena.unshift(new Array(10).fill(0));
        lines++; y++;
    }
    if (lines > 0) {
        player.score += lines * 100; player.sessionC += lines * 50;
        document.getElementById('score').innerText = player.score;
        document.getElementById('g-coins').innerText = player.sessionC;
        playSFX('clear');
    }
}

function resetP() {
    if(!nextT) nextT = PIECES[Math.random()*PIECES.length|0];
    player.type = nextT; player.matrix = createP(nextT); player.pos = {y:0, x:4};
    nextT = PIECES[Math.random()*PIECES.length|0];
    if(coll(arena, player)) endG();
    canH = true;
    nCtx.clearRect(0,0,5,5); drawM(createP(nextT), {x:0, y:0}, nCtx);
}

function playerDrop() {
    player.pos.y++;
    if (coll(arena, player)) {
        player.pos.y--;
        player.matrix.forEach((r,y)=>r.forEach((v,x)=>{if(v)arena[y+player.pos.y][x+player.pos.x]=v;}));
        playSFX('drop'); sweep(); resetP();
    }
    dropC = 0;
}

function hardDrop() {
    while(!coll(arena, {pos:{x:player.pos.x, y:player.pos.y+1}, matrix:player.matrix})) player.pos.y++;
    playerDrop();
}

function update(t=0) {
    if(!running) return;
    const dt = t - lastT; lastT = t;
    if((dropC+=dt)>800) playerDrop();
    draw(); requestAnimationFrame(update);
}

function showMenu() {
    running = false; clearInterval(timerInterval); bgm.pause();
    document.getElementById('overlay').style.display = 'flex';
    document.getElementById('m-ui').style.display = 'block';
    document.getElementById('mode-ui').style.display = 'none';
    document.getElementById('g-ui').style.display = 'none';
    document.getElementById('o-ui').style.display = 'none';
    document.getElementById('q-btn').style.display = 'none';
    document.getElementById('timer-display').style.display = 'none';
    document.getElementById('c-total').innerText = coins;
    applySkinToGame();
}

function showModes() { document.getElementById('m-ui').style.display='none'; document.getElementById('mode-ui').style.display='block'; }

function startGame(mode) {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    bgm.volume = parseFloat(vBgmInput.value); // 音量を同期
    bgm.play().catch(e => console.log("Audio play blocked")); // BGM再生[cite: 4]
    
    running = true; arena = Array.from({length:20},()=>Array(10).fill(0));
    player = {pos:{x:0,y:0}, matrix:null, score:0, sessionC:0};
    
    // 【修正点】ゲーム開始時に獲得コイン（EARN）の表示を0にリセット
    document.getElementById('g-coins').innerText = '0'; 
    document.getElementById('score').innerText = '0';

    holdT = null; hCtx.clearRect(0,0,5,5);
    document.getElementById('overlay').style.display = 'none';
    document.getElementById('q-btn').style.display = 'block';
    applySkinToGame();
    if(mode === 'timer') {
        timeLeft = 120; document.getElementById('timer-display').style.display = 'block';
        timerInterval = setInterval(() => {
            timeLeft--; let m = Math.floor(timeLeft/60), s = timeLeft%60;
            document.getElementById('timer-display').innerText = `${m}:${s<10?'0':''}${s}`;
            if(timeLeft <= 0) endG();
        }, 1000);
    }
    resetP(); update();
}

function endG() {
    if(!running) return;
    running = false; clearInterval(timerInterval); bgm.pause();
    playSFX('over');
    coins += player.sessionC; localStorage.setItem('bc_final_c', coins);
    document.getElementById('f-earn').innerText = "+" + player.sessionC;
    document.getElementById('overlay').style.display = 'flex';
    document.getElementById('o-ui').style.display = 'block';
}

function quitGame() { coins += player.sessionC; localStorage.setItem('bc_final_c', coins); showMenu(); }

function showGacha() { 
    document.getElementById('m-ui').style.display='none'; 
    document.getElementById('g-ui').style.display='block'; 
    document.getElementById('gacha-result-text').innerText = "";
    updateCollectionUI();
}

function updateCollectionUI() {
    const list = document.getElementById('collection-list');
    list.innerHTML = "";
    SKIN_POOL.forEach(skin => {
        const item = document.createElement('div');
        item.className = `skin-item ${ownedSkins.includes(skin.id) ? 'owned' : ''} ${activeSkinId === skin.id ? 'active' : ''}`;
        item.style.backgroundColor = skin.color;
        if(ownedSkins.includes(skin.id)) {
            item.onclick = () => { activeSkinId = skin.id; localStorage.setItem('bc_active_skin', activeSkinId); playSFX('move'); updateCollectionUI(); };
        }
        list.appendChild(item);
    });
}

function pullGacha() {
    if(coins < 100) return;
    const drawBtn = document.getElementById('draw-btn'); const cap = document.getElementById('cap'); const resText = document.getElementById('gacha-result-text');
    drawBtn.disabled = true; coins -= 100; localStorage.setItem('bc_final_c', coins); document.getElementById('c-total').innerText = coins;
    playSFX('gacha'); cap.className = "gacha-anim-bounce"; resText.innerText = "ROLLING..."; cap.style.background = "linear-gradient(#ff3366 50%, #fff 50%)";
    setTimeout(() => {
        const rand = Math.random(); let rarity = "N"; if(rand > 0.95) rarity = "SR"; else if(rand > 0.70) rarity = "R";
        const pool = SKIN_POOL.filter(s => s.rarity === rarity); const win = pool[Math.floor(Math.random() * pool.length)];
        cap.className = "gacha-anim-flash"; cap.style.background = win.color;
        setTimeout(() => {
            resText.innerText = `[${win.rarity}] ${win.name}`;
            if(!ownedSkins.includes(win.id)) { ownedSkins.push(win.id); localStorage.setItem('bc_owned_skins', JSON.stringify(ownedSkins)); }
            updateCollectionUI(); drawBtn.disabled = false;
        }, 300);
    }, 1200);
}

document.addEventListener('keydown', e => {
    if(!running) return;
    if(e.keyCode===37){player.pos.x--; if(coll(arena,player)){player.pos.x++;} else {playSFX('move');}} 
    if(e.keyCode===39){player.pos.x++; if(coll(arena,player)){player.pos.x--;} else {playSFX('move');}} 
    if(e.keyCode===40) playerDrop(); 
    if(e.keyCode===38){ 
        const m = player.matrix; player.matrix = m[0].map((_, i) => m.map(r => r[i]).reverse());
        if(coll(arena, player)){ player.matrix = m; } else { playSFX('rotate'); }
    }
    if(e.keyCode===32){ e.preventDefault(); hardDrop(); } 
    if(e.keyCode===67){ 
        if(!canH) return; playSFX('rotate');
        if(!holdT) { holdT = player.type; resetP(); }
        else { const t = holdT; holdT = player.type; player.type = t; player.matrix = createP(t); player.pos = {y:0, x:4}; }
        canH = false; hCtx.clearRect(0,0,5,5); drawM(createP(holdT), {x:0, y:0}, hCtx);
    }
});

setLang('jp');
showMenu();
</script>
