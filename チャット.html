<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>P2P グループチャット</title>
    <!-- P2P通信用のライブラリ PeerJS を読み込み -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        /* 全体の設定（背景黒、文字白のコンパクトなUI） */
        body {
            background-color: #121212;
            color: #e0e0e0;
            font-family: sans-serif;
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            height: 100vh;
            overflow: hidden;
        }
        * { box-sizing: inherit; }

        /* 最初の画面 */
        #start-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            overflow-y: auto;
            padding: 20px 0;
        }
        .start-container {
            background-color: #1e1e1e;
            padding: 25px;
            border-radius: 8px;
            border: 1px solid #333;
            text-align: center;
            width: 90%;
            max-width: 350px;
            position: relative;
        }
        
        /* 言語切り替え（折りたたみではない独立ボタン） */
        #lang-toggle {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
        }
        .lang-btn {
            background-color: #2a2a2a;
            border: 1px solid #555;
            color: #fff;
            padding: 5px 15px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.8em;
            width: auto;
        }
        .lang-btn.active {
            background-color: #4CAF50;
            border-color: #4CAF50;
        }

        input[type="text"] {
            background-color: #2a2a2a;
            color: #fff;
            border: 1px solid #555;
            padding: 10px;
            border-radius: 4px;
            width: 100%;
            margin-bottom: 10px;
            outline: none;
        }
        input[type="text"]:focus { border-color: #888; }
        button {
            background-color: #3a3a3a;
            color: #fff;
            border: 1px solid #555;
            padding: 10px;
            cursor: pointer;
            border-radius: 4px;
            width: 100%;
            font-weight: bold;
            transition: background-color 0.2s;
        }
        button:hover:not(:disabled) { background-color: #555; }
        button:disabled { background-color: #222; color: #777; cursor: not-allowed; }
        
        .divider {
            margin: 20px 0;
            border-bottom: 1px solid #444;
            position: relative;
        }

        /* 過去に入った部屋の履歴 */
        #recent-rooms {
            margin-top: 15px;
            text-align: left;
        }
        #recent-rooms h4 {
            margin: 0 0 10px 0;
            font-size: 0.9em;
            color: #aaa;
        }
        .room-history-list {
            list-style: none;
            padding: 0;
            margin: 0;
            max-height: 120px;
            overflow-y: auto;
        }
        .room-history-item {
            background-color: #2a2a2a;
            border: 1px solid #444;
            padding: 8px 12px;
            border-radius: 4px;
            margin-bottom: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            font-size: 0.9em;
        }
        .room-history-item:hover { background-color: #3a3a3a; }

        /* チャット画面 */
        #chat-screen {
            display: none;
            height: 100%;
            flex-direction: row;
        }
        
        /* 左側：メンバーリスト */
        #sidebar {
            width: 250px;
            background-color: #1a1a1a;
            border-right: 1px solid #333;
            display: flex;
            flex-direction: column;
        }
        #sidebar-header {
            padding: 15px;
            border-bottom: 1px solid #333;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        #room-id-display { color: #888; font-size: 0.9em; }
        #member-list {
            list-style: none;
            padding: 15px;
            margin: 0;
            overflow-y: auto;
            flex: 1;
        }
        .player-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 1px solid #2a2a2a;
        }
        .player-name { font-size: 0.95em; }
        .status-container { display: flex; align-items: center; gap: 6px; }
        .status-dot { width: 10px; height: 10px; border-radius: 50%; }
        .status-text { font-size: 0.75em; color: #aaa; }
        .online { background-color: #4CAF50; box-shadow: 0 0 5px #4CAF50; }
        .offline { background-color: #F44336; }

        /* 右側：チャットエリア */
        #chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: #121212;
            position: relative;
        }
        #messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }
        .message {
            margin-bottom: 15px;
            padding: 10px 15px;
            border-radius: 8px;
            width: fit-content;
            max-width: 80%;
            border: 1px solid #333;
            display: flex;
            flex-direction: column;
        }
        
        .message.self { align-self: flex-end; background-color: #1e3b20; border-color: #2e7d32; }
        .message.other { align-self: flex-start; background-color: #222; }
        .message.system { 
            align-self: center; 
            background-color: transparent; 
            border: none; 
            color: #888; 
            font-size: 0.85em; 
            padding: 5px; 
            margin-bottom: 10px;
        }

        .message-header-wrapper {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 6px;
            border-bottom: 1px dashed #444;
            padding-bottom: 4px;
        }
        .message-icon {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            object-fit: cover;
            background-color: #333;
        }

        .message-header { font-size: 0.8em; color: #aaa; text-align: left; }
        .message-text { line-height: 1.5; word-break: break-word; }
        .message-text.sticker { font-size: 3em; line-height: 1; margin: 5px 0; }
        .message-text a { color: #64b5f6; text-decoration: none; }
        .message-text a:hover { text-decoration: underline; }
        .message-img { max-width: 100%; border-radius: 4px; margin-top: 8px; max-height: 300px; object-fit: contain; }
        
        /* --- 新規追加: 動画表示用スタイル --- */
        .message-video { max-width: 100%; border-radius: 4px; margin-top: 8px; max-height: 300px; outline: none; }
        
        /* --- 新規追加: 削除ボタン用スタイル --- */
        .btn-delete-msg { background: transparent; border: none; color: #F44336; cursor: pointer; margin-left: auto; font-size: 0.8em; padding: 2px 5px; }
        .btn-delete-msg:hover { text-decoration: underline; background: transparent; }

        /* --- 新規追加: ホスト追加ボタン用スタイル --- */
        .host-add-btn { background-color: #4CAF50; color: white; border: none; padding: 4px 8px; border-radius: 4px; font-size: 0.75em; cursor: pointer; width: auto; }

        #input-area {
            display: flex;
            padding: 15px;
            background-color: #1a1a1a;
            border-top: 1px solid #333;
            gap: 10px;
            align-items: center;
            position: relative;
        }
        #input-area input[type="text"] { margin-bottom: 0; flex: 1; }
        .action-btn { width: 45px; font-size: 1.2em; padding: 5px; margin-bottom: 0; }
        #btn-send { width: 80px; margin-bottom: 0; }

        /* スタンプパレット */
        #sticker-palette {
            display: none;
            position: absolute;
            bottom: 70px;
            left: 15px;
            background-color: #2a2a2a;
            border: 1px solid #555;
            border-radius: 8px;
            padding: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            display: flex;
            gap: 10px;
            z-index: 1000;
        }
        .sticker-item {
            font-size: 2em;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .sticker-item:hover { transform: scale(1.2); }

        /* スマホ等の小さい画面用 */
        @media (max-width: 600px) {
            #chat-screen { flex-direction: column; }
            #sidebar { width: 100%; height: 160px; border-right: none; border-bottom: 1px solid #333; }
            #messages { padding: 10px; }
            .message { max-width: 95%; }
            .start-container { width: 95%; padding: 15px; }
        }

        /* ホスト用メニュー */
        #host-menu {
            display: none;
            position: absolute;
            top: 20px;
            left: 20px;
            background-color: #2a2a2a;
            border: 1px solid #555;
            padding: 15px;
            border-radius: 8px;
            z-index: 9999;
            cursor: move;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            width: 250px;
        }
        #host-menu h4 { margin: 0 0 10px 0; pointer-events: none; }
        #host-menu button { margin-bottom: 5px; width: 100%; }
        #lock-status { font-size: 0.8em; color: #aaa; margin: 5px 0 10px 0; pointer-events: none; }
    </style>
</head>
<body>

    <!-- ホストメニュー (xキーで表示切替) -->
    <div id="host-menu">
        <h4 data-i18n="hostMenuTitle">ホストメニュー</h4>
        <button id="btn-toggle-lock" data-i18n="closeRoom">部屋を締め切る</button>
        <p id="lock-status"><span data-i18n="currentStatus">現在の状態</span>: <span id="lock-state-text" data-i18n="statusOpen">入室可能</span></p>
        
        <!-- --- 新規追加: プレイヤー一覧機能 --- -->
        <button id="btn-show-player-list" data-i18n="playerListBtn">プレイヤー一覧</button>
        <div id="host-player-list-container" style="display: none; max-height: 150px; overflow-y: auto; margin-top: 10px; border-top: 1px solid #555; padding-top: 10px;"></div>
    </div>

    <!-- 最初の画面 -->
    <div id="start-screen">
        <div class="start-container">
            <!-- 言語切り替え -->
            <div id="lang-toggle">
                <button class="lang-btn active" id="btn-lang-ja">日本語</button>
                <button class="lang-btn" id="btn-lang-en">English</button>
            </div>

            <h2 style="margin-top: 0;">P2P Chat</h2>
            
            <!-- アイコン設定エリア -->
            <div style="margin-bottom: 15px;">
                <img id="profile-preview" src="" style="width: 64px; height: 64px; border-radius: 50%; display: none; object-fit: cover; margin: 0 auto 10px auto; border: 1px solid #555;">
                <input type="file" id="profile-icon-input" accept="image/*" style="display: none;">
                <button id="btn-select-icon" style="background-color: #2a2a2a; font-size: 0.8em; padding: 8px;" data-i18n="setIcon">アイコンを設定 (任意)</button>
            </div>

            <input type="text" id="username" placeholder="あなたの名前を入力" data-i18n-ph="enterName">
            
            <button id="btn-create-room" data-i18n="createRoomBtn">部屋を作成する</button>
            
            <div class="divider"></div>
            
            <input type="text" id="room-id-input" placeholder="4桁の部屋IDを入力" maxlength="4" pattern="\d{4}" data-i18n-ph="enterRoomId">
            <button id="btn-join-room" data-i18n="joinRoomBtn">部屋に入る</button>

            <!-- 一度入った部屋の履歴 -->
            <div id="recent-rooms">
                <div class="divider"></div>
                <h4 data-i18n="historyTitle">過去に入った部屋</h4>
                <ul id="room-history-list" class="room-history-list"></ul>
            </div>
        </div>
    </div>

    <!-- チャット画面 -->
    <div id="chat-screen">
        <div id="sidebar">
            <div id="sidebar-header">
                <span data-i18n="players">プレイヤー</span>
                <span id="room-id-display"></span>
            </div>
            <ul id="member-list"></ul>
        </div>
        <div id="chat-area">
            <div id="messages"></div>
            
            <!-- スタンプパレット -->
            <div id="sticker-palette" style="display: none;">
                <span class="sticker-item" onclick="sendSticker('👍')">👍</span>
                <span class="sticker-item" onclick="sendSticker('🙇')">🙇</span>
                <span class="sticker-item" onclick="sendSticker('🎉')">🎉</span>
                <span class="sticker-item" onclick="sendSticker('😂')">😂</span>
                <span class="sticker-item" onclick="sendSticker('✨')">✨</span>
            </div>

            <div id="input-area">
                <input type="file" id="image-input" accept="image/*" style="display: none;">
                <!-- --- 新規追加: 動画ファイル入力 --- -->
                <input type="file" id="video-input" accept="video/mp4,video/webm,video/ogg" style="display: none;">
                
                <button id="btn-image" class="action-btn" title="画像を送信">📷</button>
                <button id="btn-video" class="action-btn" title="動画を送信">🎬</button>
                <button id="btn-toggle-sticker" class="action-btn" title="スタンプ">😀</button>
                
                <input type="text" id="message-input" placeholder="メッセージを入力..." data-i18n-ph="enterMessage">
                <button id="btn-send" data-i18n="sendBtn">送信</button>
            </div>
        </div>
    </div>

    <script>
        // === セキュリティ対策（XSS対策・入力検証ユーティリティ） ===
        const Security = {
            // HTMLエンティティのエスケープ
            sanitizeHTML: function(str) {
                if (!str) return '';
                return String(str).replace(/[&<>'"]/g, tag => ({
                    '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
                }[tag]));
            },
            // 安全なDataURLかチェック（スクリプト実行等を防ぐ）
            isSafeDataURL: function(url, type) {
                if (!url || typeof url !== 'string') return false;
                return url.startsWith(`data:${type}/`);
            }
        };

        // === 言語設定 ===
        const translations = {
            ja: {
                hostMenuTitle: "ホストメニュー", closeRoom: "部屋を締め切る", openRoom: "締め切りを解除する",
                currentStatus: "現在の状態", statusOpen: "入室可能", statusClosed: "締め切り済",
                setIcon: "アイコンを設定 (任意)", enterName: "あなたの名前を入力", createRoomBtn: "部屋を作成する",
                enterRoomId: "4桁の部屋IDを入力", joinRoomBtn: "部屋に入る", historyTitle: "過去に入った部屋",
                players: "プレイヤー", enterMessage: "メッセージを入力...", sendBtn: "送信",
                connecting: "接続中...", connectingFailed: "接続失敗", offline: "オフライン", online: "オンライン",
                playerListBtn: "プレイヤー一覧", deleteBtn: "削除", addToHostBtn: "ホストに追加"
            },
            en: {
                hostMenuTitle: "Host Menu", closeRoom: "Lock Room", openRoom: "Unlock Room",
                currentStatus: "Status", statusOpen: "Open", statusClosed: "Locked",
                setIcon: "Set Icon (Optional)", enterName: "Enter your name", createRoomBtn: "Create Room",
                enterRoomId: "4-digit Room ID", joinRoomBtn: "Join Room", historyTitle: "Recent Rooms",
                players: "Players", enterMessage: "Type a message...", sendBtn: "Send",
                connecting: "Connecting...", connectingFailed: "Connection Failed", offline: "Offline", online: "Online",
                playerListBtn: "Player List", deleteBtn: "Delete", addToHostBtn: "Make Host"
            }
        };
        let currentLang = 'ja';

        function updateLanguage() {
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (translations[currentLang][key]) el.textContent = translations[currentLang][key];
            });
            document.querySelectorAll('[data-i18n-ph]').forEach(el => {
                const key = el.getAttribute('data-i18n-ph');
                if (translations[currentLang][key]) el.placeholder = translations[currentLang][key];
            });
        }

        document.getElementById('btn-lang-ja').onclick = () => {
            currentLang = 'ja';
            document.getElementById('btn-lang-ja').classList.add('active');
            document.getElementById('btn-lang-en').classList.remove('active');
            updateLanguage();
        };
        document.getElementById('btn-lang-en').onclick = () => {
            currentLang = 'en';
            document.getElementById('btn-lang-en').classList.add('active');
            document.getElementById('btn-lang-ja').classList.remove('active');
            updateLanguage();
        };

        // === アプリの基本設定・状態管理 ===
        const roomPrefix = 'p2p-groupchat-room-';
        let peer = null;
        let myName = '';
        let myIcon = ''; 
        let currentRoomId = '';
        let isHost = false;
        let isAdmin = false; // 新規追加: ホスト・共同ホスト権限フラグ
        let connections = []; 
        let members = [];     
        let hostConnection = null; 
        
        let chatHistory = []; 
        const EXPIRATION_MS = 24 * 60 * 60 * 1000; 
        let isRoomClosed = false; 
        let isReturningUser = false; 

        window.onload = () => {
            const savedInfo = JSON.parse(localStorage.getItem('p2pChatSavedInfo'));
            if (savedInfo) {
                if (savedInfo.name) document.getElementById('username').value = savedInfo.name;
                if (savedInfo.icon && Security.isSafeDataURL(savedInfo.icon, 'image')) {
                    myIcon = savedInfo.icon;
                    const preview = document.getElementById('profile-preview');
                    preview.src = myIcon;
                    preview.style.display = 'block';
                }
            }
            renderRoomHistory();
        };

        // アイコン選択処理
        document.getElementById('btn-select-icon').onclick = () => document.getElementById('profile-icon-input').click();
        document.getElementById('profile-icon-input').onchange = function(e) {
            const file = this.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (ev) => {
                myIcon = ev.target.result;
                const preview = document.getElementById('profile-preview');
                preview.src = myIcon;
                preview.style.display = 'block';
            };
            reader.readAsDataURL(file);
        };

        function saveRoomToHistory(roomId) {
            let history = JSON.parse(localStorage.getItem('p2pChatRoomHistory')) || [];
            if (!history.includes(roomId)) {
                history.unshift(roomId);
                if (history.length > 5) history.pop(); 
                localStorage.setItem('p2pChatRoomHistory', JSON.stringify(history));
            }
            localStorage.setItem('p2pChatSavedInfo', JSON.stringify({ name: myName, icon: myIcon }));
        }

        function renderRoomHistory() {
            const history = JSON.parse(localStorage.getItem('p2pChatRoomHistory')) || [];
            const listEl = document.getElementById('room-history-list');
            listEl.innerHTML = '';
            
            if (history.length === 0) {
                listEl.innerHTML = '<li style="font-size:0.8em; color:#666;">履歴はありません</li>';
                return;
            }

            history.forEach(id => {
                const li = document.createElement('li');
                li.className = 'room-history-item';
                li.innerHTML = `<span>ID: <strong>${Security.sanitizeHTML(id)}</strong></span><span style="color:#64b5f6;">→</span>`;
                li.onclick = () => {
                    document.getElementById('room-id-input').value = id;
                    isReturningUser = true; 
                    document.getElementById('btn-join-room').click();
                };
                listEl.appendChild(li);
            });
        }

        function getFormattedTime() {
            const now = new Date();
            const month = now.getMonth() + 1;
            const date = now.getDate();
            const hours = now.getHours().toString().padStart(2, '0');
            const minutes = now.getMinutes().toString().padStart(2, '0');
            return `${month}/${date} ${hours}:${minutes}`;
        }

        function generateMsgId() { return 'msg_' + Date.now() + '_' + Math.random().toString(36).substr(2, 5); }

        function saveMessageToLocal(msgData) {
            if (!chatHistory.some(m => m.id === msgData.id)) {
                chatHistory.push(msgData);
                // ローカルストレージの容量上限対策
                let saved = false;
                while (!saved && chatHistory.length > 0) {
                    try {
                        localStorage.setItem('p2pChatHistory_' + currentRoomId, JSON.stringify(chatHistory));
                        saved = true;
                    } catch (e) {
                        const removedMsg = chatHistory.shift();
                        const el = document.getElementById(removedMsg.id);
                        if (el) el.remove(); 
                    }
                }
            }
        }

        function loadLocalHistory(roomId) {
            const savedHistory = localStorage.getItem('p2pChatHistory_' + roomId);
            if (savedHistory) {
                chatHistory = JSON.parse(savedHistory);
                chatHistory.forEach(msg => displayMessage(msg));
            }
        }

        // --- 新規追加: メッセージのローカル削除処理 ---
        function removeMessageLocally(msgId) {
            const el = document.getElementById(msgId);
            if (el) el.remove();
            chatHistory = chatHistory.filter(m => m.id !== msgId);
            try { localStorage.setItem('p2pChatHistory_' + currentRoomId, JSON.stringify(chatHistory)); } catch(e) {}
        }
        
        // --- 新規追加: メッセージ削除リクエスト処理 ---
        function deleteMessage(msgId) {
            removeMessageLocally(msgId);
            if (isHost) {
                broadcastMessage({ type: 'delete-msg', msgId: msgId });
            } else if (isAdmin && hostConnection && hostConnection.open) {
                hostConnection.send({ type: 'request-delete-msg', msgId: msgId });
            }
        }

        // ホストメニュー制御
        const hostMenu = document.getElementById('host-menu');
        let isDragging = false, dragOffsetX = 0, dragOffsetY = 0;
        hostMenu.addEventListener('mousedown', (e) => {
            if (e.target.tagName.toLowerCase() === 'button') return; 
            isDragging = true;
            const rect = hostMenu.getBoundingClientRect();
            dragOffsetX = e.clientX - rect.left;
            dragOffsetY = e.clientY - rect.top;
        });
        document.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            hostMenu.style.left = (e.clientX - dragOffsetX) + 'px';
            hostMenu.style.top = (e.clientY - dragOffsetY) + 'px';
        });
        document.addEventListener('mouseup', () => isDragging = false);
        document.addEventListener('keydown', (e) => {
            // ホストだけでなく共同ホスト(isAdmin)もメニューを開けるように変更
            if (e.key === 'x' && isAdmin) {
                const active = document.activeElement.tagName.toLowerCase();
                if (active === 'input' || active === 'textarea') return;
                hostMenu.style.display = hostMenu.style.display === 'none' ? 'block' : 'none';
            }
        });
        document.getElementById('btn-toggle-lock').onclick = () => {
            isRoomClosed = !isRoomClosed;
            const statusEl = document.getElementById('lock-state-text');
            const btnEl = document.getElementById('btn-toggle-lock');
            if (isRoomClosed) {
                statusEl.textContent = translations[currentLang].statusClosed;
                statusEl.style.color = '#F44336';
                btnEl.textContent = translations[currentLang].openRoom;
            } else {
                statusEl.textContent = translations[currentLang].statusOpen;
                statusEl.style.color = '#aaa';
                btnEl.textContent = translations[currentLang].closeRoom;
            }
        };

        // --- 新規追加: プレイヤー一覧とホスト追加 ---
        document.getElementById('btn-show-player-list').onclick = () => {
            const container = document.getElementById('host-player-list-container');
            if (container.style.display === 'block') {
                container.style.display = 'none';
                return;
            }
            container.style.display = 'block';
            container.innerHTML = '';
            
            let hasOtherPlayers = false;
            members.forEach(m => {
                if (m.peerId === peer.id || m.peerId === 'self' || m.peerId.startsWith('offline-')) return;
                hasOtherPlayers = true;
                
                const div = document.createElement('div');
                div.style.display = 'flex';
                div.style.justifyContent = 'space-between';
                div.style.alignItems = 'center';
                div.style.marginBottom = '8px';
                
                const nameSpan = document.createElement('span');
                nameSpan.textContent = m.name;
                nameSpan.style.fontSize = '0.9em';
                
                const addBtn = document.createElement('button');
                addBtn.className = 'host-add-btn';
                addBtn.textContent = translations[currentLang].addToHostBtn || "ホストに追加";
                addBtn.onclick = () => {
                    if (isHost) {
                        const conn = connections.find(c => c.peer === m.peerId);
                        if (conn && conn.open) {
                            conn.send({ type: 'grant-admin' });
                            alert(`${m.name} にホスト権限を付与しました。`);
                        }
                    } else if (isAdmin && hostConnection && hostConnection.open) {
                        hostConnection.send({ type: 'request-grant-admin', targetPeerId: m.peerId });
                        alert(`${m.name} へのホスト権限付与をリクエストしました。`);
                    }
                };
                
                div.appendChild(nameSpan);
                div.appendChild(addBtn);
                container.appendChild(div);
            });
            
            if (!hasOtherPlayers) {
                container.innerHTML = '<span style="font-size:0.8em; color:#aaa;">他のプレイヤーがいません</span>';
            }
        };

        // 部屋を作成（ホストの処理）
        document.getElementById('btn-create-room').onclick = () => {
            myName = document.getElementById('username').value.trim();
            if (!myName) return alert(currentLang === 'ja' ? '名前を入力してください' : 'Please enter your name');
            
            const btn = document.getElementById('btn-create-room');
            const origText = btn.textContent;
            btn.disabled = true;
            btn.textContent = translations[currentLang].connecting;
            
            const roomId = Math.floor(1000 + Math.random() * 9000).toString();
            currentRoomId = roomId;
            saveRoomToHistory(roomId);
            
            peer = new Peer(roomPrefix + roomId);
            isHost = true;
            isAdmin = true; // 作成者は管理者
            
            peer.on('open', (id) => {
                btn.disabled = false;
                btn.textContent = origText;
                alert(`ID: 【 ${roomId} 】\n※「x」キーでホストメニューが開きます。`);
                addOrUpdateMember(id, myName, 'online');
                showChatScreen(`ID: ${roomId}`);
                loadLocalHistory(roomId);
                startMessageCleanup();
                
                // システムメッセージ表示
                sendSystemMessage(`${myName} が部屋を作成しました。`);
            });

            peer.on('error', (err) => {
                btn.disabled = false;
                btn.textContent = origText;
                alert('Error: ' + err.message);
            });
            
            peer.on('connection', (conn) => {
                connections.push(conn);
                
                conn.on('data', (data) => {
                    if (data.type === 'join') {
                        if (isRoomClosed && !data.isReturning) {
                            conn.send({ type: 'rejected', reason: 'Room is closed.' });
                            setTimeout(() => conn.close(), 500);
                            return;
                        }
                        addOrUpdateMember(conn.peer, data.name, 'online');
                        broadcastMembers();
                        conn.send({ type: 'history', history: chatHistory });
                        sendSystemMessage(`${data.name} が入室しました。`);
                    } else if (data.type === 'chat') {
                        const msgData = {
                            id: data.id || generateMsgId(), type: 'chat',
                            senderName: getMemberName(conn.peer), senderIcon: data.senderIcon,
                            text: data.text, image: data.image, video: data.video, isSticker: data.isSticker,
                            time: getFormattedTime(), timestamp: Date.now()
                        };
                        saveMessageToLocal(msgData);
                        broadcastMessage(msgData);
                        displayMessage(msgData);
                    } 
                    // --- 新規追加: クライアントからの削除・権限付与リクエスト ---
                    else if (data.type === 'request-delete-msg') {
                        removeMessageLocally(data.msgId);
                        broadcastMessage({ type: 'delete-msg', msgId: data.msgId });
                    } else if (data.type === 'request-grant-admin') {
                        const targetConn = connections.find(c => c.peer === data.targetPeerId);
                        if (targetConn && targetConn.open) {
                            targetConn.send({ type: 'grant-admin' });
                        }
                    }
                });
                
                conn.on('close', () => {
                    const memberName = getMemberName(conn.peer);
                    addOrUpdateMember(conn.peer, null, 'offline');
                    connections = connections.filter(c => c.peer !== conn.peer);
                    broadcastMembers();
                    sendSystemMessage(`${memberName} が退出しました。`);
                });
            });
        };

        // 部屋に入る（クライアントの処理）
        document.getElementById('btn-join-room').onclick = (e) => {
            myName = document.getElementById('username').value.trim();
            if (!myName) return alert(currentLang === 'ja' ? '名前を入力してください' : 'Please enter your name');
            
            const roomId = document.getElementById('room-id-input').value.trim();
            if (roomId.length !== 4 || isNaN(roomId)) return alert('Invalid ID');
            
            const btn = document.getElementById('btn-join-room');
            const origText = btn.textContent;
            btn.disabled = true;
            btn.textContent = translations[currentLang].connecting;

            if (e && e.isTrusted) isReturningUser = false; 

            currentRoomId = roomId;
            saveRoomToHistory(roomId);

            peer = new Peer();
            isHost = false;
            isAdmin = false;
            
            peer.on('open', () => {
                hostConnection = peer.connect(roomPrefix + roomId);
                
                hostConnection.on('open', () => {
                    btn.disabled = false;
                    btn.textContent = origText;
                    hostConnection.send({ type: 'join', name: myName, isReturning: isReturningUser });
                    showChatScreen(`ID: ${roomId}`);
                    loadLocalHistory(roomId); 
                    startMessageCleanup();
                });
                
                hostConnection.on('data', (data) => {
                    if (data.type === 'members') {
                        members = data.members;
                        updateMemberList();
                    } else if (data.type === 'chat' || data.type === 'system') {
                        saveMessageToLocal(data);
                        displayMessage(data);
                    } else if (data.type === 'history') {
                        data.history.forEach(msg => {
                            saveMessageToLocal(msg);
                            displayMessage(msg);
                        });
                    } else if (data.type === 'rejected') {
                        alert(data.reason);
                        document.getElementById('start-screen').style.display = 'flex';
                        document.getElementById('chat-screen').style.display = 'none';
                        if(hostConnection) hostConnection.close();
                    } 
                    // --- 新規追加: ホストからの削除・権限付与通知 ---
                    else if (data.type === 'delete-msg') {
                        removeMessageLocally(data.msgId);
                    } else if (data.type === 'grant-admin') {
                        isAdmin = true;
                        alert('ホスト権限が付与されました。\n※「x」キーでホストメニューが開けます。');
                        // 既存メッセージに削除ボタンを追加
                        document.querySelectorAll('.message-header-wrapper').forEach(wrapper => {
                            if (!wrapper.querySelector('.btn-delete-msg')) {
                                const msgDiv = wrapper.closest('.message');
                                if (msgDiv && !msgDiv.classList.contains('system')) {
                                    const delBtn = document.createElement('button');
                                    delBtn.className = 'btn-delete-msg';
                                    delBtn.textContent = translations[currentLang].deleteBtn || '削除';
                                    delBtn.onclick = () => deleteMessage(msgDiv.id);
                                    wrapper.appendChild(delBtn);
                                }
                            }
                        });
                    }
                });
                
                hostConnection.on('close', () => {
                    alert('Disconnected from host.');
                    members.forEach(m => m.status = 'offline');
                    updateMemberList();
                    document.getElementById('room-id-display').textContent = `ID: ${currentRoomId} (Offline)`;
                });
            });
            
            peer.on('error', (err) => {
                btn.disabled = false;
                btn.textContent = origText;
                if (err.type === 'peer-unavailable') {
                    showChatScreen(`ID: ${roomId} (Offline)`);
                    loadLocalHistory(roomId);
                    
                    addOrUpdateMember('self', myName, 'offline');
                    chatHistory.forEach(msg => {
                        if (msg.senderName && msg.senderName !== myName) {
                            addOrUpdateMember('offline-' + msg.senderName, msg.senderName, 'offline');
                        }
                    });

                    members.forEach(m => m.status = 'offline');
                    updateMemberList();
                } else alert('Error: ' + err.message);
            });
        };

        function addOrUpdateMember(peerId, name, status) {
            const existingIndex = members.findIndex(m => m.peerId === peerId || (name && m.name === name));
            if (existingIndex !== -1) {
                members[existingIndex].peerId = peerId;
                members[existingIndex].status = status;
                if (name) members[existingIndex].name = name;
            } else {
                members.push({ peerId: peerId, name: name || 'Unknown', status: status });
            }
            updateMemberList();
        }

        function startMessageCleanup() {
            setInterval(() => {
                const now = Date.now();
                const initialCount = chatHistory.length;
                chatHistory = chatHistory.filter(msg => {
                    const isExpired = now - msg.timestamp > EXPIRATION_MS;
                    if (isExpired) {
                        const el = document.getElementById(msg.id);
                        if (el) el.remove();
                    }
                    return !isExpired;
                });
                if (chatHistory.length !== initialCount) {
                    try { localStorage.setItem('p2pChatHistory_' + currentRoomId, JSON.stringify(chatHistory)); } catch(e) {}
                }
            }, 60000); 
        }

        function broadcastMembers() {
            connections = connections.filter(conn => conn.open);
            connections.forEach(conn => conn.send({ type: 'members', members: members }));
            updateMemberList();
        }

        function broadcastMessage(msgData) {
            connections = connections.filter(conn => conn.open);
            connections.forEach(conn => conn.send(msgData));
        }

        function getMemberName(peerId) {
            const member = members.find(m => m.peerId === peerId);
            return member ? member.name : 'Unknown';
        }

        function showChatScreen(roomText) {
            document.getElementById('start-screen').style.display = 'none';
            document.getElementById('chat-screen').style.display = 'flex';
            document.getElementById('room-id-display').textContent = roomText;
            document.getElementById('message-input').disabled = false;
            document.getElementById('btn-send').disabled = false;
            document.getElementById('btn-image').disabled = false;
            document.getElementById('btn-video').disabled = false; // 新規追加
        }

        function updateMemberList() {
            const list = document.getElementById('member-list');
            list.innerHTML = '';
            members.forEach(member => {
                const li = document.createElement('li');
                li.className = 'player-item';
                
                const nameSpan = document.createElement('span');
                nameSpan.className = 'player-name';
                nameSpan.textContent = Security.sanitizeHTML(member.name); // セキュリティ強化
                
                const statusContainer = document.createElement('div');
                statusContainer.className = 'status-container';
                
                const statusDot = document.createElement('span');
                statusDot.className = 'status-dot ' + (member.status === 'online' ? 'online' : 'offline');
                
                const statusText = document.createElement('span');
                statusText.className = 'status-text';
                statusText.textContent = member.status === 'online' ? translations[currentLang].online : translations[currentLang].offline;
                
                statusContainer.appendChild(statusDot);
                statusContainer.appendChild(statusText);
                
                li.appendChild(nameSpan);
                li.appendChild(statusContainer);
                list.appendChild(li);
            });
        }

        // スタンプ機能
        document.getElementById('btn-toggle-sticker').onclick = () => {
            const pal = document.getElementById('sticker-palette');
            pal.style.display = pal.style.display === 'none' || pal.style.display === '' ? 'flex' : 'none';
        };

        function sendSticker(stickerEmoji) {
            document.getElementById('sticker-palette').style.display = 'none';
            sendMessage(null, stickerEmoji, true);
        }

        // メッセージと画像・動画送信処理
        document.getElementById('btn-send').onclick = () => sendMessage();
        document.getElementById('message-input').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });

        // 画像送信 (サイズ制限を追加し安全に)
        document.getElementById('btn-image').onclick = () => document.getElementById('image-input').click();
        document.getElementById('image-input').onchange = function(e) {
            const file = this.files[0];
            if (!file) return;
            if (file.size > 5 * 1024 * 1024) { // 5MB制限
                alert('画像サイズは5MB以下にしてください。');
                this.value = '';
                return;
            }
            const reader = new FileReader();
            reader.onload = (ev) => {
                sendMessage(ev.target.result);
                this.value = '';
            };
            reader.readAsDataURL(file);
        };

        // --- 新規追加: 動画送信 ---
        document.getElementById('btn-video').onclick = () => document.getElementById('video-input').click();
        document.getElementById('video-input').onchange = function(e) {
            const file = this.files[0];
            if (!file) return;
            if (file.size > 30 * 1024 * 1024) { // 動画のローカル保存パンクを防ぐための30MB制限
                alert('フリーズ防止のため、動画サイズは30MB以下にしてください。');
                this.value = '';
                return;
            }
            const reader = new FileReader();
            reader.onload = (ev) => {
                sendMessage(null, null, false, ev.target.result);
                this.value = '';
            };
            reader.readAsDataURL(file);
        };

        function sendSystemMessage(text) {
            const msgData = {
                id: generateMsgId(), type: 'system', text: text,
                time: getFormattedTime(), timestamp: Date.now()
            };
            saveMessageToLocal(msgData);
            displayMessage(msgData);
            if (isHost) broadcastMessage(msgData);
        }

        function sendMessage(imageData = null, textOverride = null, isSticker = false, videoData = null) {
            const input = document.getElementById('message-input');
            const text = textOverride || input.value.trim();
            if (!text && !imageData && !videoData) return;
            
            const msgData = {
                id: generateMsgId(), type: 'chat', senderName: myName, senderIcon: myIcon,
                text: text, image: imageData, video: videoData, isSticker: isSticker,
                time: getFormattedTime(), timestamp: Date.now()
            };

            if (isHost) {
                saveMessageToLocal(msgData); displayMessage(msgData); broadcastMessage(msgData);
            } else {
                saveMessageToLocal(msgData); displayMessage(msgData);
                if (hostConnection && hostConnection.open) hostConnection.send(msgData);
            }
            if (!textOverride) input.value = '';
        }

        function displayMessage(data) {
            if (document.getElementById(data.id)) return;

            const msgDiv = document.createElement('div');
            msgDiv.className = 'message';
            msgDiv.id = data.id;

            if (data.type === 'system') {
                msgDiv.classList.add('system');
                msgDiv.textContent = data.text; // テキストプロパティ直接代入でXSS防止
            } else {
                if (data.senderName === myName) msgDiv.classList.add('self');
                else msgDiv.classList.add('other');
                
                const headerWrapper = document.createElement('div');
                headerWrapper.className = 'message-header-wrapper';

                // セキュリティ: 画像データの検証
                if (data.senderIcon && Security.isSafeDataURL(data.senderIcon, 'image')) {
                    const iconImg = document.createElement('img');
                    iconImg.className = 'message-icon';
                    iconImg.src = data.senderIcon;
                    headerWrapper.appendChild(iconImg);
                }

                const headerText = document.createElement('div');
                headerText.className = 'message-header';
                headerText.style.borderBottom = 'none'; 
                headerText.style.marginBottom = '0';
                headerText.style.paddingBottom = '0';
                headerText.textContent = `${data.senderName} - ${data.time}`; // 自動サニタイズ
                
                headerWrapper.appendChild(headerText);

                // --- 新規追加: ホスト用の削除ボタン ---
                if (isAdmin) {
                    const delBtn = document.createElement('button');
                    delBtn.className = 'btn-delete-msg';
                    delBtn.textContent = translations[currentLang].deleteBtn || '削除';
                    delBtn.onclick = () => deleteMessage(data.id);
                    headerWrapper.appendChild(delBtn);
                }

                msgDiv.appendChild(headerWrapper);

                if (data.text) {
                    const body = document.createElement('div');
                    body.className = data.isSticker ? 'message-text sticker' : 'message-text';
                    // セキュリティ強化されたサニタイズ処理
                    const escapedText = Security.sanitizeHTML(data.text);
                    const urlRegex = /(https?:\/\/[^\s"'<>]+)/g;
                    body.innerHTML = escapedText.replace(urlRegex, '<a href="$1" target="_blank" rel="noopener noreferrer">$1</a>');
                    msgDiv.appendChild(body);
                }

                if (data.image && Security.isSafeDataURL(data.image, 'image')) {
                    const img = document.createElement('img');
                    img.className = 'message-img';
                    img.src = data.image;
                    msgDiv.appendChild(img);
                }
                
                // --- 新規追加: 動画表示 ---
                if (data.video && Security.isSafeDataURL(data.video, 'video')) {
                    const vid = document.createElement('video');
                    vid.className = 'message-video';
                    vid.src = data.video;
                    vid.controls = true;
                    msgDiv.appendChild(vid);
                }
            }
            
            const messagesArea = document.getElementById('messages');
            messagesArea.appendChild(msgDiv);
            messagesArea.scrollTop = messagesArea.scrollHeight;
        }
    </script>
</body>
</html>
